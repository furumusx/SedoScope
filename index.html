<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SedoScope">
<meta name="theme-color" content="#0f766e">
<title>SedoScope</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#14201d;--mu:#5d6b67;--ac:#0f766e;--ok:#15803d;--ng:#b91c1c;--bd:#d6dfdb;--wn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#0d1412;--card:#17211e;--tx:#e8efec;--mu:#97a6a1;--ac:#2dd4bf;--ok:#4ade80;--ng:#f87171;--bd:#2b3a36;--wn:#fbbf24}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Hiragino Sans",sans-serif;padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:15px;margin:18px 0 6px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.big{font-size:22px;font-weight:700}.mu{color:var(--mu);font-size:13px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;min-height:46px;font:inherit;font-size:16px;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;font-weight:600;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}button.d{color:var(--ng)}
.row{display:flex;gap:8px;margin-top:10px}.row.dz{margin-top:36px}.row>*{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.chips button{min-height:44px;white-space:nowrap;border-radius:18px;font-size:14px}.chips .on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.ok{color:var(--ok)}.ng{color:var(--ng)}.wn{color:var(--wn)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;min-height:56px;background:none;font-size:12px}nav .on{color:var(--ac)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.bd{display:inline-block;font-size:12px;padding:0 8px;border-radius:9px;border:1px solid var(--bd);margin-right:4px;white-space:nowrap}
.bd.th{color:var(--ok);border-color:var(--ok)}.bd.tm{color:var(--wn);border-color:var(--wn)}.bd.tl{color:var(--ng);border-color:var(--ng)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}.tbl th,.tbl td{padding:7px 3px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}.tbl th{font-size:12px;color:var(--mu);font-weight:600}.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.best td{font-weight:700}
.lb{display:flex;align-items:center;justify-content:center;min-height:46px;padding:0 10px;border:1px solid var(--bd);border-radius:12px;color:var(--ac);text-decoration:none;font-weight:600;background:var(--card);font-size:14px;text-align:center}
summary{min-height:46px;display:flex;align-items:center;font-weight:600;cursor:pointer;color:var(--ac)}
.vd{text-decoration:line-through;opacity:.6}
.lim{font-size:30px;font-weight:800}
#scan{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(16px + env(safe-area-inset-bottom))}
.vwrap{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;margin:8px 0}
#svid{width:100%;height:100%;object-fit:cover}.guide{position:absolute;left:8%;right:8%;top:36%;height:28%;border:2px solid #2dd4bf;border-radius:8px}
#sstat{font-size:17px;font-weight:600;margin:6px 0;min-height:26px}
</style></head><body>
<main></main><nav></nav>
<div id="scan" hidden><b>バーコード読み取り</b>
<div class="vwrap"><video id="svid" playsinline muted autoplay></video><div class="guide"></div></div>
<div id="sstat"></div>
<div class="row"><button id="sretry" data-a="sretry">カメラを起動</button><button id="sstop" data-a="sstop" hidden>カメラを停止</button><button data-a="sclose">閉じる</button></div>
<label>カメラが使えない・読めないときは、コードを手入力</label>
<div class="row"><input id="mcode" inputmode="numeric" placeholder="JAN・ISBN(数字)"><button class="p" data-a="suse" style="flex:0 0 72px">使う</button></div>
<p class="mu">読み取るのはコードだけです。商品名・価格は自動では入りません(本のISBNは書名を調べられる場合があります)。</p></div>
<script>
/* SedoScope v3(シンプル版)
   保存キー sedoscope_v1 と既存データはそのまま使う。既存の項目は削除・変更しない。
   v3で増える項目: 商品 … genre(ジャンル) ship(送料) pr/pa(ラクマ/ヤフオク想定売価) lc/lp/ldate(出品先/出品価格/出品日)
                  設定 … trate(目標利益率) rr/ra(ラクマ/ヤフオク手数料率) ship(送料初期値) */
const KEY='sedoscope_v1';
const ST={cand:'仕入れ候補',bought:'仕入れ済み',listed:'出品中',sold:'売却済み'};
const CH={m:'メルカリ',y:'Yahoo!フリマ',r:'楽天ラクマ',a:'ヤフオク'},CK=Object.keys(CH);
const SVN={m:'メルカリ',y:'Yahoo!フリマ',r:'楽天ラクマ',a:'Yahoo!オークション'}; /* 相場記録に保存するサービス名(以前の版と同じ) */
const SVC={'メルカリ':'m','Yahoo!フリマ':'y','楽天ラクマ':'r','Yahoo!オークション':'a','ヤフオク':'a'};
const GEN=['漫画','本','CD','DVD・ブルーレイ','トレカ','ゲーム','その他'];
const CONDS=['','新品・未使用','未使用に近い','目立った傷や汚れなし','やや傷や汚れあり','傷や汚れあり','全体的に状態が悪い'];
const STORES=['ブックオフ','セカンドストリート'];
const KL={sold:'売り切れ',listing:'出品中'},TL={h:'高',m:'中',l:'低'};
const NUM=['cost','ship','pack','other','pm','py','pr','pa','lp','ap','afee','aship','apack','aother'];
let db,view='res',prev='res',cur=null,saveOK=true;
let lf='cand',ls='new',l30=false,lq='';
let rq='',rob=null,rid=0,qc='m',qk='sold',imp=null,qOpen=false;
const $=s=>document.querySelector(s);
const def=()=>({items:[],set:{target:1000,trate:30,rm:null,ry:null,rr:null,ra:null,ship:0,pack:0,other:0},meta:{lastBackup:null,changes:0}});
const N=s=>{if(s==null)return null;s=String(s).replace(/[０-９．]/g,c=>c==='．'?'.':String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[,，円¥\s]/g,'');if(s==='')return null;const n=Number(s);return isFinite(n)?n:null};
const yen=n=>n==null?'—':(n<0?'-':'')+'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP');
const pct=n=>n==null?'—':Math.round(n)+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ds(new Date());
const nowL=()=>{const d=new Date();return today()+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const fdt=s=>s?String(s).replace('T',' '):'';
const dayAgo=s=>{const t=new Date(String(s).slice(0,10)+'T00:00').getTime();return isFinite(t)?Math.max(0,Math.floor((new Date(today()+'T00:00')-t)/864e5)):9999};
const feeOf=(p,r)=>Math.floor(+(p*r/100).toFixed(6));
const med=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):null};
const byD=(x,y)=>String(x.d).localeCompare(String(y.d))||String(x.t).localeCompare(String(y.t));
const ean=t=>{const d=[...t].map(Number),c=d.pop();let x=0;d.reverse().forEach((v,i)=>x+=v*(i%2?1:3));return (10-x%10)%10===c};
const norm=s=>String(s==null?'':s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[Ｘｘ]/g,'X').replace(/[-\s]/g,'').toUpperCase();
function chkCode(raw){const t=norm(raw);
 if(/^\d{13}$/.test(t)){if(/^19[12]/.test(t))return{ok:false,msg:'これは本の下段バーコード(分類・価格)です。上段の「978」か「979」で始まるバーコードを読み取ってください。'};return ean(t)?{ok:true,code:t}:{ok:false}}
 if(/^\d{12}$/.test(t))return ean(t)?{ok:true,code:'0'+t}:{ok:false};
 if(/^\d{8}$/.test(t))return ean(t)?{ok:true,code:t}:{ok:false};
 if(/^\d{9}[\dX]$/.test(t)){let x=0;[...t].forEach((c,i)=>x+=(c==='X'?10:+c)*(10-i));if(x%11)return{ok:false,msg:'ISBN-10の検査数字が合いません。入力を確認してください。'};const b='978'+t.slice(0,9);let y=0;[...b].forEach((c,i)=>y+=+c*(i%2?3:1));return{ok:true,code:b+(10-y%10)%10}}
 return{ok:false,msg:'JAN(13桁・8桁)またはISBN(13桁・10桁)の数字を入力してください。'}}
const nc=s=>{const t=norm(s);const r=chkCode(t);return r.ok?r.code:t};
const dup=(c,id)=>c?db.items.find(i=>i.id!==id&&i.code&&nc(i.code)===c):null;
function load(){try{const r=localStorage.getItem(KEY);db=r?JSON.parse(r):def()}catch(e){db=def();saveOK=false}
 if(!db||typeof db!=='object')db=def();if(!Array.isArray(db.items))db.items=[];
 const hadShip=db.set&&db.set.ship!=null;db.set=Object.assign(def().set,db.set);db.meta=Object.assign(def().meta,db.meta);
 if(!hadShip)db.set.ship=N(db.set.sm)||0;
 CK.forEach(c=>{const k='r'+c;if(!(db.set[k]>=0&&db.set[k]<100))db.set[k]=null});if(!(db.set.trate>=0&&db.set.trate<100))db.set.trate=30;
 /* 以前の版の商品: 送料・ジャンルを補う(元の項目は消さない) */
 db.items.forEach(i=>{if(i.ship==null){const v=i.sm!=null&&i.sm!==''?i.sm:i.sy;i.ship=v==null?'':String(v)}if(i.genre==null)i.genre=GEN.includes(i.cat)?i.cat:''})}
function save(skip){if(!skip)db.meta.changes++;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){saveOK=false;alert('保存できません。プライベートブラウズ中か容量不足の可能性があります。バックアップを取ってください。')}}
function touch(){cur.updated=new Date().toISOString();save()}

/* ===== 相場・信頼度・売れやすさ ===== */
const qOf=i=>Array.isArray(i.quotes)?i.quotes:[];
const qch=q=>SVC[q.svc]||null;
/* 同じ出品を2回記録した場合の二重カウント防止(出品タイトルがある記録のみ) */
const dd=a=>{const s=new Set();return a.filter(x=>{if(!x.title)return true;const k=[x.svc,x.kind,x.price,x.title].join('\u0001');if(s.has(k))return false;s.add(k);return true})};
function speed(s,l){if(s+l<5)return null;const r=l?s/l:Infinity;return r>=2?{k:'ok',t:'売れやすい'}:r>=0.7?{k:'',t:'普通'}:{k:'ng',t:'売れにくい'}}
function mkt(i,c){
 const a=dd(qOf(i).filter(q=>!q.void&&qch(q)===c)),rc=a.filter(q=>dayAgo(q.d)<=30);
 const r={c,s30:rc.filter(q=>q.kind==='sold').length,l30:rc.filter(q=>q.kind==='listing').length,n:0,why:[]};r.sp=speed(r.s30,r.l30);
 const sold=a.filter(q=>q.kind==='sold');if(!sold.length)return r;
 let use=sold,mixed=false;
 if(i.cond){const same=sold.filter(q=>q.cond===i.cond);if(same.length)use=same;else mixed=true}
 else mixed=new Set(sold.map(q=>q.cond||'')).size>1;
 use=use.slice().sort(byD).reverse().slice(0,20); /* 新しい順に最大20件 */
 const p=use.map(q=>q.price);Object.assign(r,{n:use.length,p:med(p),min:Math.min(...p),max:Math.max(...p),age:dayAgo(use[0].d),mixed});
 if(r.n<3)r.why.push('売り切れ'+r.n+'件のみ');else if(r.n<5)r.why.push('売り切れ'+r.n+'件');
 if(r.age>14)r.why.push('最新の記録が'+r.age+'日前');
 if(mixed)r.why.push(i.cond?'同じ状態の記録がなく、別の状態の価格で計算':'状態の違う記録が混ざっている');
 r.t=r.n>=5&&r.age<=14&&!mixed?'h':r.n>=3&&r.age<=30&&!mixed?'m':'l';return r}
const trustB=m=>m&&m.n?`<span class="bd t${m.t}">信頼度 ${TL[m.t]}</span>`:'';

/* ===== 利益計算 ===== */
function priceOf(i,c){const v=N(i['p'+c]);if(v!=null)return{v,src:'手入力'};const m=mkt(i,c);return m.n?{v:Math.round(m.p),src:'相場',m}:null}
function calc(i,c){
 const pr=priceOf(i,c),rate=db.set['r'+c];if(!pr)return{c,none:'売価なし'};if(rate==null)return{c,none:'手数料率未設定',price:pr.v,src:pr.src,m:pr.m};
 const price=pr.v,fee=feeOf(price,rate),exp=(N(i.ship)||0)+(N(i.pack)||0)+(N(i.other)||0),cost=N(i.cost);
 const needP=db.set.target,needR=Math.ceil(price*db.set.trate/100),need=Math.max(needP,needR);
 const r={c,price,src:pr.src,m:pr.m,fee,exp,limit:price-fee-exp-need,by:needR>needP?'rate':'profit'};
 if(cost!=null){r.profit=price-fee-exp-cost;r.rate=price>0?r.profit/price*100:null;r.ok=r.profit>=db.set.target&&r.rate!=null&&r.rate>=db.set.trate}
 return r}
function best(i){let b=null;CK.forEach(c=>{const r=calc(i,c);if(r.none)return;const v=r.profit!=null?r.profit:r.limit,bv=b&&(b.profit!=null?b.profit:b.limit);if(!b||v>bv)b=r});return b}
function fin(i){const p=N(i.ap),c=N(i.cost);if(p==null||c==null||!i.ac||p<0||c<0)return null;
 let fee=N(i.afee);if(fee==null){const rt=db.set['r'+i.ac];if(rt==null)return null;fee=feeOf(p,rt)}
 return p-c-fee-(N(i.aship)||0)-(N(i.apack)||0)-(N(i.aother)||0)}
const sellDays=i=>i.adate&&i.date?Math.round((new Date(i.adate)-new Date(i.date))/864e5):null;

/* ===== 画面共通 ===== */
function render(){
 $('main').innerHTML={res:vRes,list:vList,sum:vSum,set:vSet,item:vItem}[view]();
 const on=view==='item'?prev:view;
 $('nav').innerHTML=[['res','🔍','調べる'],['list','📋','一覧'],['sum','📊','集計'],['set','⚙️','設定']].map(([k,i,l])=>`<button data-a="go" data-v="${k}" class="${on===k?'on':''}"><div style="font-size:20px">${i}</div>${l}</button>`).join('')}
function go(v){view=v;render();scrollTo(0,0)}
function openItem(id){const x=db.items.find(i=>i.id===id);if(!x)return;if(view!=='item')prev=view;cur=x;imp=null;qOpen=false;view='item';render();scrollTo(0,0)}
const opts=(a,v)=>a.map(([k,t])=>`<option value="${esc(k)}"${String(v==null?'':v)===k?' selected':''}>${esc(t)}</option>`).join('');
const F=(k,l,x='')=>`<div><label>${l}</label><input data-f="${k}" value="${esc(cur[k])}" ${x}></div>`;
const NF=(k,l,ph='')=>F(k,l,`inputmode="numeric" placeholder="${esc(ph)}"`);
const SF=(k,l,a)=>`<div><label>${l}</label><select data-f="${k}">${opts(a,cur[k])}</select></div>`;
const chOpts=[['','未選択'],...CK.map(c=>[c,CH[c]])];
function itemCard(i,rank){
 const nm=esc(i.name||'(商品名未入力)'),sub=[ST[i.st],i.genre,i.store,i.cond].filter(Boolean).map(esc).join(' / ');
 let body;
 if(i.st==='sold'){const f=fin(i),p=N(i.ap);body=`売れた価格 ${yen(p)} / 実利益 <b class="${f!=null&&f>=0?'ok':'ng'}">${f==null?'未計算':yen(f)}</b>${f!=null&&p>0?' ('+pct(f/p*100)+')':''}`}
 else{const b=best(i);
  if(!b)body=`<span class="wn">売価が未入力(相場を記録すると計算します)</span>`;
  else body=`${i.st==='cand'?'店頭':'仕入れ'} ${yen(N(i.cost))} / 上限 <b>${b.limit<0?'<span class="ng">不可</span>':yen(b.limit)}</b><br>予想利益 ${b.profit==null?'<span class="mu">店頭価格を入れると計算</span>':`<b class="${b.ok?'ok':'ng'}">${yen(b.profit)} (${pct(b.rate)})</b> ${b.ok?'✓':''}`} <span class="mu">${CH[b.c]}</span> ${b.src==='相場'?trustB(b.m):'<span class="bd">手入力</span>'}`}
 return `<div class="card" data-a="open" data-id="${i.id}"><b>${rank?'#'+rank+' ':''}${nm}</b><div class="mu">${sub}</div><div>${body}</div></div>`}

/* ===== 🔍 調べる ===== */
function vRes(){
 return `<h1>調べる</h1><div class="card"><div class="row" style="margin:0"><input id="rq" type="search" enterkeyhint="search" placeholder="JAN・ISBN・商品名" value="${esc(rq)}"><button data-a="scan" style="flex:0 0 56px" aria-label="バーコードを読み取る">📷</button></div><div class="row"><button class="p" data-a="rgo">調べる</button></div></div><div id="rres">${resHtml()}</div>`}
function linksHtml(k){const e=encodeURIComponent(k);
 return `<div class="mu" style="margin-top:8px">各サービスで確認(外部サイトが開きます)</div><div class="g2" style="gap:8px">`
 +`<a class="lb" href="https://jp.mercari.com/search?keyword=${e}&status=sold_out" target="_blank" rel="noopener noreferrer">メルカリ 売り切れ</a>`
 +`<a class="lb" href="https://jp.mercari.com/search?keyword=${e}&status=on_sale" target="_blank" rel="noopener noreferrer">メルカリ 出品中</a>`
 +`<a class="lb" href="https://paypayfleamarket.yahoo.co.jp/search/${e}" target="_blank" rel="noopener noreferrer">Yahoo!フリマ</a>`
 +`<a class="lb" href="https://fril.jp/s?query=${e}" target="_blank" rel="noopener noreferrer">楽天ラクマ</a>`
 +`<a class="lb" href="https://auctions.yahoo.co.jp/closedsearch/closedsearch?p=${e}" target="_blank" rel="noopener noreferrer">ヤフオク 落札相場</a>`
 +`<a class="lb" href="https://auctions.yahoo.co.jp/search/search?p=${e}" target="_blank" rel="noopener noreferrer">ヤフオク 出品中</a>`
 +`</div><p class="mu">リンク先の検索条件は、各サービスの仕様変更で効かなくなることがあります。</p>`}
function resHtml(){
 const raw=rq.trim();if(!raw)return `<div class="card mu">バーコードを読み取るか、商品名を入れて「調べる」を押してください。<br>登録済みの商品なら、仕入れ上限と予想利益をすぐ表示します。</div>`;
 const r=chkCode(raw),code=r.ok?r.code:'',k=raw.toLowerCase();
 const hit=db.items.filter(i=>code?(i.code&&nc(i.code)===code):[i.name,i.code,i.store,i.genre].join(' ').toLowerCase().includes(k)).slice(0,10);
 let h='';
 if(hit.length)h+=`<h2>登録済みの商品(${hit.length}件)</h2>`+hit.map(i=>itemCard(i)).join('');
 else h+=`<div class="card mu">登録済みの商品には見つかりませんでした。</div>`;
 const name=code?(rob&&rob.ok?rob.title:''):raw;
 if(code&&/^97[89]/.test(code))h+=`<div class="card"><b>書名(openBD)</b><div class="mu">${rob?rob.ok?'':esc(rob.msg):'調べています…'}</div>${rob&&rob.ok?`<div>${esc(rob.title)}</div><div class="mu">${esc(rob.author)} / ${esc(rob.pub)}</div>`:''}</div>`;
 if(!(code&&hit.length))h+=`<div class="card"><b>新しく登録</b><div class="mu">${code?'JAN/ISBN: '+esc(code):''}${name?(code?'<br>':'')+'商品名: '+esc(name):''}</div><button class="p" style="width:100%;margin-top:10px" data-a="reg" data-n="${esc(name)}" data-c="${esc(code)}">＋ 仕入れ候補として登録</button><p class="mu">登録すると、店頭価格の入力や相場の記録ができます。</p></div>`;

const impNew=()=>({text:'',c:qc,d:nowL(),src:'画面録画→Gemini',rows:null,err:''});
function parseCSV(t){
 t=String(t).replace(/^﻿/,'').replace(/```[a-zA-Z]*/g,'');
 const first=t.split(/\r?\n/).find(x=>x.trim())||'',dl=first.includes('\t')&&!first.includes(',')?'\t':',';
 const out=[];let row=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===dl){row.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);out.push(row);row=[];f=''}else f+=c}
 row.push(f);out.push(row);return out.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x!==''))}
const kindOf=s=>{s=String(s).replace(/\s/g,'');if(/売り?切れ|売却済|SOLD|取引済|落札/i.test(s))return'sold';if(/出品中|販売中|公開中/.test(s))return'listing';return''};
const condOf=s=>{s=String(s).replace(/\s/g,'');if(!s)return'';if(CONDS.includes(s))return s;
 if(/全体的|悪い/.test(s))return'全体的に状態が悪い';if(/やや/.test(s))return'やや傷や汚れあり';if(/目立った|目立つ傷/.test(s))return'目立った傷や汚れなし';
 if(/未使用に近い/.test(s))return'未使用に近い';if(/新品|未使用/.test(s))return'新品・未使用';if(/^傷や汚れあり$|^傷あり$/.test(s))return'傷や汚れあり';return s};

 if(h.some(x=>/価格|販売状況|商品名/.test(x))){start=1;ncol=h.length;const f=re=>h.findIndex(x=>re.test(x));idx={name:f(/商品名|タイトル/),price:f(/価格|金額/),kind:f(/販売状況|状況/),cond:f(/状態/)};
  if(idx.price<0||idx.kind<0){imp.err='「価格」と「販売状況」の列が見つかりません。';return}}
 const g=(r,k)=>idx[k]>=0&&r[idx[k]]!=null?r[idx[k]]:'',svc=SVN[imp.c];
 const ex=new Set(qOf(cur).filter(x=>!x.void&&x.title).map(x=>[x.svc,x.kind,x.price,x.title].join('\u0001')));
 imp.rows=rows.slice(start).map((r,n)=>{const p=N(g(r,'price')),k=kindOf(g(r,'kind')),iss=[];
  if(r.length>ncol)iss.push('列の数が多すぎます(価格にカンマが入っている可能性)');
  if(p==null||p<=0||!Number.isInteger(p))iss.push('価格が読めません');

const cam={stream:null,timer:null,mode:'res',busy:false,t0:0,tok:0,ct:null,lastBad:''};
const ZXURL='https://cdn.jsdelivr.net/npm/@zxing/library@0.18.6/umd/index.min.js';
const sUI=(m,c)=>{$('#sstat').className=c||'';$('#sstat').textContent=m};
const setRun=b=>{$('#sretry').hidden=b;$('#sstop').hidden=!b};
function stopCam(){cam.tok++;clearInterval(cam.timer);cam.timer=null;cam.busy=false;if(cam.stream){cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null}$('#svid').srcObject=null;setRun(false)}

const loadZX=()=>window.ZXing?Promise.resolve():new Promise((ok,ng)=>{const e=document.createElement('script');e.src=ZXURL;e.onload=ok;e.onerror=()=>ng(new Error('load'));document.head.appendChild(e)});
async function mkDecoder(){
 if('BarcodeDetector' in window){try{const d=new BarcodeDetector({formats:['ean_13','ean_8','upc_a']});return async v=>{const r=await d.detect(v);return r.length?r[0].rawValue:null}}catch(e){}}
 try{await loadZX()}catch(e){return null}
 const h=new Map();h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A]);h.set(ZXing.DecodeHintType.TRY_HARDER,true);
 const rd=new ZXing.MultiFormatReader();rd.setHints(h);const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 return async v=>{if(!v.videoWidth)return null;const w=Math.min(v.videoWidth,960);cv.width=w;cv.height=Math.round(v.videoHeight*w/v.videoWidth);cx.drawImage(v,0,0,cv.width,cv.height);
  try{return rd.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))).getText()}catch(e){return null}}}
async function startCam(){
 stopCam();const tok=cam.tok;sUI('カメラを起動しています…');
 if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){sUI('この環境ではカメラを使えません(HTTPSで開いたSafariが必要です)。下の欄にコードを手入力してください。','ng');return}
 let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
 catch(e){if(tok!==cam.tok)return;const n=e&&e.name;sUI(n==='NotAllowedError'||n==='SecurityError'?'カメラの使用が許可されていません。Safariのアドレスバー左の「ぁあ」→「Webサイトの設定」→「カメラ」を「許可」にして、「カメラを起動」を押してください。':n==='NotFoundError'?'カメラが見つかりません。コードを手入力してください。':'カメラを起動できませんでした。「カメラを起動」で再試行するか、手入力してください。','ng');return}
 if(tok!==cam.tok){st.getTracks().forEach(t=>t.stop());return}
 cam.stream=st;const v=$('#svid');v.srcObject=st;try{await v.play()}catch(e){}
 const dec=await mkDecoder();if(tok!==cam.tok)return;
 if(!dec){stopCam();sUI('読み取り用の部品を読み込めませんでした(通信状況を確認)。「カメラを起動」で再試行するか、手入力してください。','ng');return}
 setRun(true);sUI('バーコードを枠に合わせてください','');cam.t0=Date.now();
 cam.timer=setInterval(async()=>{if(cam.busy||tok!==cam.tok)return;
  if(Date.now()-cam.t0>60000){stopCam();sUI('60秒間読み取れませんでした。明るい場所で、バーコードを平らにして、「カメラを起動」を押してください。','wn');return}
  cam.busy=true;try{const x=await dec(v);if(x&&tok===cam.tok)onCode(x)}catch(e){}cam.busy=false},250)}
function onCode(raw){const r=chkCode(raw);if(r.ok)return useCode(r.code);if(r.msg&&cam.lastBad!==raw){cam.lastBad=raw;sUI(r.msg,'wn')}}
function useCode(code){
 stopCam();sUI('✓ 読み取り成功: '+code,'ok');
 cam.ct=setTimeout(()=>{closeScan();
  if(cam.mode==='item'&&view==='item'&&cur){const d=dup(code,cur.id);if(d){if(confirm('このコードは「'+(d.name||'商品名なし')+'」として登録済みです。その商品を開きますか?'))openItem(d.id);return}cur.code=code;cur.codeSrc='カメラ';touch();render()}
  else runRes(code)},600)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cam.stream){stopCam();sUI('画面を離れたため、カメラを停止しました。','wn')}});

 else if(a==='qvoid'){const q=qOf(cur).find(z=>z.id===t.dataset.id);if(q){if(!q.void&&!confirm('この記録を誤入力として除外します。記録は残りますが、計算から外れます。よろしいですか?'))return;q.void=!q.void;q.voidT=new Date().toISOString();touch();refresh(true);const d=document.querySelectorAll('#mkt details');d[d.length-1].open=true}}
 else if(a==='iopen'){imp=impNew();refresh(true)}
 else if(a==='icancel'){if(imp&&imp.text.trim()&&!confirm('貼り付けた内容を破棄します。よろしいですか?'))return;imp=null;refresh(true)}
 else if(a==='iparse'){if(imp){impParse();if(imp.err)imp.rows=null;refresh(true)}}
 else if(a==='iback'){if(imp){imp.rows=null;refresh(true)}}
 else if(a==='icommit')impCommit();
 else if(a==='del'){if(confirm('「'+(cur.name||'商品名なし')+'」を削除します。相場の記録も消え、元に戻せません。よろしいですか?')){db.items=db.items.filter(x=>x!==cur);save();cur=null;go(prev)}}
 else if(a==='lf'){lf=v;render()}
 else if(a==='ls'){ls=v;render()}
 else if(a==='l30'){l30=!l30;render()}
 else if(a==='sset')saveSet();
 else if(a==='bak'){db.meta.lastBackup=today();db.meta.changes=0;save(true);dl('sedoscope_backup_'+today()+'.json',JSON.stringify(db),'application/json');render()}
 else if(a==='csv')csv();
 else if(a==='qcsv')qcsv();
 else if(a==='wipe'){if(confirm('すべてのデータを削除します。先にバックアップを保存しましたか?削除すると元に戻せません。')){db=def();save(true);go('res')}}});
document.addEventListener('input',e=>{const t=e.target;
 if(view==='item'&&impInput(t))return;
 if(t.id==='lq'){lq=t.value;$('#items').innerHTML=listHtml();return}
 if(view==='item'&&t.dataset.f&&t.type!=='date'){const o=Object.assign({},cur,{[t.dataset.f]:t.value});const c=$('#calc');if(c)c.innerHTML=calcHtml(o);const f=$('#fin');if(f)f.innerHTML=finHtml(o)}});
document.addEventListener('change',e=>{const t=e.target;
 if(view==='item'&&impInput(t))return;
 if(view==='item'&&t.dataset.f){if(setField(t)){touch();flash();refresh(['cond','name'].includes(t.dataset.f));if(t.dataset.f==='ac')render()}else refresh();return}
 if(t.id==='rf'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items))throw 0;
  const its=d.items.filter(x=>x&&typeof x==='object'&&x.id);
  if(!confirm('現在のデータを、バックアップの内容(商品'+its.length+'件)で置き換えます。よろしいですか?'))return;
  db={items:its,set:d.set||{},meta:{lastBackup:(d.meta&&d.meta.lastBackup)||null,changes:0}};const tmp=JSON.stringify(db);localStorage.setItem(KEY,tmp);load();save(true);go('res')}catch(x){alert('このファイルは読み込めません。SedoScopeのバックアップ(.json)を選んでください。')}};r.readAsText(t.files[0])}});
load();render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script></body></html>
