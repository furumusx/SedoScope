<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SSS</title>
<style>
:root{
  --bg:#0f1115;--card:#181b22;--card2:#1f232c;--line:#2b303b;--tx:#e9ecf2;--mut:#98a1b0;--acc:#5aa9ff;
  --ss:#2fd27a;--s:#5aa9ff;--w:#f5b83d;--x:#ff5d5d;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --tabh:58px;--safe:env(safe-area-inset-bottom,0px);
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;
  --r-lg:14px;--r-md:10px;--r-sm:8px;
  --fs-sec:13px;--fs-body:15px;--fs-sub:12px;--fs-sheet:17px;
  --h-btn:44px;--h-input:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{touch-action:manipulation;cursor:pointer}
a{color:var(--acc)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
small.u{font-size:.6em;color:var(--mut);margin-left:2px}
.mut{color:var(--mut)}
header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.95);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;letter-spacing:.08em}
header .ver{font-size:11px;color:var(--mut);background:none;border:1px solid var(--line);border-radius:var(--r-md);padding:1px 8px}
header .store{margin-left:auto;font-size:12px;color:var(--mut);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#banner{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + var(--safe) + var(--padh,0px) + var(--sp2));z-index:40}
#banner:empty{display:none}
.banner{margin:0;padding:10px 12px;border-radius:10px;background:#3a2a0b;border:1px solid #6b4d12;color:#ffd98a;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.banner button{margin-left:auto;background:#6b4d12;border:0;border-radius:8px;padding:6px 10px;color:#fff;white-space:nowrap}
main{padding:var(--sp3) var(--sp3) calc(var(--tabh) + var(--safe) + 16px + var(--sp2))}
main.withpad{padding-bottom:calc(var(--tabh) + var(--safe) + var(--padh,300px) + 12px + var(--sp2))}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#12151b;border-top:1px solid var(--line);padding-bottom:var(--safe);height:calc(var(--tabh) + var(--safe))}
nav#tabs button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
nav#tabs button .i{font-size:20px;line-height:1}
nav#tabs button.on{color:var(--tx)}
nav#tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
nav#tabs .badge{position:absolute;top:5px;right:22%;background:var(--x);color:#fff;border-radius:9px;font-size:10px;min-width:17px;padding:0 4px;line-height:17px}
#pad{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--safe));z-index:25;background:#12151b;border-top:1px solid var(--line);padding:8px 10px}
#pad[hidden]{display:none}
.pricebar{display:flex;align-items:baseline;gap:6px;padding:0 4px 6px}
.pricebar .lbl{font-size:12px;color:var(--mut)}
.pricebar #pv{font-size:30px;font-weight:700;margin-left:auto}
.pricebar .tg{align-self:center;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 10px;font-size:12px;color:var(--mut)}
.keys{display:grid;grid-template-columns:1fr 1fr 1fr 1.25fr;gap:6px}
.keys button{height:var(--h-btn);border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);font-size:22px;font-family:var(--mono)}
.keys button:active{background:var(--card2)}
.keys button.fn{font-size:16px;color:var(--mut)}
.keys button.a{font-family:inherit;font-size:13px;font-weight:700;border:0;background:var(--card2)}
.keys button.a.pri{background:var(--acc);color:#04203f}
.keys button.a.scan-on{background:var(--x);color:#fff}
.acts{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px}
.acts button{height:var(--h-btn);border-radius:var(--r-md);border:0;background:var(--card2);font-size:13px;font-weight:600}
#res{min-height:calc(100dvh - 120px)}
.acts button.pri{background:var(--acc);color:#04203f}
.acts button.scan-on{background:var(--x);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp3);margin-bottom:var(--sp2)}
.row{display:flex;gap:8px;align-items:center}
.srch{display:flex;gap:var(--sp2);margin-bottom:var(--sp2)}
.srch input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:var(--h-input);padding:0 var(--sp3)}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:var(--h-btn);padding:0 var(--sp3);font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04203f;font-weight:700}
.btn.dng{background:#3a1416;border-color:#6b2328;color:#ffb3b3}
.btn.sm{height:32px;padding:0 var(--sp2);font-size:12px;border-radius:var(--r-sm)}
.btns{display:flex;gap:var(--sp2);flex-wrap:wrap}
#cam{position:relative;border-radius:var(--r-lg);overflow:hidden;background:#000;margin-bottom:var(--sp2);height:170px}
#cam video{width:100%;height:100%;object-fit:cover;display:block}
#cam .guide{position:absolute;left:8%;right:8%;top:50%;height:2px;background:rgba(255,80,80,.85);box-shadow:0 0 8px rgba(255,80,80,.9)}
#cam .hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:#ddd;text-shadow:0 1px 2px #000}
#cam.hit{outline:4px solid var(--ss);outline-offset:-4px}
.bib{display:flex;gap:10px}
.bib img{width:52px;height:74px;object-fit:cover;border-radius:var(--sp1);background:var(--card2);flex:none}
.bib .t{font-weight:700;font-size:16px;line-height:1.35}
.bib .s{font-size:var(--fs-sub);color:var(--mut)}
.judge{display:grid;grid-template-columns:auto 1fr;gap:var(--sp3);align-items:center;margin-top:var(--sp3)}
.sig{width:92px;height:92px;border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid;font-weight:800}
.sig .mk{font-size:46px;line-height:1}
.sig .tx{font-size:14px;margin-top:2px}
.sig.ss{color:var(--ss);border-color:var(--ss);background:rgba(47,210,122,.12)}
.sig.s{color:var(--s);border-color:var(--s);background:rgba(90,169,255,.12)}
.sig.w{color:var(--w);border-color:var(--w);background:rgba(245,184,61,.12);border-style:dashed}
.sig.x{color:var(--x);border-color:var(--x);background:rgba(255,93,93,.12)}
.sig.n{color:var(--mut);border-color:var(--line)}
.kp label{display:block;font-size:var(--fs-sub);color:var(--mut)}
.kp .big{font-size:30px;font-weight:800;line-height:1.15}
.kp .mid{font-size:22px;font-weight:700}
.kp .pos{color:var(--ss)}.kp .neg{color:var(--x)}
.basis{font-size:var(--fs-sub);color:var(--mut);margin-top:var(--sp2)}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp1);margin-top:var(--sp2)}
.chip{font-size:var(--fs-sub);border-radius:999px;padding:var(--sp1) var(--sp2);border:1px solid var(--line);background:var(--card2)}
.chip.warn{border-color:#7a5a17;background:#33270d;color:#ffd98a}
.chip.bad{border-color:#7a2a2f;background:#331316;color:#ffb3b3}
.chip.info{color:var(--mut)}
.links{display:flex;gap:var(--sp2);overflow-x:auto;margin-top:var(--sp3);padding-bottom:2px}
.links a{flex:none;text-decoration:none;font-size:12px;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:var(--r-sm);padding:var(--sp2) var(--sp3)}
details.det{margin-top:var(--sp3)}
details.det summary{font-size:var(--fs-sec);color:var(--acc);cursor:pointer;list-style:none}
details.det summary::-webkit-details-marker{display:none}
table{border-collapse:collapse;width:100%;font-size:var(--fs-sub)}
th,td{padding:6px var(--sp1);border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500}
tr.best{color:var(--ss)}
.sec{font-size:var(--fs-sec);color:var(--mut);margin:var(--sp4) var(--sp1) var(--sp2);font-weight:600}
.list .it{display:flex;gap:var(--sp3);align-items:center;padding:var(--sp3);border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);margin-bottom:var(--sp2)}
.list .it img,.list .it .ph{width:40px;height:56px;border-radius:var(--sp1);object-fit:cover;background:var(--card2);flex:none}
.list .it .m{flex:1;min-width:0}
.list .it .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it .s{font-size:var(--fs-sub);color:var(--mut)}
.list .it .r{text-align:right;flex:none}
.st{font-size:11px;border-radius:var(--r-sm);padding:var(--sp1) var(--sp2);border:1px solid var(--line);margin-right:var(--sp1)}
.st.cand{color:#c8b6ff;border-color:#4a3f75}.st.stock{color:#8fd3ff;border-color:#25506b}.st.listed{color:#ffd98a;border-color:#6b4d12}.st.sold{color:#9be7b6;border-color:#1f5a37}
.minisig{display:inline-flex;width:30px;height:30px;border-radius:var(--r-sm);border:2px solid;align-items:center;justify-content:center;font-weight:800}
.minisig.ss{color:var(--ss)}.minisig.s{color:var(--s)}.minisig.w{color:var(--w);border-style:dashed}.minisig.x{color:var(--x)}.minisig.n{color:var(--mut);border-color:var(--line)}
.it.pick{border-color:var(--ss)!important;box-shadow:inset 0 0 0 1px var(--ss)}
.fchips{display:flex;gap:var(--sp2);overflow-x:auto;margin-bottom:var(--sp2)}
.fchips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);height:32px;padding:0 var(--sp3);font-size:var(--fs-sec);color:var(--mut)}
.fchips button.on{background:var(--acc);border-color:var(--acc);color:#04203f;font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp2)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp3)}
.kpi label{font-size:var(--fs-sub);color:var(--mut);display:block}
.kpi b{font-size:22px}
.fld{margin-bottom:var(--sp3)}
.fld label{display:block;font-size:var(--fs-sub);color:var(--mut);margin-bottom:var(--sp1)}
.fld input,.fld select,.fld textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:var(--h-input);padding:0 var(--sp2);font-size:16px}
.fld textarea{height:auto;min-height:70px;padding:var(--sp2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--sp2)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 var(--sp2)}
.tri{display:flex;flex-wrap:wrap;gap:var(--sp2)}
.tri button{border:1px solid var(--line);background:var(--card2);border-radius:var(--r-md);height:32px;padding:0 var(--sp3);font-size:var(--fs-sec)}
.tri button.yes{border-color:var(--ss);color:var(--ss)}
.tri button.no{border-color:var(--x);color:var(--x)}
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#sheet[hidden]{display:none}
#sheet .sh{display:flex;align-items:center;gap:var(--sp2);padding:calc(env(safe-area-inset-top,0px) + var(--sp3)) var(--sp3) var(--sp3);border-bottom:1px solid var(--line)}
#sheet .sh h2{font-size:var(--fs-sheet);margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .sb{flex:1;overflow:auto;padding:var(--sp3) var(--sp3) calc(30px + var(--safe))}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 56px);z-index:60;background:#2a3140;color:#fff;padding:var(--sp3) var(--sp4);border-radius:var(--r-md);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:2px var(--sp2);font-size:var(--fs-sub);padding:6px 0;border-bottom:1px solid var(--line)}
.sum{font-size:13px;line-height:1.7}
.sum b{font-family:var(--mono)}
.inline-in{width:92px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:36px;padding:0 var(--sp2);font-size:16px;text-align:right;font-family:var(--mono)}
.note{font-size:var(--fs-sub);color:var(--mut)}
.mt0{margin-top:0}.mt1{margin-top:var(--sp1)}.mt2{margin-top:var(--sp2)}.mt3{margin-top:var(--sp3)}.mb2{margin-bottom:var(--sp2)}.mb3{margin-bottom:var(--sp3)}
.my3{margin:var(--sp3) var(--sp1)}.my4{margin:var(--sp4) 0}
.fz-sec{font-size:var(--fs-sec)}.fz-body{font-size:var(--fs-body)}.lbl14{font-size:14px}
.wrap{white-space:normal}.ff{font-family:inherit}.grow{flex:1;min-width:0}
.ta-mono{min-height:110px;font-family:var(--mono)}
</style>
</head>
<body>
<header>
  <h1>SSS</h1>
  <button class="ver" data-act="showVer" id="ver"></button>
  <span class="store" id="hdStore"></span>
</header>
<main id="view"></main>
<div id="pad" hidden></div>
<nav id="tabs">
  <button data-tab="look"><span class="i">🔍</span>調べる</button>
  <button data-tab="cart"><span class="i">🧺</span>カゴ<span class="badge" id="qbadge" hidden></span></button>
  <button data-tab="list"><span class="i">📚</span>一覧</button>
  <button data-tab="stats"><span class="i">📊</span>集計</button>
  <button data-tab="set"><span class="i">⚙️</span>設定</button>
</nav>
<div id="sheet" hidden><div class="sh"><h2 id="shT"></h2><button class="btn sm" data-act="closeSheet">閉じる</button></div><div class="sb" id="shB"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   SSS — 本・漫画せどり専用 判定ツール（単一HTML／バックエンドなし）
   データ: localStorage "sedoscope_s_v1"（SedoScope本体 "sedoscope_v1" とは別）
   外部通信: openBD ISBN照会のみ
   ============================================================ */
const APP_VER='1.1.2';
const APP_DATE='2026-10-24';
const CHANGELOG=[
  'v1.1.2（2026-10-24）警告バナーを下部（価格パッド／タブバーのすぐ上）に移動し、検索欄・絞り込み欄を塞がないように',
  'v1.1.1（2026-10-24）軽微修正：価格パッド開閉時に下余白を実測で追随／バックアップ警告バナーをヘッダー直下に重ねて表示し本文が動かないように',
  'v1.1.0（2026-10-24）UI統一：余白・角丸・文字サイズをデザイントークンに統一／インライン余白をクラス化／タブごとのスクロール位置保持／入力欄16pxでiOSズーム防止／パッド開閉・バナー表示・スキャン時の画面の揺れを抑制',
  'v1.0.1（2026-10-24）SedoScope実データ対応：相場の販売状況(kind)・販路(svc)を読み取り／出品・売却の項目を対応付け／設定の引き継ぎ／セットの巻範囲を構成巻から自動設定／作品名が合わない相場を判定から除外',
  'v1.0.0（2026-10-24）初版：即時判定／相場プール（保守的・標準、ばらつき・二峰性・鮮度）／SedoScopeバックアップ取り込み／相場CSV取り込み／拡張リンクボタン／欠巻・版違い・付属品チェック／重複警告／カゴ（予算内の推奨）／資金効率スコア／集計／バックアップ警告'
];
const KEY='sedoscope_s_v1';
const CH=['m','y','r','a'];
const ST={cand:'候補',stock:'仕入済',listed:'出品中',sold:'売却済'};
const SIG={ss:['◎','買え'],s:['○','買え'],w:['△','要確認'],x:['✕','見送り'],n:['—','相場なし']};
const ACC=[['obi','帯'],['cover','カバー'],['booklet','特典冊子'],['poster','ポスター'],['other','その他']];
const EDS=['完全版','文庫版','愛蔵版','新装版','ワイド版','カラー版','デラックス版','復刻版','豪華版','新書版','大判','KCDX','B6判','A5判'];
const DEF_LINKS=[
  {id:'mer',name:'メルカリ（売り切れ）',url:'https://jp.mercari.com/search?keyword={title}&status=sold_out'},
  {id:'ypf',name:'Yahoo!フリマ',url:'https://paypayfleamarket.yahoo.co.jp/search/{title}'},
  {id:'rak',name:'ラクマ',url:'https://fril.jp/s?query={title}'},
  {id:'yac',name:'ヤフオク（終了分）',url:'https://auctions.yahoo.co.jp/closedsearch/closedsearch?p={title}'},
  {id:'auf',name:'オークフリー',url:'https://aucfree.com/search?q={title}'},
  {id:'obd',name:'openBD書誌',url:'https://api.openbd.jp/v1/get?isbn={isbn}&pretty'}
];
function defSettings(){return{
  target:30,mode:'cons',disp:3,fresh:30,dupDays:60,unsoldDays:45,backupWarn:14,
  ch:{m:{name:'メルカリ',fee:10,ship:210,on:true},y:{name:'Yahoo!フリマ',fee:5,ship:210,on:true},
      r:{name:'ラクマ',fee:10,ship:210,on:true},a:{name:'ヤフオク',fee:10,ship:210,on:true}},
  pack:30,other:0,main:'m',pick:'main',
  acc:{obi:10,cover:30,booklet:10,poster:5,other:0},
  store:'',budget:'',autoQueue:false
}}
function defState(){return{schema:1,items:[],queue:[],biblio:{},settings:defSettings(),links:DEF_LINKS.map(x=>({...x})),
  meta:{created:new Date().toISOString(),lastBackup:null,imports:[]}}}

/* ---------- 保存 ---------- */
function fixState(s){
  const d=defState(); if(!s||typeof s!=='object'||Array.isArray(s)) return d;
  s.items=Array.isArray(s.items)?s.items.filter(x=>x&&typeof x==='object'):[];
  s.queue=Array.isArray(s.queue)?s.queue:[];
  s.biblio=(s.biblio&&typeof s.biblio==='object')?s.biblio:{};
  const ds=defSettings(), ss=(s.settings&&typeof s.settings==='object')?s.settings:{};
  const ch={}; for(const c of CH) ch[c]=Object.assign({},ds.ch[c],(ss.ch||{})[c]||{});
  s.settings=Object.assign(ds,ss,{ch,acc:Object.assign({},ds.acc,ss.acc||{})});
  s.links=Array.isArray(s.links)?s.links:d.links;
  s.meta=Object.assign(d.meta,s.meta||{});
  s.schema=1; return s;
}
function load(){let s=null;try{const t=localStorage.getItem(KEY);if(t)s=JSON.parse(t)}catch(e){console.warn(e)}return fixState(s)}
let S=load();
let IDX=null;
function save(){
  IDX=null;
  try{localStorage.setItem(KEY,JSON.stringify(S));return true}
  catch(e){toast('保存できませんでした（端末の保存容量不足の可能性）。バックアップを書き出してください');return false}
}

/* ---------- 小道具 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function num(v){if(v===null||v===undefined||v==='')return NaN;if(typeof v==='number')return v;
  const t=String(v).normalize('NFKC').replace(/[,¥￥円\s]/g,'');const m=t.match(/-?\d+(\.\d+)?/);return m?Number(m[0]):NaN}
function fnum(it,k,def){if(it&&it[k]!==''&&it[k]!=null&&isFinite(num(it[k])))return num(it[k]);return def}
const yen=(n,cls='')=>isFinite(n)?`<span class="num ${cls}">${Math.round(n).toLocaleString('ja-JP')}</span><small class="u">円</small>`:'<span class="num mut">—</span>';
const yenT=n=>isFinite(n)?Math.round(n).toLocaleString('ja-JP')+'円':'—';
const pct=n=>isFinite(n)?(n*100).toFixed(1)+'%':'—';
function median(a){if(!a.length)return NaN;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){if(!s)return null;if(s instanceof Date)return s;if(typeof s==='number')return new Date(s);
  const t=String(s).normalize('NFKC').trim();const m=t.match(/(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})/);
  if(m)return new Date(+m[1],m[2]-1,+m[3]);const d=new Date(t);return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function daysAgo(s){const d=pd(s);if(!d)return null;const n=new Date();n.setHours(0,0,0,0);return Math.round((n-d)/864e5)}
function mdShort(s){const d=pd(s);return d?(d.getMonth()+1)+'/'+d.getDate():'—'}
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- コード（ISBN/JAN） ---------- */
function ean13ok(c){if(!/^\d{13}$/.test(c))return false;let s=0;for(let i=0;i<12;i++)s+=(+c[i])*(i%2?3:1);return (10-s%10)%10===+c[12]}
function isbn10to13(t){const b='978'+t.slice(0,9);let s=0;for(let i=0;i<12;i++)s+=(+b[i])*(i%2?3:1);return b+((10-s%10)%10)}
function normCode(v){let t=String(v??'').normalize('NFKC').replace(/[^0-9Xx]/g,'').toUpperCase();
  if(/^\d{9}[\dX]$/.test(t))return isbn10to13(t);
  if(/^\d{13}$/.test(t)||/^\d{8}$/.test(t))return t;return t.replace(/X/g,'')}
function okScanCode(c){return ean13ok(c)&&!/^19[0-9]/.test(c)}   // 書籍の2段目(192…)は無視
const isISBN=c=>/^97[89]\d{10}$/.test(c);

/* ---------- 正規化 ---------- */
function workKey(s){
  if(!s)return '';let t=String(s).normalize('NFKC').toLowerCase();
  t=t.replace(/[【\[(（「『〈<][^】\])）」』〉>]*[】\])）」』〉>]/g,' ');
  t=t.replace(/全\s*\d+\s*巻|\d+\s*[-~〜～]\s*\d+\s*巻?|第?\s*\d+\s*巻|vol\.?\s*\d+/g,' ');
  t=t.replace(/全巻|完結|セット|初版|帯付き?|チラシ付き?|特典付き?|美品|中古|コミックス?|漫画|まとめ売り?|送料無料|即購入可/g,' ');
  t=t.replace(/[\s・:：!！?？、。,.\-_~〜～\/／|｜+＋'"]+/g,'');
  t=t.replace(/\d+$/,'');
  return t;
}
function chKey(v){const t=String(v??'').normalize('NFKC').toLowerCase().trim();if(!t)return 'o';
  if(CH.includes(t))return t;
  if(/メルカリ|mercari|^pm$/.test(t))return 'm';
  if(/フリマ|paypay|^py$/.test(t))return 'y';
  if(/ラクマ|rakuma|fril|楽天|^pr$/.test(t))return 'r';
  if(/ヤフオク|オークション|auction|aucfree|オークフリー|^pa$/.test(t))return 'a';
  return 'o'}
function qStatus(v){if(v===true)return 'sold';if(v===false)return 'listing';const t=String(v??'').normalize('NFKC').toLowerCase();
  if(/出品|販売中|on.?sale|listing|active|公開中|selling/.test(t))return 'listing';
  if(/sold|売|済|終了|落札|取引/.test(t))return 'sold';return ''}
function normQuote(q){
  if(!q||typeof q!=='object')return null;const o={...q};
  const p=num(q.price??q.p??q.v??q.val??q.value??q.yen??q['価格']);o.price=isFinite(p)?p:NaN;
  o.status=qStatus(q.status??q.kind??q.st??q.sold??q.state??q.s??q['販売状況']);
  o.cond=String(q.cond??q.c??q.condition??q['商品の状態']??'');
  let dv=q.date??q.d??q.at??q.ts??q.day??'';if(typeof dv==='number')dv=ymd(new Date(dv));o.date=String(dv);
  o.src=String(q.src??q.source??q.site??q.mk??'');o.ch=chKey(q.svc??q.ch??q.src??q.source??q.site??'');
  o.title=String(q.title??q.name??q.n??q['商品名']??'');
  return o}
function normSt(v){if(ST[v])return v;const t=String(v??'').normalize('NFKC').toLowerCase();
  if(/sold|売却|売れ|販売済|done/.test(t))return 'sold';
  if(/list|出品/.test(t))return 'listed';
  if(/stock|inv|bought|purch|仕入|在庫|own|have/.test(t))return 'stock';
  if(/cand|候補|research|watch|リサーチ|検討/.test(t))return 'cand';
  return {'0':'cand','1':'stock','2':'listed','3':'sold'}[t]||'cand'}
const qKey=q=>[q.title,q.price,q.status,q.cond,q.ch].join('|');
function getItem(id){return S.items.find(x=>String(x.id)===String(id))||null}
function newItem(o){return Object.assign({id:uid(),name:'',code:'',st:'cand',date:today(),quotes:[],created:new Date().toISOString()},o)}
function itemCover(it){return it&&(it.cover||(S.biblio[normCode(it.code)]||{}).cover)||''}

/* ---------- 相場プール ---------- */
function index(){
  if(IDX)return IDX;const by=new Map(),keyOf=new Map();
  for(const it of S.items){const k=workKey(it.work||it.name);keyOf.set(it,k);if(!k)continue;if(!by.has(k))by.set(k,[]);by.get(k).push(it)}
  return IDX={by,keyOf};
}
const itemKey=it=>index().keyOf.get(it)??workKey(it.work||it.name);
function poolItemsFor(key){
  if(!key)return [];const {by}=index();if(by.has(key))return by.get(key).slice();
  if(key.length<3)return [];const out=[];
  for(const [k,arr] of by){if(k.length>=3&&(k.includes(key)||key.includes(k)))out.push(...arr)}
  return out;
}
const tnorm=t=>String(t||'').normalize('NFKC').toLowerCase().replace(/[\s・:：!！?？、。,.\-_~〜～\/／|｜+＋'"★☆【】\[\]()（）「」『』]+/g,'');
function titleOk(q,key){return !q.title||!key||key.length<2||tnorm(q.title).includes(key)}
function poolQuotes(items,key){const seen=new Set(),out=[];let ex=0;
  for(const it of items)for(const q of (it.quotes||[])){if(!q||!(q.price>0))continue;if(!titleOk(q,key)){ex++;continue}const k=qKey(q)+'|'+q.date;if(seen.has(k))continue;seen.add(k);out.push(q)}
  out.excluded=ex;return out}
function qstats(qs){
  const sold=qs.filter(q=>q.status==='sold'),lis=qs.filter(q=>q.status==='listing');
  const sp=sold.map(q=>q.price).sort((a,b)=>a-b);let latest=null;
  for(const q of sold){const d=pd(q.date);if(d&&(!latest||d>latest))latest=d}
  const srcs=[...new Set(qs.map(q=>q.ch&&q.ch!=='o'?S.settings.ch[q.ch].name:(q.src||'販路不明')))];
  const cond={};for(const q of sold){const c=q.cond||'状態不明';(cond[c]=cond[c]||[]).push(q.price)}
  return{soldN:sold.length,lisN:lis.length,sp,hi:sp.length?sp[sp.length-1]:NaN,lo:sp.length?sp[0]:NaN,med:median(sp),
    lisLo:lis.length?Math.min(...lis.map(q=>q.price)):NaN,latest,srcs,cond}
}
function bimodal(sp){if(sp.length<4)return false;const a=[...sp].sort((x,y)=>x-y);let best=0,idx=-1;
  for(let i=1;i<a.length;i++){const r=a[i]/a[i-1];if(r>best){best=r;idx=i}}
  return best>=1.6&&idx>=2&&a.length-idx>=2}
function parseVols(s){const set=new Set();String(s||'').normalize('NFKC').split(/[,、\s]+/).forEach(p=>{
  const m=p.match(/^(\d+)(?:[-~〜](\d+))?$/);if(!m)return;const a=+m[1],b=m[2]?+m[2]:a;if(Math.abs(b-a)>500)return;
  for(let i=Math.min(a,b);i<=Math.max(a,b);i++)set.add(i)});return set}
function volOf(name){const t=String(name||'').normalize('NFKC');
  const m=t.match(/第?\s*(\d+)\s*巻/)||t.match(/vol\.?\s*(\d+)/i)||t.match(/\s(\d{1,3})\s*$/);return m?+m[1]:null}
function volCheck(it,pool){
  if(!it||!it.range)return null;const need=parseVols(it.range);if(!need.size)return null;
  let have,src;
  if(it.have){have=parseVols(it.have);src='手元の巻の入力'}
  else{have=new Set();for(const p of pool){if(p===it||p.st==='sold'||/セット/.test(String(p.setk||'')+String(p.name||''))||Array.isArray(p.members))continue;const vv=String(p.vols??'').normalize('NFKC').trim();const v=/^\d+$/.test(vv)?+vv:volOf(p.name);if(v)have.add(v)}src='登録済みの単巻';if(!have.size)return{need:need.size,missing:[],unknown:true}}
  return{need:need.size,missing:[...need].filter(v=>!have.has(v)).sort((a,b)=>a-b),src}
}
function edWords(s){const t=String(s||'').normalize('NFKC');return EDS.filter(w=>t.includes(w))}
function editionNote(title,pool,it){
  const cur=new Set(edWords(title+' '+(it&&it.tags||'')));const others=new Set();let plain=0,total=0;
  for(const p of pool){const texts=[p.name,...(p.quotes||[]).map(q=>q.title)].filter(Boolean);
    for(const tx of texts){if(p===it&&tx===p.name)continue;total++;const w=edWords(tx);if(!w.length)plain++;w.forEach(x=>others.add(x))}}
  const out=[...others].filter(w=>!cur.has(w));
  if(cur.size&&plain>0)out.push('通常版');
  return out}
function dupInfo(code,exId){
  const c=normCode(code);if(!c)return [];const out=[];
  for(const it of S.items){if(String(it.id)===String(exId)||normCode(it.code)!==c)continue;
    if(it.st==='stock'||it.st==='listed')out.push({lv:'bad',t:`${ST[it.st]}に同じISBNあり`,id:it.id});
    else if(it.st==='sold'){const d=daysAgo(it.soldDate||it.date);if(d!==null&&d<=S.settings.dupDays)out.push({lv:'warn',t:`${d}日前に売却済み`,id:it.id})}
    else out.push({lv:'info',t:'候補に登録済み',id:it.id})}
  return out}
function accFactor(it){let f=1;const miss=[];
  if(it&&it.acc)for(const [k,l] of ACC){if(it.acc[k]==='no'){const r=num(S.settings.acc[k])||0;f*=1-r/100;miss.push(l+'なし'+(r?`（-${r}%）`:''))}}
  return{f,miss}}

/* ---------- 判定 ---------- */
function analyze(ctx){
  const set=S.settings,r=num(set.target)/100;
  const it=ctx.itemId?getItem(ctx.itemId):null;
  const title=ctx.title||(it&&it.name)||'';
  const key=it?itemKey(it):workKey(ctx.work||title);
  let pool=poolItemsFor(key);if(it&&!pool.includes(it))pool.unshift(it);
  const qs=poolQuotes(pool,key),st=qstats(qs),acc=accFactor(it);
  const chs=[];
  for(const c of CH){const cs=set.ch[c];if(!cs.on)continue;let base=NaN,basis='';const man=it?num(it['p'+c]):NaN;
    if(man>0){base=man;basis='手入力の想定価格'}
    else{const own=qs.filter(q=>q.status==='sold'&&q.ch===c).map(q=>q.price);const arr=own.length?own:st.sp;
      if(arr.length){base=set.mode==='cons'?Math.min(...arr):median(arr);basis=(set.mode==='cons'?'底値':'中央値')+'・'+(own.length?`${cs.name}の売り切れ${own.length}件`:`全販路の売り切れ${arr.length}件`)}
      else if(it&&num(it.lo)>0){const lo=num(it.lo),hi=num(it.hi)>0?num(it.hi):lo;base=set.mode==='cons'?lo:Math.round((lo+hi)/2);basis='登録済みの想定価格（下限/上限）'}}
    if(!(base>0))continue;
    const sale=Math.round(base*acc.f),fee=Math.round(sale*(num(cs.fee)||0)/100);
    const ship=fnum(it,'ship',num(cs.ship)||0),pack=fnum(it,'pack',num(set.pack)||0),other=fnum(it,'other',num(set.other)||0);
    const net=sale-fee-ship-pack-other;const max=Math.floor((net-sale*r)/10)*10;
    chs.push({c,name:cs.name,base,sale,fee,ship,pack,other,net,max,basis})}
  let best=null;if(chs.length){if(set.pick==='main')best=chs.find(x=>x.c===set.main)||null;if(!best)best=chs.reduce((a,b)=>b.max>a.max?b:a)}
  const sd=st.latest?daysAgo(st.latest):null;
  const flags={
    disp:st.sp.length>=2&&st.lo>0&&st.hi/st.lo>num(set.disp),
    bimodal:bimodal(st.sp),
    stale:st.soldN>0&&(sd===null||sd>num(set.fresh)),staleDays:sd,
    few:st.soldN<3,
    vol:volCheck(it,pool),
    ed:editionNote(title,pool,it),
    dup:dupInfo(ctx.code||(it&&it.code),ctx.scan?null:(it&&it.id)),
    acc:acc.miss,
    excluded:qs.excluded
  };
  flags.missing=flags.vol&&flags.vol.missing.length?flags.vol.missing:[];
  return{it,title,key,pool,qs,st,chs,best,flags};
}
function evalPrice(a,price){
  const b=a.best,r=num(S.settings.target)/100,f=a.flags;
  if(!b)return{sig:'n',profit:NaN,rate:NaN,price:NaN};
  const p=num(price);let sig=null,profit=NaN,rate=NaN;
  if(isFinite(p)){profit=b.net-p;rate=profit/b.sale;sig=profit<=0?'x':rate>=r?((rate>=r+0.15&&a.st.soldN>=3)?'ss':'s'):'w'}
  const down=f.disp||f.bimodal||f.missing.length>0;
  if(down&&sig!=='x')sig='w';
  if(sig==='ss'&&(f.stale||f.few))sig='s';
  return{sig,profit,rate,price:p};
}
function effScore(a,ev){
  if(!a.best||!(ev.profit>0))return null;const n=a.st.soldN;
  let prob=Math.min(0.9,0.25+0.13*n);const why=[`売り切れ${n}件 → 売れる確率の目安 ${Math.round(prob*100)}%`];
  if(a.flags.stale){prob*=0.6;why.push('鮮度低下のため ×0.6')}
  if(a.flags.disp){prob*=0.7;why.push('ばらつき大のため ×0.7')}
  const days=Math.max(7,Math.round(60/(1+n/3)));why.push(`想定在庫日数の目安 ${days}日（売り切れ件数が多いほど短く見積もり）`);
  const total=ev.price+a.best.other;const v=total>0?ev.profit*prob/(total*days)*100:ev.profit*prob/days;
  return{v,prob,days,total,why};
}

/* ---------- openBD ---------- */
async function fetchBiblio(isbn){
  if(S.biblio[isbn]&&S.biblio[isbn].title)return S.biblio[isbn];
  if(!isISBN(isbn))return{none:true};
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),7000);
  try{
    const r=await fetch('https://api.openbd.jp/v1/get?isbn='+isbn,{signal:ctl.signal});const j=await r.json();
    const s=j&&j[0]&&j[0].summary;if(!s)return{none:true};
    let title=(s.title||'').trim();if(s.volume&&!title.endsWith(s.volume))title+=' '+s.volume;
    let form='';try{const dd=j[0].onix.DescriptiveDetail;form=(dd.ProductFormDetail||'')+''}catch(e){}
    const b={title,series:s.series||'',author:s.author||'',pub:s.publisher||'',pubdate:s.pubdate||'',cover:s.cover||'',form,at:today()};
    S.biblio[isbn]=b;const ks=Object.keys(S.biblio);if(ks.length>3000)delete S.biblio[ks[0]];save();return b;
  }catch(e){return{err:true}}finally{clearTimeout(tm)}
}

async function lookupCode(raw,opts={}){

  CUR={code,itemId:it?it.id:null,title:(it&&it.name)||bb.title||'',author:(it&&it.author)||bb.author||'',pub:(it&&it.pub)||bb.pub||'',cover:(it&&itemCover(it))||bb.cover||'',price:'',loading:false,scan:true};
  UI.search=null;const sr=$('#srchRes');if(sr)sr.innerHTML='';focusRes();
  if(isISBN(code)&&(!CUR.title||!CUR.cover)&&!bb.title){
    CUR.loading=true;renderResult();updatePV();
    const b=await fetchBiblio(code);if(!CUR||CUR.code!==code)return;CUR.loading=false;
    if(b&&b.title){CUR.title=CUR.title||b.title;CUR.author=CUR.author||b.author;CUR.pub=CUR.pub||b.pub;CUR.cover=CUR.cover||b.cover}

function inPer(d,per){const dt=pd(d);if(!dt)return per==='all';const n=new Date();
  if(per==='all')return true;if(per==='30')return daysAgo(dt)<=30;
  if(per==='month')return dt.getFullYear()===n.getFullYear()&&dt.getMonth()===n.getMonth();
  if(per==='last'){const l=new Date(n.getFullYear(),n.getMonth()-1,1);return dt.getFullYear()===l.getFullYear()&&dt.getMonth()===l.getMonth()}
  if(per==='year')return dt.getFullYear()===n.getFullYear();return true}

/* ---------- バックアップ ---------- */
function backupJSON(){return JSON.stringify({app:'SSS',key:KEY,ver:APP_VER,exportedAt:new Date().toISOString(),data:S})}
function stamp(){const d=new Date();return ymd(d).replace(/-/g,'')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')}
function doBackup(){
  S.meta.lastBackup=new Date().toISOString();const txt=backupJSON();save();
  const blob=new Blob([txt],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`sss_backup_${stamp()}.json`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  toast('バックアップを書き出しました（「ファイル」アプリに保存されます）');render();
}
async function copyBackup(){try{S.meta.lastBackup=new Date().toISOString();await navigator.clipboard.writeText(backupJSON());save();toast('クリップボードにコピーしました。メモ等に貼り付けて保管してください');render()}catch(e){toast('コピーできませんでした')}}
function fileOrTextHTML(id,accept,ph){return `<div class="fld"><label>ファイルを選ぶ</label><input type="file" id="${id}F" accept="${accept}"></div><div class="fld"><label>または中身を貼り付け</label><textarea id="${id}T" placeholder="${esc(ph)}" class="ta-mono"></textarea></div>`}
async function readFT(id){const f=$('#'+id+'F');if(f&&f.files&&f.files[0])return await f.files[0].text();return ($('#'+id+'T')||{}).value||''}
function restoreOpen(){
  openSheet('バックアップから復元',`<div class="banner mb3">⚠️ 復元すると、いまのSSSのデータはすべて置き換わります（全置換）。先に今のデータを書き出しておくと安心です。</div>
  ${fileOrTextHTML('rs','.json,application/json,text/plain','SSSのバックアップJSON')}<button class="btn pri" data-act="restoreRun">復元する</button>`);
}
async function restoreRun(){
  let o;try{o=JSON.parse(await readFT('rs'))}catch(e){toast('JSONを読み込めません');return}
  const data=o&&o.app==='SSS'&&o.data?o.data:o;
  if(!data||!Array.isArray(data.items)){toast('SSSのバックアップではありません');return}
  if(data.set&&!data.settings&&!confirm('これはSedoScope形式のようです。「SedoScopeのデータを取り込む」を使うのがおすすめです。このまま復元しますか？'))return;
  if(!confirm(`現在のデータ（商品${S.items.length}件）をすべて置き換えて、バックアップ（商品${data.items.length}件）に戻します。よろしいですか？`))return;
  S=fixState(JSON.parse(JSON.stringify(data)));save();closeSheet();CUR=null;toast(`復元しました（商品${S.items.length}件）`);render();
}
function wipe(){
  const t=prompt(`すべてのデータ（商品${S.items.length}件）を消去します。元に戻せません。\n消去する場合は「削除」と入力してください。`);

const SEDO_KNOWN=['id','name','code','genre','pub','author','setk','vols','cond','cost','ship','pack','other','store','date','st','pm','py','pr','pa','lo','hi','quotes','memo','tags'];
// SedoScope実データの項目 → SSSの項目（元の項目もそのまま残す）
const SEDO_MAP={lc:'listCh',lp:'listPrice',ldate:'listDate',ac:'soldCh',ap:'soldPrice',adate:'soldDate',afee:'soldFee',aship:'soldShip',apack:'soldPack',aother:'soldOther'};
const SEDO_KEEP={codeSrc:'コードの入力元',created:'作成日時',updated:'更新日時',src:'登録方法',inSet:'所属セット',members:'セットの構成巻',ed:'版',shipm:'発送方法',pmlo:'メルカリ想定（下）',pmhi:'メルカリ想定（上）',fromId:'コピー元'};
function applySedoSet(set){
  if(!set||typeof set!=='object')return [];const S2=S.settings,done=[];
  const n=v=>num(v);
  if(isFinite(n(set.trate))){S2.target=n(set.trate);done.push(`目標利益率 ${S2.target}%`)}
  for(const [k,c] of [['rm','m'],['ry','y'],['rr','r'],['ra','a']])if(isFinite(n(set[k]))){S2.ch[c].fee=n(set[k]);done.push(`${S2.ch[c].name}手数料 ${n(set[k])}%`)}
  if(isFinite(n(set.ship))){for(const c of CH)S2.ch[c].ship=n(set.ship);done.push(`送料 ${n(set.ship)}円（全販路）`)}
  if(isFinite(n(set.pack))){S2.pack=n(set.pack);done.push(`梱包費 ${S2.pack}円`)}
  if(isFinite(n(set.other))){S2.other=n(set.other);done.push(`その他費用 ${S2.other}円`)}
  if(isFinite(n(set.stale))){S2.fresh=n(set.stale);done.push(`鮮度 ${S2.fresh}日`)}
  if(set.mainCh&&CH.includes(set.mainCh)){S2.main=set.mainCh;done.push(`主販路 ${S2.ch[set.mainCh].name}`)}
  return done;

function parseSedo(txt){
  let o=JSON.parse(txt);
  if(o&&o.sedoscope_v1)o=typeof o.sedoscope_v1==='string'?JSON.parse(o.sedoscope_v1):o.sedoscope_v1;
  if(o&&o.data&&!Array.isArray(o.items)){o=typeof o.data==='string'?JSON.parse(o.data):o.data}
  if(Array.isArray(o))o={items:o};
  if(!o||!Array.isArray(o.items))throw new Error('items が見つかりません');
  return o;
}
function importSedo(src,mode,opt){
  const fieldCount={},unknown={},stMap={};const conv=[];let qTotal=0,qBad=0;
  for(const o of src.items){if(!o||typeof o!=='object')continue;const it=JSON.parse(JSON.stringify(o));
    for(const k of Object.keys(o)){if(SEDO_KNOWN.includes(k)){if(o[k]!==''&&o[k]!=null)fieldCount[k]=(fieldCount[k]||0)+1}else unknown[k]=(unknown[k]||0)+1}
    if(it.id===undefined||it.id===null||it.id==='')it.id=uid();
    const ns=normSt(o.st);if(String(o.st)!==ns){it.st_orig=o.st;stMap[String(o.st)]=ns}it.st=ns;
    const qs=Array.isArray(o.quotes)?o.quotes:[];it.quotes=[];
    for(const q of qs){const n=normQuote(q);if(!n){qBad++;continue}qTotal++;if(!(n.price>0)||!n.status)qBad++;it.quotes.push(n)}
    for(const [a,b] of Object.entries(SEDO_MAP))if(o[a]!==undefined&&o[a]!==''&&(it[b]===undefined||it[b]===''))it[b]=o[a];
    it._from='sedoscope';it._imported=today();conv.push(it)}
  // セット：巻範囲と手元の巻を構成巻から作る
  const byId=new Map(conv.map(i=>[String(i.id),i]));let setN=0;
  for(const it of conv){if(!/セット/.test(String(it.setk||''))&&!Array.isArray(it.members))continue;
    if(!it.range&&it.vols){const r=String(it.vols).normalize('NFKC').replace(/[〜～~]/g,'-').replace(/巻/g,'').trim();if(/^\d+(-\d+)?$/.test(r))it.range=r}
    if(!it.have&&Array.isArray(it.members)){const v=it.members.map(id=>byId.get(String(id))||getItem(id)).filter(Boolean).map(m=>num(m.vols)).filter(x=>x>0);if(v.length)it.have=v.join(',')}
    if(it.range)setN++}
  let added=0,skipped=0;
  if(mode==='replace'){S.items=conv;added=conv.length}
  else{const ids=new Set(S.items.map(i=>String(i.id)));for(const it of conv){if(ids.has(String(it.id))){skipped++;continue}S.items.push(it);ids.add(String(it.id));added++}}
  if(src.set!==undefined)S.meta.legacySet=src.set;if(src.meta!==undefined)S.meta.legacyMeta=src.meta;
  const setApplied=opt&&opt.applySet?applySedoSet(src.set):[];
  const sum={setApplied,setN,at:new Date().toISOString(),kind:'sedoscope',mode,src:src.items.length,conv:conv.length,added,skipped,qTotal,qBad,fieldCount,unknown,stMap};
  S.meta.imports=(S.meta.imports||[]).concat([{at:sum.at,kind:'sedoscope',mode,src:sum.src,added,skipped}]).slice(-30);
  save();return sum;
}

function parseCSV(text){
  text=String(text).replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function importCSV(text,targetId,newName,src){
  const rows=parseCSV(text);if(!rows.length)throw new Error('CSVが空です');
  const h=rows[0].map(x=>String(x).trim());let ix={n:h.indexOf('商品名'),p:h.indexOf('価格'),s:h.indexOf('販売状況'),c:h.indexOf('商品の状態')};let body=rows.slice(1);
  if(ix.p<0){ix={n:0,p:1,s:2,c:3};body=rows}
  let it=targetId?getItem(targetId):null;let created=false;
  if(!it){const nm=(newName||'').trim()||String((body[0]||[])[ix.n]||'取り込み').slice(0,60);it=newItem({name:nm,st:'cand'});S.items.unshift(it);created=true}
  it.quotes=it.quotes||[];const seen=new Set(it.quotes.map(qKey));let add=0,dup=0,bad=0;const d=today();
  for(const r of body){const q=normQuote({title:ix.n>=0?r[ix.n]:'',price:r[ix.p],status:ix.s>=0?r[ix.s]:'',cond:ix.c>=0?r[ix.c]:'',src,date:d});q.imp='csv';
    if(!(q.price>0)||!q.status){bad++;continue}const k=qKey(q);if(seen.has(k)){dup++;continue}seen.add(k);it.quotes.push(q);add++}
  S.meta.imports=(S.meta.imports||[]).concat([{at:new Date().toISOString(),kind:'csv',item:it.id,src,add,dup,bad}]).slice(-30);
  save();return{total:body.length,add,dup,bad,it,created};
}

/* ============================================================
   バーコード読み取り（BarcodeDetector があれば使い、なければ内蔵のEAN-13解読）
   ============================================================ */
const LP=[[3,2,1,1],[2,2,2,1],[2,1,2,2],[1,4,1,1],[1,1,3,2],[1,2,3,1],[1,1,1,4],[1,3,1,2],[1,2,1,3],[3,1,1,2]];
const GP=LP.map(p=>p.slice().reverse());
const PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function matchDigit(R,o,left){
  const w=[R[o],R[o+1],R[o+2],R[o+3]],sum=w[0]+w[1]+w[2]+w[3];const v=w.map(x=>x*7/sum);let best=null,be=99;
  const test=(p,d,g)=>{let e=0;for(let k=0;k<4;k++)e+=Math.abs(v[k]-p[k]);if(e<be){be=e;best={d,g}}};
  LP.forEach((p,d)=>test(p,d,false));if(left)GP.forEach((p,d)=>test(p,d,true));
  return be<1.5?best:null;
}
function tryEAN(R,s){
  let W=0;for(let i=0;i<59;i++)W+=R[s+i];const m=W/95;
  for(const i of [0,1,2,27,28,29,30,31,56,57,58]){const g=R[s+i]/m;if(g<0.35||g>2.2)return null}
  if(s>0&&R[s-1]<m*2.5)return null;
  const dg=[];let par='';
  for(let d=0;d<6;d++){const r=matchDigit(R,s+3+d*4,true);if(!r)return null;dg.push(r.d);par+=r.g?'G':'L'}
  for(let d=0;d<6;d++){const r=matchDigit(R,s+32+d*4,false);if(!r)return null;dg.push(r.d)}
  const f=PAR.indexOf(par);if(f<0)return null;const code=f+dg.join('');return ean13ok(code)?code:null;
}
function decodeRow(L){
  const n=L.length,W=Math.max(10,n>>4);const pre=new Float64Array(n+1);for(let i=0;i<n;i++)pre[i+1]=pre[i]+L[i];
  let mn=255,mx=0;for(let i=0;i<n;i++){if(L[i]<mn)mn=L[i];if(L[i]>mx)mx=L[i]}if(mx-mn<40)return null;
  const gmid=(mn+mx)/2;
  const thr=[i=>gmid,
    i=>{const a=Math.max(0,i-W),b=Math.min(n,i+W);let lo=255,hi=0;for(let j=a;j<b;j+=2){if(L[j]<lo)lo=L[j];if(L[j]>hi)hi=L[j]}return hi-lo<(mx-mn)*0.3?gmid:(lo+hi)/2},
    i=>{const a=Math.max(0,i-W),b=Math.min(n,i+W);return Math.min((pre[b]-pre[a])/(b-a),gmid+(mx-mn)*0.25)}];
  for(const T of thr){
    const bits=new Uint8Array(n);for(let i=0;i<n;i++)bits[i]=L[i]<T(i)?1:0;
    const R=[],C=[];let c=bits[0],len=0;for(let i=0;i<n;i++){if(bits[i]===c)len++;else{R.push(len);C.push(c);c=bits[i];len=1}}R.push(len);C.push(c);
    for(let s=0;s+59<=R.length;s++){if(C[s]!==1)continue;const r=tryEAN(R,s);if(r)return r}
  }
  return null;
}
const cv=document.createElement('canvas');let cx=null;
function decodeImageData(img,W,H){
  for(let k=1;k<16;k++){const y=Math.round(H*k/16);const L=new Float32Array(W);
    for(let x=0;x<W;x++){let s=0;for(const dy of [-1,0,1]){const yy=Math.min(H-1,Math.max(0,y+dy));const i=(yy*W+x)*4;s+=img[i]*.299+img[i+1]*.587+img[i+2]*.114}L[x]=s/3}
    let r=decodeRow(L);if(!r)r=decodeRow(L.slice().reverse());if(r&&okScanCode(r))return r}
  return null;
}
function decodeFrame(v){
  const vw=v.videoWidth,vh=v.videoHeight;if(!vw)return null;const W=Math.min(1000,vw),sc=W/vw,H=Math.round(vh*0.5*sc);
  cv.width=W;cv.height=H;cx=cx||cv.getContext('2d',{willReadFrequently:true});cx.drawImage(v,0,vh*0.25,vw,vh*0.5,0,0,W,H);
  return decodeImageData(cx.getImageData(0,0,W,H).data,W,H);
}
const Scan={on:false,stream:null,det:null,last:'',lastT:0,cand:'',candN:0,timer:null,ac:null};
function beep(){try{Scan.ac=Scan.ac||new (window.AudioContext||window.webkitAudioContext)();const o=Scan.ac.createOscillator(),g=Scan.ac.createGain();o.frequency.value=1800;g.gain.value=.08;o.connect(g);g.connect(Scan.ac.destination);o.start();o.stop(Scan.ac.currentTime+.08)}catch(e){}}
async function startScan(){
  if(Scan.on)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('この環境ではカメラを使えません。ISBNを入力してください');return}
  try{Scan.ac=Scan.ac||new (window.AudioContext||window.webkitAudioContext)();Scan.ac.resume&&Scan.ac.resume()}catch(e){}
  const w=$('#camWrap');w.innerHTML=`<div id="cam"><video playsinline muted autoplay></video><div class="guide"></div><div class="hint">バーコードを赤線に合わせて横向きに（連続読み取り中）</div></div>`;
  const video=w.querySelector('video');
  try{Scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){w.innerHTML='';toast('カメラを起動できません（'+e.name+'）。設定でカメラを許可するか、ISBNを入力してください');return}
  video.srcObject=Scan.stream;try{await video.play()}catch(e){}
  Scan.det=null;
  if('BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes('ean_13'))Scan.det=new BarcodeDetector({formats:['ean_13']})}catch(e){}}
  Scan.on=true;renderPad();loop(video);
}
function stopScan(){Scan.on=false;clearTimeout(Scan.timer);if(Scan.stream){Scan.stream.getTracks().forEach(t=>t.stop());Scan.stream=null}const w=$('#camWrap');if(w)w.innerHTML='';if(UI.tab==='look'&&$('#pad').innerHTML)renderPad()}
async function loop(video){
  if(!Scan.on)return;let code=null;
  try{if(Scan.det){const r=await Scan.det.detect(video);for(const b of r){if(okScanCode(b.rawValue)){code=b.rawValue;break}}}else code=decodeFrame(video)}catch(e){}
  if(code)onCode(code);Scan.timer=setTimeout(()=>loop(video),Scan.det?150:80);
}
function onCode(code){
  if(!Scan.det){if(code===Scan.cand)Scan.candN++;else{Scan.cand=code;Scan.candN=1}if(Scan.candN<2)return}
  const t=Date.now();if(code===Scan.last&&t-Scan.lastT<3000)return;Scan.last=code;Scan.lastT=t;
  beep();const c=$('#cam');if(c){c.classList.add('hit');setTimeout(()=>c.classList.remove('hit'),350)}
  lookupCode(code,{auto:true});
}

  per(b){UI.per=b.dataset.v;render()},
  linkAdd(){S.links.push({id:uid(),name:'新しいボタン',url:'https://www.google.com/search?q={title}'});save();render()},
  linkDel(b){const i=+b.dataset.i;if(confirm(`「${S.links[i].name}」を削除しますか？`)){S.links.splice(i,1);save();render()}},
  linkUp(b){const i=+b.dataset.i;if(i>0){const t=S.links[i];S.links[i]=S.links[i-1];S.links[i-1]=t;save();render()}},
  linkReset(){if(confirm('リンクボタンを初期状態に戻しますか？')){S.links=DEF_LINKS.map(x=>({...x}));save();render()}},
  doBackup(){doBackup()},copyBackup(){copyBackup()},restoreOpen(){restoreOpen()},restoreRun(){restoreRun()},wipe(){wipe()},
  sedoOpen(){sedoOpen()},
  async sedoRun(){let src;try{src=parseSedo(await readFT('sd'))}catch(e){toast('読み込めません：'+e.message);return}
    const mode=$('#sdMode').value;if(mode==='replace'&&!confirm(`SSSの今のデータ（商品${S.items.length}件）を消して、SedoScopeのデータ（${src.items.length}件）に入れ替えます。よろしいですか？`))return;
    const sum=importSedo(src,mode,{applySet:$('#sdSet').checked});$('#sdSum').innerHTML=sedoSumHTML(sum);toast(`${sum.added}件を取り込みました`)},
  csvOpen(){csvOpen(null,'')},
  async csvRun(){const txt=await readFT('cv');if(!txt.trim()){toast('CSVを選ぶか貼り付けてください');return}
    let r;try{r=importCSV(txt,$('#cvT').value,$('#cvN').value,$('#cvS').value)}catch(e){toast(e.message);return}
    $('#cvSum').innerHTML=`<div class="card sum">取り込み先：<b class="ff">${esc(r.it.name)}</b>${r.created?'（新規作成）':''}<br>読み込んだ行 <b>${r.total}</b>／追加 <b>${r.add}</b>／重複除外 <b>${r.dup}</b>／読めない行 <b>${r.bad}</b></div>`;
    if(CUR&&!CUR.itemId&&r.created&&workKey(r.it.name)===workKey(CUR.title))CUR.itemId=null;
    toast(`${r.add}件を取り込みました`)}
};
function drawEditorKeep(){const y=$('#shB').scrollTop;drawEditor();$('#shB').scrollTop=y}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){setTab(t.dataset.tab);return}
  const b=e.target.closest('[data-act]');if(!b)return;if(b.tagName==='INPUT')return;const f=ACT[b.dataset.act];if(f)f(b,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='q'){e.preventDefault();doSearch()}
  if(e.key==='Enter'&&e.target.id==='manTitle'){e.preventDefault();ACT.setManTitle()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='lq'){UI.listQ=e.target.value;clearTimeout(UI.lqT);UI.lqT=setTimeout(()=>{const pos=e.target.selectionStart;render();const el=$('#lq');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}},250)}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.set){const path=el.dataset.set.split('.');let o=S.settings;for(let i=0;i<path.length-1;i++)o=o[path[i]];
    const k=path[path.length-1];let v=el.type==='checkbox'?el.checked:el.value;
    if(el.type!=='checkbox'&&el.inputMode&&/numeric|decimal/.test(el.inputMode)&&k!=='budget'){const n=num(v);v=isFinite(n)?n:o[k]}
    o[k]=v;save();if(UI.tab!=='look')render();else renderResult();return}
  if(el.dataset.qprice){const q=S.queue.find(x=>x.id===el.dataset.qprice);if(q){const n=num(el.value);q.price=isFinite(n)?n:'';save();render()}return}
  if(el.dataset.link!==undefined){const l=S.links[+el.dataset.link];if(l){l[el.dataset.k]=el.value;save()}return}
});
window.addEventListener('pagehide',()=>stopScan());
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopScan()});
setTab('look');
</script>
</body>
</html>
