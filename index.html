<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SedoScope">
<meta name="theme-color" content="#0f766e">
<title>SedoScope</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#14201d;--mu:#5d6b67;--ac:#0f766e;--ok:#15803d;--ng:#b91c1c;--bd:#d6dfdb;--wn:#b45309;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--band:rgba(42,120,214,.10);--grid:#e4eae7}
@media(prefers-color-scheme:dark){:root{--bg:#0d1412;--card:#17211e;--tx:#e8efec;--mu:#97a6a1;--ac:#2dd4bf;--ok:#4ade80;--ng:#f87171;--bd:#2b3a36;--wn:#fbbf24;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--band:rgba(57,135,229,.18);--grid:#23302c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Hiragino Sans",sans-serif;padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:15px;margin:18px 0 6px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.big{font-size:22px;font-weight:700}.mu{color:var(--mu);font-size:13px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;min-height:46px;font:inherit;font-size:16px;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;font-weight:600;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}button.d{color:var(--ng)}
.row{display:flex;gap:8px;margin-top:10px}.row.dz{margin-top:36px}.row>*{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.chips button{min-height:44px;white-space:nowrap;border-radius:18px;font-size:14px}.chips .on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.ok{color:var(--ok)}.ng{color:var(--ng)}.wn{color:var(--wn)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;min-height:56px;background:none;font-size:12px}nav .on{color:var(--ac)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.bd{display:inline-block;font-size:12px;padding:0 8px;border-radius:9px;border:1px solid var(--bd);margin-right:4px;white-space:nowrap}
.bd.th{color:var(--ok);border-color:var(--ok)}.bd.tm{color:var(--wn);border-color:var(--wn)}.bd.tl{color:var(--ng);border-color:var(--ng)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}.tbl th,.tbl td{padding:7px 2px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}.tbl th{font-size:12px;color:var(--mu);font-weight:600}.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.best td{font-weight:700}
.lb{display:flex;align-items:center;justify-content:center;min-height:46px;padding:0 10px;border:1px solid var(--bd);border-radius:12px;color:var(--ac);text-decoration:none;font-weight:600;background:var(--card);font-size:14px;text-align:center}
summary{min-height:46px;display:flex;align-items:center;font-weight:600;cursor:pointer;color:var(--ac)}
.vd{text-decoration:line-through;opacity:.6}
.lim{font-size:30px;font-weight:800}
#scan{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(16px + env(safe-area-inset-bottom))}
.vwrap{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;margin:8px 0}
#svid{width:100%;height:100%;object-fit:cover}.guide{position:absolute;left:8%;right:8%;top:36%;height:28%;border:2px solid #2dd4bf;border-radius:8px}
#dlg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#dlg[hidden]{display:none}
#dlg .dbox{background:var(--card);border-radius:16px;padding:16px;max-width:420px;width:100%;white-space:pre-wrap}
button.dz{background:var(--ng);color:#fff;border-color:var(--ng)}
#sstat{font-size:17px;font-weight:600;margin:6px 0;min-height:26px}
</style></head><body>
<main></main><nav></nav><div id="dlg" hidden></div>
<div id="scan" hidden><b>バーコード読み取り</b>
<div class="vwrap"><video id="svid" playsinline muted autoplay></video><div class="guide"></div></div>
<div id="sstat"></div>
<div class="row"><button id="sretry" data-a="sretry">カメラを起動</button><button id="sstop" data-a="sstop" hidden>カメラを停止</button><button data-a="sclose">閉じる</button></div>
<label>カメラが使えない・読めないときは、コードを手入力</label>
<div class="row"><input id="mcode" inputmode="numeric" placeholder="JAN・ISBN(数字)"><button class="p" data-a="suse" style="flex:0 0 72px">使う</button></div>
<p class="mu">読めないときは、バーコードの下の数字を手入力してください。入力欄をタップして「テキストをスキャン」を使うと、カメラで数字を読み取って入力できます。</p><p class="mu">読み取るのはコードだけです。商品名・価格は自動では入りません(本のISBNは書名を調べられる場合があります)。</p></div>
<script>
/* SedoScope v3(シンプル版)
   保存キー sedoscope_v1 と既存データはそのまま使う。既存の項目は削除・変更しない。
   v3で増える項目: 商品 … genre(ジャンル) ship(送料) pr/pa(ラクマ/ヤフオク想定売価) lc/lp/ldate(出品先/出品価格/出品日)
                  設定 … trate(目標利益率) rr/ra(ラクマ/ヤフオク手数料率) ship(送料初期値) */
const APP_VER='2026-10-23 夜';
const KEY='sedoscope_v1';
const ST={cand:'仕入候補',bought:'仕入済み',listed:'出品中',sold:'売却済み'};
const CH={m:'メルカリ',y:'Yahoo!フリマ',r:'楽天ラクマ',a:'ヤフオク'},CK=Object.keys(CH);
const SVN={m:'メルカリ',y:'Yahoo!フリマ',r:'楽天ラクマ',a:'Yahoo!オークション'}; /* 相場記録に保存するサービス名(以前の版と同じ) */
const SVC={'メルカリ':'m','Yahoo!フリマ':'y','楽天ラクマ':'r','Yahoo!オークション':'a','ヤフオク':'a'};
const GEN=['漫画','本','CD','DVD・ブルーレイ','トレカ','ゲーム','その他'];
const CONDS=['','新品・未使用','未使用に近い','目立った傷や汚れなし','やや傷や汚れあり','傷や汚れあり','全体的に状態が悪い'];
const STORES=['ブックオフ','セカンドストリート'];
const PUBS=['集英社','講談社','小学館','KADOKAWA','白泉社','秋田書店','スクウェア・エニックス','少年画報社','双葉社','竹書房','新潮社','芳文社','一迅社','マッグガーデン','徳間書店'];
const SETK=['単巻','全巻セット','途中セット'];
const KL={sold:'売り切れ',listing:'出品中'},TL={h:'高',m:'中',l:'低'};
const NUM=['bn','bp','cost','ship','pack','other','pm','py','pr','pa','pmlo','pmhi','pylo','pyhi','prlo','prhi','palo','pahi','lp','ap','afee','aship','apack','aother'];
let db,view='res',prev='res',cur=null,saveOK=true;
let lf='all',ls='new',l30=false,lq='',ltag='';
let shOpen=false,rq='',rob=null,rid=0,qc='m',qk='sold',imp=null,qOpen=false,ck=null,ckLog=[];
const $=s=>document.querySelector(s);
/* 確認・お知らせはアプリの画面内に表示する(iPhoneはブラウザのポップアップを止めることがあり、止まると「キャンセル」扱いになるため) */
let dlgFn=null;
function dlgShow(msg,btns){const d=$('#dlg');d.innerHTML=`<div class="dbox" role="dialog" aria-modal="true"><div>${esc(msg)}</div><div class="row">${btns}</div></div>`;d.hidden=false;const b=d.querySelector('[data-a=dok]');if(b)b.focus()}
function ask(msg,ok,fn,danger){dlgFn=fn;dlgShow(msg,`<button data-a="dno">キャンセル</button><button class="${danger?'dz':'p'}" data-a="dok">${esc(ok)}</button>`)}
function note(msg){dlgFn=null;dlgShow(msg,`<button class="p" data-a="dok">OK</button>`)}
window.alert=m=>note(String(m));
const TPL='ご覧いただきありがとうございます。\n\n【商品名】{商品名}\n【状態】{状態}\n{状態の補足}\n【付属品】{付属品}\n【発送】{発送方法}で発送します。\n\n中古品のため、写真に写りきらない傷や使用感がある場合があります。ご理解のうえご購入ください。';
/* 販路ごとの送料の初期データ(2026年の各社公式料金表より。資材代は含まない) [配送方法, メルカリ, Yahoo!フリマ, 楽天ラクマ] */
const SHIP_SEED=[['ゆうパケットポストmini',160,160,150],['ネコポス',210,210,200],['ゆうパケットポスト',215,210,175],['ゆうパケット',230,215,200],['ゆうパケットプラス',455,410,380],['宅急便コンパクト',450,490,430],['宅急便60',750,750,650],['宅急便80',850,850,750],['宅急便100',1050,1050,1050],['ゆうパック60',750,750,700],['ゆうパック80',870,850,800],['ゆうパック100',1070,1050,1150]];
/* コミック仕入のチェックポイント(「設定」で編集できる) */
const TAG_A=['全巻セット','完結','アニメ化・映画化・続編','初版','帯付き','特典付き','セットを組める'];
const TAG_V=['初版','帯付き','特典付き'];
const TAG_B=['巻数の抜けなし','版数を確認','日焼けなし','汚れなし','帯・特典の有無を確認'];
const def=()=>({items:[],set:{target:1000,trate:30,rm:null,ry:null,rr:null,ra:null,ship:0,pack:0,other:0,ships:[],stale:30,tpl:TPL},meta:{lastBackup:null,changes:0}});
const N=s=>{if(s==null)return null;s=String(s).replace(/[０-９．]/g,c=>c==='．'?'.':String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[,，円¥\s]/g,'');if(s==='')return null;const n=Number(s);return isFinite(n)?n:null};
const yen=n=>n==null?'—':(n<0?'-':'')+'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP');
const pct=n=>n==null?'—':Math.floor(n)+'%'; /* 切り捨て(29.6%を30%と表示しない) */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ds(new Date());
const nowL=()=>{const d=new Date();return today()+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const fdt=s=>s?String(s).replace('T',' '):'';
const dayAgo=s=>{const t=new Date(String(s).slice(0,10)+'T00:00').getTime();return isFinite(t)?Math.max(0,Math.floor((new Date(today()+'T00:00')-t)/864e5)):9999};
const feeOf=(p,r)=>Math.floor(+(p*r/100).toFixed(6));
const med=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):null};
const byD=(x,y)=>String(x.d).localeCompare(String(y.d))||String(x.t).localeCompare(String(y.t));
const ean=t=>{const d=[...t].map(Number),c=d.pop();let x=0;d.reverse().forEach((v,i)=>x+=v*(i%2?1:3));return (10-x%10)%10===c};
const norm=s=>String(s==null?'':s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[Ｘｘ]/g,'X').replace(/[-\s]/g,'').toUpperCase();
function chkCode(raw){const t=norm(raw);
 if(/^\d{13}$/.test(t)){if(/^19[12]/.test(t))return{ok:false,msg:'これは本の下段バーコード(分類・価格)です。上段の「978」か「979」で始まるバーコードを読み取ってください。'};return ean(t)?{ok:true,code:t}:{ok:false}}
 if(/^\d{12}$/.test(t))return ean(t)?{ok:true,code:'0'+t}:{ok:false};
 if(/^\d{8}$/.test(t))return ean(t)?{ok:true,code:t}:{ok:false};
 if(/^\d{9}[\dX]$/.test(t)){let x=0;[...t].forEach((c,i)=>x+=(c==='X'?10:+c)*(10-i));if(x%11)return{ok:false,msg:'ISBN-10の検査数字が合いません。入力を確認してください。'};const b='978'+t.slice(0,9);let y=0;[...b].forEach((c,i)=>y+=+c*(i%2?3:1));return{ok:true,code:b+(10-y%10)%10}}
 return{ok:false,msg:'JAN(13桁・8桁)またはISBN(13桁・10桁)の数字を入力してください。'}}
const nc=s=>{const t=norm(s);const r=chkCode(t);return r.ok?r.code:t};
const dup=(c,id)=>{if(!c)return null;const me=id&&db.items.find(x=>x.id===id),g=me?me.st==='cand':null;return db.items.find(i=>i.id!==id&&i.code&&nc(i.code)===c&&(g===null||(i.st==='cand')===g))||null};
function load(){try{const r=localStorage.getItem(KEY);db=r?JSON.parse(r):def()}catch(e){db=def();saveOK=false}
 if(!db||typeof db!=='object')db=def();if(!Array.isArray(db.items))db.items=[];
 const hadShip=db.set&&db.set.ship!=null;db.set=Object.assign(def().set,db.set);db.meta=Object.assign(def().meta,db.meta);
 if(!hadShip)db.set.ship=N(db.set.sm)||0;
 CK.forEach(c=>{const k='r'+c;if(!(db.set[k]>=0&&db.set[k]<100))db.set[k]=null});if(!(db.set.trate>=0&&db.set.trate<100))db.set.trate=30;
 if(!Array.isArray(db.set.ships))db.set.ships=[];
 /* 以前の配送方法(送料1つ)は、全販路に同じ送料として引き継ぐ */
 const mig=new Set();db.set.ships.forEach(x=>{if(x&&!x.p){const v=x.y==null?'':String(x.y);x.p={m:v,y:v,r:v,a:v};mig.add(x)}});
 if(!db.set.shipSeed){SHIP_SEED.forEach(([n,m,y,r])=>{const e=db.set.ships.find(x=>x&&x.n===n),pp={m:String(m),y:String(y),r:String(r)};if(e){if(mig.has(e))e.p=Object.assign({a:e.p.a},pp)}else db.set.ships.push({n,p:Object.assign({a:''},pp)})});db.set.shipSeed='2026';try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}if(!(db.set.stale>=1))db.set.stale=30;if(!Array.isArray(db.set.tagA))db.set.tagA=TAG_A.slice();if(!Array.isArray(db.set.tagB))db.set.tagB=TAG_B.slice();if(!Array.isArray(db.set.tagV))db.set.tagV=TAG_V.slice();if(!db.set.mainCh)db.set.mainCh='m';if(!Array.isArray(db.set.stores))db.set.stores=STORES.slice();if(!Array.isArray(db.set.pubs))db.set.pubs=PUBS.slice();if(typeof db.set.tpl!=='string'||!db.set.tpl.trim())db.set.tpl=TPL;
 /* 以前の版の商品: 送料・ジャンルを補う(元の項目は消さない) */
 db.items.forEach(i=>{if(i.ship==null){const v=i.sm!=null&&i.sm!==''?i.sm:i.sy;i.ship=v==null?'':String(v)}if(i.genre==null)i.genre=GEN.includes(i.cat)?i.cat:'';
  /* 以前の想定売価(1つの値)は、下限・上限の両方に入れる */
  CK.forEach(c=>{if(i['p'+c+'lo']==null&&i['p'+c+'hi']==null&&N(i['p'+c])!=null){i['p'+c+'lo']=String(N(i['p'+c]));i['p'+c+'hi']=String(N(i['p'+c]))}})})}
function save(skip){if(!skip)db.meta.changes++;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){saveOK=false;alert('保存できません。プライベートブラウズ中か容量不足の可能性があります。バックアップを取ってください。')}}
function touch(){cur.updated=new Date().toISOString();save()}

/* ===== 相場・信頼度・売れやすさ ===== */
const qOf=i=>Array.isArray(i.quotes)?i.quotes:[];
const qch=q=>SVC[q.svc]||null;
/* 同じ出品を2回記録した場合の二重カウント防止(出品タイトルがある記録のみ) */
const dd=a=>{const s=new Set();return a.filter(x=>{if(!x.title)return true;const k=[x.svc,x.kind,x.price,x.title].join('\u0001');if(s.has(k))return false;s.add(k);return true})};
function speed(s,l){if(s+l<5)return null;const r=l?s/l:Infinity;return r>=2?{k:'ok',t:'売れやすい'}:r>=0.7?{k:'',t:'普通'}:{k:'ng',t:'売れにくい'}}
/* ===== 付加価値ごとの相場(初版・帯付き・特典付きなど) ===== */
const vlist=t=>arr(t).filter(x=>db.set.tagV.includes(x));
const vkey=t=>{const a=vlist(t);return a.length?db.set.tagV.filter(x=>a.includes(x)).join('+'):'通常'};
const vdetect=title=>db.set.tagV.filter(v=>{const kw=v.replace(/付き$/,'');return kw&&String(title||'').includes(kw)});
function mkt(i,c){
 const a=dd(qOf(i).filter(q=>!q.void&&qch(q)===c)),rc=a.filter(q=>dayAgo(q.d)<=30);
 const r={c,s30:rc.filter(q=>q.kind==='sold').length,l30:rc.filter(q=>q.kind==='listing').length,n:0,why:[]};r.sp=speed(r.s30,r.l30);
 const sold=a.filter(q=>q.kind==='sold');if(!sold.length)return r;
 let use=sold,mixed=false,vmix=false;const iv=vkey(i.tags);{const sv=sold.filter(q=>vkey(q.tags)===iv);if(sv.length)use=sv;else vmix=true}
 const base=use;
 if(i.cond){const same=base.filter(q=>q.cond===i.cond);if(same.length)use=same;else mixed=true}
 else mixed=new Set(base.map(q=>q.cond||'')).size>1;
 use=use.slice().sort(byD).reverse().slice(0,20); /* 新しい順に最大20件 */
 const p=use.map(q=>q.price);Object.assign(r,{n:use.length,p:med(p),min:Math.min(...p),max:Math.max(...p),age:dayAgo(use[0].d),mixed});
 if(r.n<3)r.why.push('売り切れ'+r.n+'件のみ');else if(r.n<5)r.why.push('売り切れ'+r.n+'件');
 if(r.age>14)r.why.push('最新の記録が'+r.age+'日前');
 if(vmix)r.why.push('「'+iv+'」の記録がなく、付加価値の違う価格で計算');
 if(mixed)r.why.push(i.cond?'同じ状態の記録がなく、別の状態の価格で計算':'状態の違う記録が混ざっている');
 mixed=mixed||vmix;r.mixed=mixed;r.v=iv;
 r.t=r.n>=5&&r.age<=14&&!mixed?'h':r.n>=3&&r.age<=30&&!mixed?'m':'l';return r}
const trustB=m=>m&&m.n?`<span class="bd t${m.t}">信頼度 ${TL[m.t]}</span>`:'';

/* ===== 利益計算 ===== */
/* 想定売価: 下限〜上限の中央値。片方だけならその値。なければ相場の中央値 */
const rangeMid=(i,c)=>{const a=N(i['p'+c+'lo']),b=N(i['p'+c+'hi']);if(a==null&&b==null)return null;if(a==null||b==null)return a==null?b:a;return Math.round((Math.min(a,b)+Math.max(a,b))/2)};
function priceOf(i,c){const r=rangeMid(i,c);if(r!=null)return{v:r,src:'手入力'};const v=(i['p'+c+'lo']==null&&i['p'+c+'hi']==null)?N(i['p'+c]):null;if(v!=null)return{v,src:'手入力'};const m=mkt(i,c);return m.n?{v:Math.round(m.p),src:'相場',m}:null}
/* 送料: 商品に入力した送料。空欄なら「設定」の送料を使う */
const shipP=(n,c)=>{const x=n&&db.set.ships.find(z=>z&&z.n===n);const v=x&&x.p?N(x.p[c]):null;return v!=null&&v>=0?v:null};
/* 送料: 配送方法を選んでいれば、その販路の送料。なければ商品の送料欄、空欄なら「設定」の送料 */
const shipV=(i,c)=>{const pv=c?shipP(i.shipm,c):null;if(pv!=null)return{v:pv,def:false,m:i.shipm};const v=N(i.ship);return v!=null&&v>=0?{v,def:false}:{v:N(db.set.ship)||0,def:true}};
/* 利益の内訳(送料・梱包費などを引いたことが分かるように表示) */
function brk(r){if(!r||r.none)return'';const a=[`売価 ${yen(r.price)}`,`手数料 ${yen(r.fee)}`,`送料 ${yen(r.ship)}${r.shipM?'('+esc(r.shipM)+')':r.shipDef?'(設定の送料)':''}`];if(r.pack)a.push(`梱包費 ${yen(r.pack)}`);if(r.other)a.push(`その他 ${yen(r.other)}`);
 return `<div class="mu" style="margin-top:4px">${r.profit!=null?a.concat(`仕入 ${yen(r.cost)}`).join(' − ')+` = 利益 <b>${yen(r.profit)}</b>(利益率 ${pct(r.rate)})`:a.join(' − ')+` − 残したい利益 ${yen(r.price-r.fee-r.exp-r.limit)}(利益率${db.set.trate}%) = 仕入上限 <b>${r.limit<0?'不可':yen(r.limit)}</b>`}</div>`}
function calc(i,c,borrow){
 let pr=priceOf(i,c),bw=null;if(!pr&&borrow){for(const c2 of CK){if(c2===c)continue;const x=priceOf(i,c2);if(x){pr=x;bw=c2;break}}}
 const rate=db.set['r'+c];if(!pr)return{c,none:'売価なし'};if(rate==null)return{c,none:'手数料率未設定',price:pr.v,src:pr.src,m:pr.m};
 const price=pr.v,fee=feeOf(price,rate),sh=shipV(i,c),pk=N(i.pack)||0,ot=N(i.other)||0,exp=sh.v+pk+ot,cost=N(i.cost);
 const need=Math.ceil(price*db.set.trate/100); /* 判定は利益率のみ(利益÷売価が目標以上) */
 const r={c,price,src:pr.src,m:pr.m,fee,exp,ship:sh.v,shipDef:sh.def,shipM:sh.m,bw,pack:pk,other:ot,cost,limit:price-fee-exp-need};
 if(cost!=null){r.profit=price-fee-exp-cost;r.rate=price>0?r.profit/price*100:null;r.ok=r.profit>0&&r.rate!=null&&r.rate>=db.set.trate}
 return r}
function best(i,any){const mc=db.set.mainCh;if(!any&&mc&&mc!=='best'){const r=calc(i,mc,true);if(!r.none)return r}let b=null;CK.forEach(c=>{const r=calc(i,c);if(r.none)return;const v=r.profit!=null?r.profit:r.limit,bv=b&&(b.profit!=null?b.profit:b.limit);if(!b||v>bv)b=r});return b}
function fin(i){const p=N(i.ap),c=N(i.cost);if(p==null||c==null||!i.ac||p<0||c<0)return null;
 let fee=N(i.afee);if(fee==null){const rt=db.set['r'+i.ac];if(rt==null)return null;fee=feeOf(p,rt)}
 const pk=N(i.apack)??N(i.pack)??0,ot=N(i.aother)??N(i.other)??0;return p-c-fee-(N(i.aship)||0)-pk-ot}
