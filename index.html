<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SSS</title>
<style>
:root{
  --bg:#0f1115;--card:#181b22;--card2:#1f232c;--line:#2b303b;--tx:#e9ecf2;--mut:#98a1b0;--acc:#5aa9ff;
  --ss:#2fd27a;--s:#5aa9ff;--w:#f5b83d;--x:#ff5d5d;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --tabh:58px;--safe:env(safe-area-inset-bottom,0px);
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;
  --r-lg:14px;--r-md:10px;--r-sm:8px;
  --fs-sec:13px;--fs-body:15px;--fs-sub:12px;--fs-sheet:17px;
  --h-btn:44px;--h-input:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
/* 画面の枠を固定し、スクロールは本文(main)の中だけで行う。
   ページ全体がスクロールするとiOS Safariのツールバーが伸び縮みし、タブごとに画面の高さが変わってガタつくため */
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{touch-action:manipulation;cursor:pointer}
a{color:var(--acc)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
small.u{font-size:.6em;color:var(--mut);margin-left:2px}
.mut{color:var(--mut)}
header{position:relative;flex:none;z-index:20;background:rgba(15,17,21,.95);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;letter-spacing:.08em}
header .ver{font-size:11px;color:var(--mut);background:none;border:1px solid var(--line);border-radius:var(--r-md);padding:1px 8px}
header .store{margin-left:auto;font-size:12px;color:var(--mut);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#banner{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + var(--safe) + var(--padh,0px) + var(--sp2));z-index:40}
#banner:empty{display:none}
.banner{margin:0;padding:10px 12px;border-radius:10px;background:#3a2a0b;border:1px solid #6b4d12;color:#ffd98a;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.banner button{margin-left:auto;background:#6b4d12;border:0;border-radius:8px;padding:6px 10px;color:#fff;white-space:nowrap}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:var(--sp3) var(--sp3) calc(var(--tabh) + var(--safe) + 16px + var(--sp2))}
main.withpad{padding-bottom:calc(var(--tabh) + var(--safe) + var(--padh,300px) + 12px + var(--sp2))}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#12151b;border-top:1px solid var(--line);padding-bottom:var(--safe);height:calc(var(--tabh) + var(--safe))}
nav#tabs button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
nav#tabs button .i{font-size:20px;line-height:1}
nav#tabs button.on{color:var(--tx)}
nav#tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
nav#tabs .badge{position:absolute;top:5px;right:22%;background:var(--x);color:#fff;border-radius:9px;font-size:10px;min-width:17px;padding:0 4px;line-height:17px}
#pad{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--safe));z-index:25;background:#12151b;border-top:1px solid var(--line);padding:8px 10px}
#pad[hidden]{display:none}
.pricebar{display:flex;align-items:baseline;gap:6px;padding:0 4px 6px}
.pricebar .lbl{font-size:12px;color:var(--mut)}
.pricebar #pv{font-size:30px;font-weight:700;margin-left:auto}
.pricebar .tg{align-self:center;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 10px;font-size:12px;color:var(--mut)}
.keys{display:grid;grid-template-columns:1fr 1fr 1fr 1.25fr;gap:6px}
.keys button{height:var(--h-btn);border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);font-size:22px;font-family:var(--mono)}
.keys button:active{background:var(--card2)}
.keys button.fn{font-size:16px;color:var(--mut)}
.keys button.a{font-family:inherit;font-size:13px;font-weight:700;border:0;background:var(--card2)}
.keys button.a.pri{background:var(--acc);color:#04203f}
.keys button.a.scan-on{background:var(--x);color:#fff}
.acts{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px}
.acts button{height:var(--h-btn);border-radius:var(--r-md);border:0;background:var(--card2);font-size:13px;font-weight:600}
#res{min-height:calc(100dvh - 120px)}
.acts button.pri{background:var(--acc);color:#04203f}
.acts button.scan-on{background:var(--x);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp3);margin-bottom:var(--sp2)}
.row{display:flex;gap:8px;align-items:center}
.srch{display:flex;gap:var(--sp2);margin-bottom:var(--sp2)}
.srch input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:var(--h-input);padding:0 var(--sp3)}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:var(--h-btn);padding:0 var(--sp3);font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04203f;font-weight:700}
.btn.dng{background:#3a1416;border-color:#6b2328;color:#ffb3b3}
.btn.sm{height:32px;padding:0 var(--sp2);font-size:12px;border-radius:var(--r-sm)}
.btns{display:flex;gap:var(--sp2);flex-wrap:wrap}
#cam{position:relative;border-radius:var(--r-lg);overflow:hidden;background:#000;margin-bottom:var(--sp2);height:170px}
#cam video{width:100%;height:100%;object-fit:cover;display:block}
#cam .guide{position:absolute;left:8%;right:8%;top:50%;height:2px;background:rgba(255,80,80,.85);box-shadow:0 0 8px rgba(255,80,80,.9)}
#cam .hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:#ddd;text-shadow:0 1px 2px #000}
#cam.hit{outline:4px solid var(--ss);outline-offset:-4px}
.bib{display:flex;gap:10px}
.bib img{width:52px;height:74px;object-fit:cover;border-radius:var(--sp1);background:var(--card2);flex:none}
.bib .t{font-weight:700;font-size:16px;line-height:1.35}
.bib .s{font-size:var(--fs-sub);color:var(--mut)}
.judge{display:grid;grid-template-columns:auto 1fr;gap:var(--sp3);align-items:center;margin-top:var(--sp3)}
.sig{width:92px;height:92px;border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid;font-weight:800}
.sig .mk{font-size:46px;line-height:1}
.sig .tx{font-size:14px;margin-top:2px}
.sig.ss{color:var(--ss);border-color:var(--ss);background:rgba(47,210,122,.12)}
.sig.s{color:var(--s);border-color:var(--s);background:rgba(90,169,255,.12)}
.sig.w{color:var(--w);border-color:var(--w);background:rgba(245,184,61,.12);border-style:dashed}
.sig.x{color:var(--x);border-color:var(--x);background:rgba(255,93,93,.12)}
.sig.n{color:var(--mut);border-color:var(--line)}
.kp label{display:block;font-size:var(--fs-sub);color:var(--mut)}
.kp .big{font-size:30px;font-weight:800;line-height:1.15}
.kp .mid{font-size:22px;font-weight:700}
.kp .pos{color:var(--ss)}.kp .neg{color:var(--x)}
.basis{font-size:var(--fs-sub);color:var(--mut);margin-top:var(--sp2)}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp1);margin-top:var(--sp2)}
.chip{font-size:var(--fs-sub);border-radius:999px;padding:var(--sp1) var(--sp2);border:1px solid var(--line);background:var(--card2)}
.chip.warn{border-color:#7a5a17;background:#33270d;color:#ffd98a}
.chip.bad{border-color:#7a2a2f;background:#331316;color:#ffb3b3}
.chip.info{color:var(--mut)}
.links{display:flex;gap:var(--sp2);overflow-x:auto;margin-top:var(--sp3);padding-bottom:2px}
.links a{flex:none;text-decoration:none;font-size:12px;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:var(--r-sm);padding:var(--sp2) var(--sp3)}
details.det{margin-top:var(--sp3)}
details.det summary{font-size:var(--fs-sec);color:var(--acc);cursor:pointer;list-style:none}
details.det summary::-webkit-details-marker{display:none}
table{border-collapse:collapse;width:100%;font-size:var(--fs-sub)}
th,td{padding:6px var(--sp1);border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500}
tr.best{color:var(--ss)}
.sec{font-size:var(--fs-sec);color:var(--mut);margin:var(--sp4) var(--sp1) var(--sp2);font-weight:600}
.list .it{display:flex;gap:var(--sp3);align-items:center;padding:var(--sp3);border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);margin-bottom:var(--sp2)}
.list .it img,.list .it .ph{width:40px;height:56px;border-radius:var(--sp1);object-fit:cover;background:var(--card2);flex:none}
.list .it .m{flex:1;min-width:0}
.list .it .t{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.list .it .s{font-size:var(--fs-sub);color:var(--mut)}
.list .it .r{text-align:right;flex:none}
.st{font-size:11px;border-radius:var(--r-sm);padding:var(--sp1) var(--sp2);border:1px solid var(--line);margin-right:var(--sp1)}
.st.cand{color:#c8b6ff;border-color:#4a3f75}.st.stock{color:#8fd3ff;border-color:#25506b}.st.listed{color:#ffd98a;border-color:#6b4d12}.st.sold{color:#9be7b6;border-color:#1f5a37}.st.deal{color:#ffb38a;border-color:#6b3a1f}
.minisig{display:inline-flex;width:30px;height:30px;border-radius:var(--r-sm);border:2px solid;align-items:center;justify-content:center;font-weight:800}
.minisig.ss{color:var(--ss)}.minisig.s{color:var(--s)}.minisig.w{color:var(--w);border-style:dashed}.minisig.x{color:var(--x)}.minisig.n{color:var(--mut);border-color:var(--line)}
.it.pick{border-color:var(--ss)!important;box-shadow:inset 0 0 0 1px var(--ss)}
.fchips{display:flex;gap:var(--sp2);overflow-x:auto;margin-bottom:var(--sp2)}
.fchips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);height:32px;padding:0 var(--sp3);font-size:var(--fs-sec);color:var(--mut)}
.fchips button.on{background:var(--acc);border-color:var(--acc);color:#04203f;font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp2)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp3)}
.kpi label{font-size:var(--fs-sub);color:var(--mut);display:block}
.kpi b{font-size:22px}
.fld{margin-bottom:var(--sp3)}
.fld label{display:block;font-size:var(--fs-sub);color:var(--mut);margin-bottom:var(--sp1)}
.fld input,.fld select,.fld textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:var(--h-input);padding:0 var(--sp2);font-size:16px}
.fld textarea{height:auto;min-height:70px;padding:var(--sp2)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 var(--sp2)}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:0 var(--sp2)}
.tri{display:flex;flex-wrap:wrap;gap:var(--sp2)}
.tri button{border:1px solid var(--line);background:var(--card2);border-radius:var(--r-md);height:32px;padding:0 var(--sp3);font-size:var(--fs-sec)}
.tri button.yes{border-color:var(--ss);color:var(--ss)}
.tri button.no{border-color:var(--x);color:var(--x)}
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#sheet[hidden]{display:none}
#sheet .sh{display:flex;align-items:center;gap:var(--sp2);padding:calc(env(safe-area-inset-top,0px) + var(--sp3)) var(--sp3) var(--sp3);border-bottom:1px solid var(--line)}
#sheet .sh h2{font-size:var(--fs-sheet);margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .sb{flex:1;overflow:auto;padding:var(--sp3) var(--sp3) calc(30px + var(--safe))}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 56px);z-index:60;background:#2a3140;color:#fff;padding:var(--sp3) var(--sp4);border-radius:var(--r-md);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:2px var(--sp2);font-size:var(--fs-sub);padding:6px 0;border-bottom:1px solid var(--line)}
.sum{font-size:13px;line-height:1.7}
.sum b{font-family:var(--mono)}
.inline-in{width:92px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:36px;padding:0 var(--sp2);font-size:16px;text-align:right;font-family:var(--mono)}
.note{font-size:var(--fs-sub);color:var(--mut)}
.mt0{margin-top:0}.mt1{margin-top:var(--sp1)}.mt2{margin-top:var(--sp2)}.mt3{margin-top:var(--sp3)}.mb2{margin-bottom:var(--sp2)}.mb3{margin-bottom:var(--sp3)}
.my3{margin:var(--sp3) var(--sp1)}.my4{margin:var(--sp4) 0}
.fz-sec{font-size:var(--fs-sec)}.fz-body{font-size:var(--fs-body)}.lbl14{font-size:14px}
.wrap{white-space:normal;overflow-wrap:anywhere}.ff{font-family:inherit}.grow{flex:1;min-width:0}
.ta-mono{min-height:110px;font-family:var(--mono)}
.kp .big{font-size:clamp(22px,7.5vw,30px)}
.kp .mid{font-size:clamp(18px,6vw,22px)}
table.fixt{table-layout:fixed}
.calcrow{display:flex;gap:var(--sp2);align-items:center;margin-bottom:var(--sp2)}
.calcrow .inline-in{width:96px}
.gen{border:2px solid var(--acc);border-radius:var(--r-lg);padding:var(--sp3);margin-bottom:var(--sp3)}
.gen h4{margin:0 0 var(--sp2);font-size:var(--fs-sec)}
.gsec{font-size:var(--fs-sub);color:var(--mut);font-weight:700;margin:var(--sp3) 0 var(--sp1)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--sp2)}
.opts label{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--card2)}
.opts input{accent-color:var(--acc);width:auto;height:auto}
.pvb{white-space:pre-wrap;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp2);font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.pvt{font-weight:700;overflow-wrap:anywhere}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin:var(--sp1) 0 var(--sp2)}.tchips button{font-size:12px;border-radius:999px;padding:4px 10px;border:1px solid var(--line);background:var(--card2);color:var(--mut)}.tchips button.on{background:var(--acc);border-color:var(--acc);color:#04203f}
.wn{color:var(--w);font-weight:700}
.lim td,.lim th{font-size:12px}.lim tr.under td{color:var(--x)}
.selfrow{display:flex;gap:var(--sp2);margin-bottom:var(--sp2);flex-wrap:wrap;align-items:center}
.self{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.self span{font-size:var(--fs-sub);color:var(--mut)}
.self select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:36px;padding:0 var(--sp2);font-size:14px}
.qchk{width:20px;height:20px;flex:none;accent-color:var(--acc)}
.hunt-acc summary{font-weight:700;cursor:pointer}
.hrow{display:flex;gap:var(--sp2);padding:var(--sp2) 0;border-bottom:1px solid var(--line);cursor:pointer}
.hrow .t{font-weight:600;overflow-wrap:anywhere}.hrow .s{font-size:var(--fs-sub);color:var(--mut)}
.hrow .hd{font-size:11px;color:var(--mut);text-align:right;flex:none;line-height:1.3}.hrow .hd.old{color:var(--w)}
.hcard{padding-top:0;padding-bottom:0}.hcard .hrow:last-child{border-bottom:none}
.hrow .h1{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px var(--sp2)}.hrow .h1 .t{font-size:16px;font-weight:700}.hrow .hv{font-size:var(--fs-sub);color:var(--mut)}.hrow .h1 .st{font-size:10px}
.hrow .hp{display:flex;flex-wrap:wrap;gap:4px var(--sp3);margin-top:4px}
.pz{font-family:var(--mono,ui-monospace),monospace;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;white-space:nowrap}.pz small{font-family:-apple-system,sans-serif;font-weight:400;font-size:11px;color:var(--mut);margin-right:4px}
.pz.cap{color:var(--ss)}.pz.med{color:var(--tx)}.pz.none small{margin:0}
.hrow .hm{font-size:12px;color:var(--mut);margin-top:3px;overflow-wrap:anywhere}
.hrow .ho{display:inline-block;font-size:11px;color:var(--s);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-top:4px}
.hcats{margin-bottom:var(--sp2)}
.hgens{margin-top:calc(-1 * var(--sp1));margin-bottom:var(--sp2)}
.sec.gfold{display:flex;align-items:center;gap:var(--sp2);cursor:pointer;user-select:none;-webkit-user-select:none;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp2) var(--sp3);margin-left:0;margin-right:0;color:var(--tx)}
.sec.gfold:active{opacity:.7}.sec.gfold .gfi{color:var(--acc);font-size:14px;flex:none}
.hinfo{display:flex;align-items:center;gap:var(--sp2);font-size:12px;color:var(--mut);margin:0 var(--sp1) var(--sp1);flex-wrap:wrap}
.hx summary{cursor:pointer;color:var(--mut);list-style:none}.hx summary::before{content:"ⓘ "}.hx summary::-webkit-details-marker{display:none}.hx[open]{flex-basis:100%}
.chip.hunt{border-color:#25506b;background:#10283a;color:#8fd3ff;font-weight:700}
label.pick{position:relative;overflow:hidden}label.pick input{position:absolute;inset:0;opacity:0;font-size:0}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + var(--safe) + var(--sp2));z-index:35;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp2) var(--sp3);display:flex;gap:var(--sp2);align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.selbar .grow{font-size:13px}
.grid2>.fld,.grid3>.fld{min-width:0}
.fld input,.fld select,.fld textarea{min-width:0;max-width:100%}
/* v1.7.4：iPhoneの日付欄は中身の幅で広がり、2列の枠からはみ出すため、見た目を素の入力にそろえて幅を固定する */
.fld input[type=date],.fld input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;line-height:var(--h-input);text-align:left}
.fld input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0}
.fld select{-webkit-appearance:none;appearance:none;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.grid2>*,.grid3>*{min-width:0;max-width:100%}
.edsec{min-width:0;overflow-x:hidden}
input[type="date"]{min-width:0;max-width:100%}
.fld label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2,.grid3{align-items:start}

/* ---------- 保存 ---------- */
function fixState(s){
  const d=defState(); if(!s||typeof s!=='object'||Array.isArray(s)) return d;
  s.items=Array.isArray(s.items)?s.items.filter(x=>x&&typeof x==='object'):[];
  s.queue=Array.isArray(s.queue)?s.queue:[];
  s.biblio=(s.biblio&&typeof s.biblio==='object')?s.biblio:{};
  const ds=defSettings(), ss=(s.settings&&typeof s.settings==='object')?s.settings:{};
  const ch={}; for(const c of CH) ch[c]=Object.assign({},ds.ch[c],(ss.ch||{})[c]||{});
  s.settings=Object.assign(ds,ss,{ch,acc:Object.assign({},ds.acc,ss.acc||{})});
  s.links=Array.isArray(s.links)?s.links:d.links;
  s.hunt=Array.isArray(s.hunt)?s.hunt:[];
  if(s.templates!==undefined&&!Array.isArray(s.templates))delete s.templates;   // v1.7.3：定型文はPOSTAへ一本化。古いデータの templates は残すが使わない
  s.expenses=Array.isArray(s.expenses)?s.expenses.filter(x=>x&&typeof x==='object'):[];
  for(const it of s.items)if(!it.cat)it.cat=BOOK;   // v1.6.0：既存アイテムは本・コミック
  s.meta=Object.assign(d.meta,s.meta||{});
  s.schema=1; return s;
}
function load(){let s=null;try{const t=localStorage.getItem(KEY);if(t)s=JSON.parse(t)}catch(e){console.warn(e)}return fixState(s)}

function median(a){if(!a.length)return NaN;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}

function pd(s){if(!s)return null;if(s instanceof Date)return s;if(typeof s==='number')return new Date(s);
  const t=String(s).normalize('NFKC').trim();const m=t.match(/(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})/);
  if(m)return new Date(+m[1],m[2]-1,+m[3]);const d=new Date(t);return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function daysAgo(s){const d=pd(s);if(!d)return null;const n=new Date();n.setHours(0,0,0,0);return Math.round((n-d)/864e5)}

/* ---------- コード（ISBN/JAN） ---------- */
function ean13ok(c){if(!/^\d{13}$/.test(c))return false;let s=0;for(let i=0;i<12;i++)s+=(+c[i])*(i%2?3:1);return (10-s%10)%10===+c[12]}
function isbn10to13(t){const b='978'+t.slice(0,9);let s=0;for(let i=0;i<12;i++)s+=(+b[i])*(i%2?3:1);return b+((10-s%10)%10)}
function normCode(v){let t=String(v??'').normalize('NFKC').replace(/[^0-9Xx]/g,'').toUpperCase();
  if(/^\d{9}[\dX]$/.test(t))return isbn10to13(t);
  if(/^\d{13}$/.test(t)||/^\d{8}$/.test(t))return t;return t.replace(/X/g,'')}
function okScanCode(c){return ean13ok(c)&&!/^19[0-9]/.test(c)}   // 書籍の2段目(192…)は無視
const isISBN=c=>/^97[89]\d{10}$/.test(c);

/* ---------- 正規化 ---------- */
function workKey(s){
  if(!s)return '';let t=String(s).normalize('NFKC').toLowerCase();
  t=t.replace(/[【\[(（「『〈<][^】\])）」』〉>]*[】\])）」』〉>―—]/g,' ');
  t=t.replace(/全\s*\d+\s*巻|\d+\s*[-~〜～]\s*\d+\s*巻?|第?\s*\d+\s*巻|vol\.?\s*\d+/g,' ');
  t=t.replace(/([\s―—])\d{1,3}(?=[\s―—]|$)/g,'$1');
  t=t.replace(/全巻|完結|セット|初版|帯付き?|チラシ付き?|特典付き?|美品|中古|コミックス?|漫画|まとめ売り?|送料無料|即購入可/g,' ');
  t=t.replace(/[\s・:：!！?？、。,.\-_~〜～\/／|｜+＋'"]+/g,'');

function chKey(v){const t=String(v??'').normalize('NFKC').toLowerCase().trim();if(!t)return 'o';

function qStatus(v){if(v===true)return 'sold';if(v===false)return 'listing';const t=String(v??'').normalize('NFKC').toLowerCase();

function normSt(v){if(ST[v])return v;const t=String(v??'').normalize('NFKC').toLowerCase();

const qKey=q=>[q.title,q.price,q.status,q.cond,q.ch].join('|');

/* ---------- 相場プール ---------- */
function index(){
  if(IDX)return IDX;const by=new Map(),keyOf=new Map();
  for(const it of S.items){if(!isBook(it))continue;const k=workKey(it.work||it.name);keyOf.set(it,k);if(!k)continue;if(!by.has(k))by.set(k,[]);by.get(k).push(it)}
  return IDX={by,keyOf};
}
const itemKey=it=>index().keyOf.get(it)??workKey(it.work||it.name);
function poolItemsFor(key,broad){
  if(!key)return [];const {by}=index();if(by.has(key)&&!broad)return by.get(key).slice();
  const out=by.has(key)?by.get(key).slice():[];if(key.length<3)return out;
  for(const [k,arr] of by){if(k!==key&&k.length>=3&&(k.includes(key)||key.includes(k)))out.push(...arr)}
  return out;
}
// 判定用：正規化名が完全一致する商品だけ（版違い・部分セットを混ぜない）
const nname=s=>String(s??'').normalize('NFKC').trim();
function exactItemsFor(it){const n=nname(it&&it.name);if(!n)return it?[it]:[];const c=catOf(it);return S.items.filter(x=>nname(x.name)===n&&catOf(x)===c)}
// 最頻価格帯：各価格pを起点に[p, p×1.25]に入る価格の集合で、件数最大（同数なら平均が全体の中央値に最も近い）の帯
function modeBand(prices){
  const a=[...prices].sort((x,y)=>x-y);if(!a.length)return null;const med=median(a);let best=null;
  for(let i=0;i<a.length;i++){const lim=a[i]*1.25;let j=i;while(j+1<a.length&&a[j+1]<=lim)j++;
    const b=a.slice(i,j+1),avg=b.reduce((x,y)=>x+y,0)/b.length;
    if(!best||b.length>best.n||(b.length===best.n&&Math.abs(avg-med)<Math.abs(best.avg-med)))best={lo:b[0],hi:b[b.length-1],n:b.length,avg}}
  return best;
}
const tnorm=t=>String(t||'').normalize('NFKC').toLowerCase().replace(/[\s・:：!！?？、。,.\-_~〜～\/／|｜+＋'"★☆【】\[\]()（）「」『』]+/g,'');
function titleOk(q,key){return !q.title||!key||key.length<2||tnorm(q.title).includes(key)}
function poolQuotes(items,key){const seen=new Set(),out=[];let ex=0;
  for(const it of items)for(const q of (it.quotes||[])){if(!q||!(q.price>0))continue;if(!titleOk(q,key)){ex++;continue}const k=qKey(q)+'|'+q.date;if(seen.has(k))continue;seen.add(k);out.push(q)}
  out.excluded=ex;return out}
function qstats(qs){
  const sold=qs.filter(q=>q.status==='sold'),lis=qs.filter(q=>q.status==='listing');
  const sp=sold.map(q=>q.price).sort((a,b)=>a-b);let latest=null;
  for(const q of sold){const d=pd(q.date);if(d&&(!latest||d>latest))latest=d}
  const srcs=[...new Set(qs.map(q=>q.ch&&q.ch!=='o'?S.settings.ch[q.ch].name:(q.src||'販路不明')))];
  const cond={};for(const q of sold){const c=q.cond||'状態不明';(cond[c]=cond[c]||[]).push(q.price)}
  return{soldN:sold.length,lisN:lis.length,sp,hi:sp.length?sp[sp.length-1]:NaN,lo:sp.length?sp[0]:NaN,med:median(sp),
    lisLo:lis.length?Math.min(...lis.map(q=>q.price)):NaN,latest,srcs,cond}
}
function bimodal(sp){if(sp.length<4)return false;const a=[...sp].sort((x,y)=>x-y);let best=0,idx=-1;
  for(let i=1;i<a.length;i++){const r=a[i]/a[i-1];if(r>best){best=r;idx=i}}
  return best>=1.6&&idx>=2&&a.length-idx>=2}
function parseVols(s){const set=new Set();String(s||'').normalize('NFKC').split(/[,、\s]+/).forEach(p=>{
  const m=p.match(/^(\d+)(?:[-~〜](\d+))?$/);if(!m)return;const a=+m[1],b=m[2]?+m[2]:a;if(Math.abs(b-a)>500)return;
  for(let i=Math.min(a,b);i<=Math.max(a,b);i++)set.add(i)});return set}
function volOf(name){const t=String(name||'').normalize('NFKC');
  const m=t.match(/第?\s*(\d+)\s*巻/)||t.match(/vol\.?\s*(\d+)/i)||t.match(/\s(\d{1,3})\s*$/)||t.match(/[\s―—](\d{1,3})(?=[\s―—]|$)/);return m?+m[1]:null}
function volCheck(it,pool){
  if(!it||!it.range)return null;const need=parseVols(it.range);if(!need.size)return null;
  let have,src;
  if(it.have){have=parseVols(it.have);src='手元の巻の入力'}
  else{have=new Set();for(const p of pool){if(p===it||p.st==='sold'||/セット/.test(String(p.setk||'')+String(p.name||''))||Array.isArray(p.members))continue;const vv=String(p.vols??'').normalize('NFKC').trim();const v=/^\d+$/.test(vv)?+vv:volOf(p.name);if(v)have.add(v)}src='登録済みの単巻';if(!have.size)return{need:need.size,missing:[],unknown:true}}
  return{need:need.size,missing:[...need].filter(v=>!have.has(v)).sort((a,b)=>a-b),src}
}
function edWords(s){const t=String(s||'').normalize('NFKC');return EDS.filter(w=>t.includes(w))}
function editionNote(title,pool,it){
  const cur=new Set(edWords(title+' '+(it&&it.tags||'')));const others=new Set();let plain=0,total=0;
  for(const p of pool){const texts=[p.name,...(p.quotes||[]).map(q=>q.title)].filter(Boolean);
    for(const tx of texts){if(p===it&&tx===p.name)continue;total++;const w=edWords(tx);if(!w.length)plain++;w.forEach(x=>others.add(x))}}
  const out=[...others].filter(w=>!cur.has(w));

function dupInfo(code,exId){
  const c=normCode(code);if(!c)return [];const out=[];
  for(const it of S.items){if(String(it.id)===String(exId)||normCode(it.code)!==c)continue;
    if(it.st==='stock'||it.st==='listed')out.push({lv:'bad',t:`${ST[it.st]}に同じISBNあり`,id:it.id});

  if(it&&it.acc)for(const [k,l] of ACC){if(it.acc[k]==='no'){const r=num(S.settings.acc[k])||0;f*=1-r/100;miss.push(l+'なし'+(r?`（-${r}%）`:''))}}
  return{f,miss}}

/* ---------- 探し物リスト ---------- */
const hkey=e=>workKey(e.work||e.title);
function keyMatch(a,b){if(!a||!b)return false;if(a===b)return true;const s1=a.length<=b.length?a:b,l=a.length<=b.length?b:a;return s1.length>=3&&l.includes(s1)}
function itemVols(it){if(it.have){const s=parseVols(it.have);if(s.size)return s}const r=itemRangeOf(it);const out=new Set();if(r)for(let v=r[0];v<=r[1];v++)out.add(v);return out}
function huntInv(e){if(!isBook(e))return [];const k=hkey(e);return S.items.filter(it=>(it.st==='stock'||it.st==='listed')&&isBook(it)&&!it.mixed&&keyMatch(k,itemKey(it)))}   // 取引中・売却済は所持に数えない
function ownedVols(e){const set=new Set();for(const it of huntInv(e))for(const v of itemVols(it))set.add(v);return set}
function huntHit(key){if(!key||!S.hunt||!S.hunt.length)return null;return S.hunt.find(e=>keyMatch(hkey(e),key))||null}
function isSetCtx(it,title){if(it){if(it.mixed||/セット/.test(String(it.setk||'')+String(it.name||'')))return true;const r=itemRangeOf(it);return !!(r&&r[1]>r[0])}
  const t=String(title||'');if(/セット|全巻/.test(t))return true;const r=volRangeOfName(t);return !!(r&&r[1]>r[0])}
function huntNorm(o){if(!o||typeof o!=='object')return null;const n=v=>{const x=num(v);return isFinite(x)&&x>0?x:null};
  const title=String(o.title||o.work||'').trim();if(!title)return null;
  return{cat:String(o.cat||o.category||'').trim()||BOOK,genre:String(o.genre||'').trim(),work:String(o.work||'').trim(),title,publisher:String(o.publisher||o.pub||'').trim(),vols:o.vols??'',median:n(o.median),perVolCap:n(o.perVolCap),setCap:n(o.setCap),memo:String(o.memo||''),provisional:o.provisional?1:0,checked:String(o.checked||'')}}
function huntImport(txt){const o=JSON.parse(txt);const arr=Array.isArray(o)?o:(o&&(o.hunt||o.items||o.list||o.data));if(!Array.isArray(arr))throw new Error('探し物リストの形式ではありません');
  let add=0,upd=0,bad=0;for(const r of arr){const e=huntNorm(r);if(!e){bad++;continue}const i=S.hunt.findIndex(x=>x.title===e.title);if(i>=0){S.hunt[i]=e;upd++}else{S.hunt.push(e);add++}}
  save();return{add,upd,bad,total:S.hunt.length}}

/* ---------- 判定 ---------- */
function analyze(ctx){
  const set=S.settings,r=num(set.target)/100;
  const it=ctx.itemId?getItem(ctx.itemId):(ctx.vitem||null);
  const title=ctx.title||(it&&it.name)||'';
  const key=it?itemKey(it):workKey(ctx.work||title);
  const nb=!!(it&&!isBook(it));   // 本以外：相場プール・巻数まわりは使わない
  let pool=nb?[]:poolItemsFor(key,true);if(it&&!pool.includes(it))pool.unshift(it);   // 欠巻・版違い用（作品単位）
  let ex,prov=false,grp='name';                                                              // 判定用（同じ商品名→同じ巻範囲）
  if(ctx.vitem){ex=[ctx.vitem]}
  else if(it&&it.mixed)ex=[];   // まとめ売りは自分の名前では相場を見ない（想定売価はメンバー合計）
  else if(it)ex=exactItemsFor(it);
  else{const n=nname(title);ex=n?S.items.filter(x=>nname(x.name)===n):[];if(!ex.length){ex=poolItemsFor(key);prov=ex.length>0}}
  const qsAll=poolQuotes(ex,key);let qs=qsAll;
  if(it&&!prov&&!ctx.vitem&&!it.mixed&&!nb){const tn=tnorm(it.name);qs=qsAll.filter(q=>!q.title||tnorm(q.title)===tn);qs.nameExcluded=qsAll.length-qs.length;
    const soldN=qs.filter(q=>q.status==='sold').length;
    if(soldN<3){const rng=itemRangeOf(it);if(rng){let rq=rangeQuotes(key,rng[0],rng[1]);
      if(rq.filter(q=>q.status==='sold').length<=soldN){const lk=workKey(String(it.name).split(/[=＝]/)[0].replace(/[A-Za-z0-9.]+/g,' '));if(lk&&lk!==key){const rq2=rangeQuotes(lk,rng[0],rng[1]);if(rq2.filter(q=>q.status==='sold').length>rq.filter(q=>q.status==='sold').length)rq=rq2}}
      if(rq.filter(q=>q.status==='sold').length>soldN){qs=rq;grp='range';ex=pool}}}}
  else if(prov){const tr=volRangeOfName(title);if(tr){const rq=rangeQuotes(key,tr[0],tr[1]);if(rq.some(q=>q.status==='sold')){qs=rq;grp='range'}}}
  const st=qstats(qs),acc=accFactor(it);
  const chs=[];let memMiss=false;
  for(const c of CH){const cs=set.ch[c];if(!cs.on)continue;let base=NaN,basis='';const man=NaN;   // v1.7.4：想定売価の手入力は使わない（相場からの自動推定のみ）
    if(man>0){base=man;basis='手入力の想定価格'}
    else if(it&&it.mixed){const mem=S.items.filter(m=>m.inSet===it.id);let sum=0,n=0,miss=0;
      if((ctx._d||0)<4)for(const m of mem){const am=analyze({itemId:m.id,_d:(ctx._d||0)+1});const mc=am.chs.find(x=>x.c===c);if(mc&&mc.sale>0){sum+=mc.sale;n++}else miss++}
      if(n){base=sum;basis=`メンバー合計（${n}冊${miss?`・${miss}冊は想定なし`:''}）`;memMiss=memMiss||miss>0}}
    else{const own=qs.filter(q=>q.status==='sold'&&q.ch===c).map(q=>q.price);const arr=own.length?own:st.sp;
      const src=own.length?cs.name:'全販路';
      if(arr.length>=3){const bd=modeBand(arr);base=set.mode==='cons'?bd.lo:Math.floor(bd.avg/10)*10;
        basis=`最頻価格帯の${set.mode==='cons'?'下限':'平均'}（帯 ${bd.lo.toLocaleString('ja-JP')}〜${bd.hi.toLocaleString('ja-JP')}円に${bd.n}件）・${src}の売り切れ${arr.length}件`}
      else if(arr.length){base=set.mode==='cons'?Math.min(...arr):median(arr);basis=(set.mode==='cons'?'底値':'中央値')+'・'+`${src}の売り切れ${arr.length}件`}}
    if(!(base>0))continue;
    const sale=Math.round(base*acc.f),fee=Math.round(sale*(num(cs.fee)||0)/100);
    const ship=fnum(it,'ship',num(cs.ship)||0),pack=fnum(it,'pack',num(set.pack)||0),other=fnum(it,'other',num(set.other)||0);
    const net=sale-fee-ship-pack-other;const max=Math.floor((net-sale*r)/10)*10;
    chs.push({c,name:cs.name,base,sale,fee,ship,pack,other,net,max,basis})}
  let best=null;if(chs.length){if(set.pick==='main')best=chs.find(x=>x.c===set.main)||null;if(!best)best=chs.reduce((a,b)=>b.max>a.max?b:a)}
  const hunt=null;   // v1.5.0：判定の照合先としての探し物リストは撤去（リストは調べるタブのチェックリストとして使う）
  const sd=st.latest?daysAgo(st.latest):null;
  const flags={
    disp:st.sp.length>=2&&st.lo>0&&st.hi/st.lo>num(set.disp),
    bimodal:bimodal(st.sp),
    stale:st.soldN>0&&(sd===null||sd>num(set.fresh)),staleDays:sd,
    few:st.soldN<3,
    vol:nb?null:volCheck(it,pool),
    ed:nb?[]:editionNote(title,pool,it),
    dup:dupInfo(ctx.code||(it&&it.code),ctx.scan?null:(it&&it.id)),
    acc:acc.miss,
    memSum:!!(it&&it.mixed),memMiss,
    excluded:qs.excluded,

  flags.hunt=hunt;

}
function evalPrice(a,price){
  const b=a.best,r=num(S.settings.target)/100,f=a.flags;
  if(!b)return{sig:'n',profit:NaN,rate:NaN,price:NaN};
  const p=num(price);let sig=null,profit=NaN,rate=NaN;
  if(b.hunt){if(isFinite(p)){if(isFinite(b.net)){profit=b.net-p;rate=profit/b.sale}
      sig=p>b.max?'w':((isFinite(rate)&&rate>=r+0.15&&!f.hunt.e.provisional)?'ss':'s');if(isFinite(profit)&&profit<=0)sig='x'}
    return{sig,profit,rate,price:p}}
  if(isFinite(p)){profit=b.net-p;rate=profit/b.sale;sig=profit<=0?'x':rate>=r?((rate>=r+0.15&&a.st.soldN>=3)?'ss':'s'):'w'}
  const down=f.disp||f.bimodal||f.missing.length>0;
  if(down&&sig!=='x')sig='w';
  if(sig==='ss'&&(f.stale||f.few))sig='s';
  return{sig,profit,rate,price:p};
}
function effScore(a,ev){
  if(!a.best||!(ev.profit>0))return null;const n=a.st.soldN;
  let prob=Math.min(0.9,0.25+0.13*n);const why=[`売り切れ${n}件 → 売れる確率の目安 ${Math.round(prob*100)}%`];
  if(a.flags.stale){prob*=0.6;why.push('鮮度低下のため ×0.6')}
  if(a.flags.disp){prob*=0.7;why.push('ばらつき大のため ×0.7')}
  const days=Math.max(7,Math.round(60/(1+n/3)));why.push(`想定在庫日数の目安 ${days}日（売り切れ件数が多いほど短く見積もり）`);
  const total=ev.price+a.best.other;const v=total>0?ev.profit*prob/(total*days)*100:ev.profit*prob/days;
  return{v,prob,days,total,why};
}

/* ---------- openBD ---------- */
async function fetchBiblio(isbn){
  if(S.biblio[isbn]&&S.biblio[isbn].title)return S.biblio[isbn];
  if(!isISBN(isbn))return{none:true};
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),7000);
  try{
    const r=await fetch('https://api.openbd.jp/v1/get?isbn='+isbn,{signal:ctl.signal});const j=await r.json();
    const s=j&&j[0]&&j[0].summary;if(!s)return{none:true};
    let title=(s.title||'').trim();if(s.volume&&!title.endsWith(s.volume))title+=' '+s.volume;
    let form='';try{const dd=j[0].onix.DescriptiveDetail;form=(dd.ProductFormDetail||'')+''}catch(e){}
    const b={title,series:s.series||'',author:s.author||'',pub:s.publisher||'',pubdate:s.pubdate||'',cover:s.cover||'',form,at:today()};
    S.biblio[isbn]=b;const ks=Object.keys(S.biblio);if(ks.length>3000)delete S.biblio[ks[0]];save();return b;
  }catch(e){return{err:true}}finally{clearTimeout(tm)}
}

function volRangeOfName(name){const t=String(name||'').normalize('NFKC');const m=t.match(/(\d+)\s*[-~〜～]\s*(\d+)\s*巻/);if(m)return[+m[1],+m[2]];const v=volOf(name);return v?[v,v]:null}

function regParams(){const p=num($('#rgP').value);if(!isFinite(p)){toast('先に仕入価格（単価）を入れてください');return null}return{p,d:$('#rgD').value||today(),st:($('#rgS').value||'').trim()}}
function regDup(code,title){const c=normCode(code),k=workKey(title),v=volOf(title);
  return S.items.filter(it=>(it.st==='stock'||it.st==='listed')&&isBook(it)&&((c&&normCode(it.code)===c)||(v&&keyMatch(k,itemKey(it))&&itemVols(it).has(v))))}
function regAdd(o){const P=regParams();if(!P)return false;const it=newItem({name:o.title||o.code,code:o.code||'',author:o.author||'',pub:o.pub||'',cover:o.cover||'',st:'stock',cost:P.p,date:P.d,store:P.st});
  S.items.unshift(it);save();REG.log.unshift(it.name);const l=$('#regLog');if(l)l.innerHTML=REG.log.map(n=>`✓ ${esc(n)}`).join('<br>');toast(`登録：${it.name}`);return true}
function regPendShow(){const e=$('#regPend');if(!e)return;const P=REG&&REG.pend;if(!P){e.innerHTML='';return}
  if(P.nobib)e.innerHTML=`<div class="banner mt2" style="flex-wrap:wrap">📕 書誌が見つかりませんでした（${esc(P.code)}）。商品名を入れて登録できます。<input id="rgPendName" class="inline-in" style="width:100%;text-align:left" placeholder="商品名"><button data-act="regPendManual">この名前で登録</button><button data-act="regPendSkip">スキップ</button></div>`;
  else e.innerHTML=`<div class="banner mt2" style="flex-wrap:wrap">⚠ 同じ巻がすでに在庫にあります：${esc(P.dups.map(d=>d.name).join('、'))}<br>読み取った本：${esc(P.title)}<button data-act="regPendOk">それでも登録</button><button data-act="regPendSkip">スキップ</button></div>`}
async function regCode(raw){if(!REG||REG.pend)return;if(!regParams())return;const code=normCode(raw);
  let b=S.biblio[code];if(!b||!b.title)b=await fetchBiblio(code);if(!REG)return;
  if(!b||!b.title){REG.pend={code,nobib:true};regPendShow();return}
  const o={code,title:b.title,author:b.author,pub:b.pub,cover:b.cover};const d=regDup(code,b.title);
  if(d.length){REG.pend=Object.assign(o,{dups:d});regPendShow();return}regAdd(o)}

// まとめ売りの商品名：メンバー名の最長共通接頭辞（末尾の空白・記号は除く）＋「まとめ売り」
function mixedName(ms){const ns=ms.map(m=>String(m.name||''));let pre=ns[0]||'';
  for(const n of ns.slice(1)){let i=0;while(i<pre.length&&i<n.length&&pre[i]===n[i])i++;pre=pre.slice(0,i)}
  pre=pre.replace(/[\s・:：\/／\-―—(（　]+$/,'').trim();
  return [...pre].length>=2?`${pre} まとめ売り`:`${ns[0]} 他まとめ売り`}
function listBundleMake(){
  const ids=Object.keys(UI.listSel).filter(k=>UI.listSel[k]);
  const ms=ids.map(id=>getItem(id)).filter(Boolean);
  if(ms.length<2){toast('2冊以上選んでください');return}
  if(ms.some(m=>m.st==='sold')){toast('売却済の商品は束ねられません');return}
  const key=itemKey(ms[0]);
  const mixed=ms.some(m=>itemKey(m)!==key);
  if(mixed){openSheet('まとめ売りとして束ねる',`<div class="note mb2">選んだ${ms.length}冊には違う作品が含まれています。<b>まとめ売り</b>として1つの商品に束ねます。単巻は一覧では隠れます。※想定売価は、メンバー単巻それぞれの想定売価の合計で表示されます。</div>
  <div class="fld"><label>商品名（あとから編集画面でも変えられます）</label><input id="bunName" value="${esc(mixedName(ms))}"></div>
  <div class="note mb2">仕入価格の合計 ${yenT(ms.reduce((s,m)=>s+(num(m.cost)||0),0))}（未入力は0円として計算）</div>
  <button class="btn pri" style="width:100%" data-act="listBundleDo" data-mixed="1" data-ids="${esc(ids.join(','))}">まとめ売りとして束ねる</button>`);return}
  let rg=null;for(const m of ms){const r=itemRangeOf(m);if(r)rg=rg?bundleRange(rg,r):r}
  openSheet('セットとして束ねる',`<div class="note mb2">選んだ${ms.length}冊を1つのセット商品にまとめます。単巻はセット商品の中に入り、一覧ではセット商品だけが表示されます。</div>
  <div class="fld"><label>巻の範囲（開始巻）</label><input id="bunLo" inputmode="numeric" value="${rg?rg[0]:''}"></div>
  <div class="fld"><label>巻の範囲（終了巻）</label><input id="bunHi" inputmode="numeric" value="${rg?rg[1]:''}"></div>
  <div class="note mb2">仕入価格の合計 ${yenT(ms.reduce((s,m)=>s+(num(m.cost)||0),0))}（未入力は0円として計算）</div>
  <button class="btn pri" style="width:100%" data-act="listBundleDo" data-ids="${esc(ids.join(','))}">この範囲で束ねる</button>`);
}
function listBundleDoAct(b){
  const ids=b.dataset.ids.split(',').filter(Boolean);
  const ms=ids.map(id=>getItem(id)).filter(Boolean);
  if(b.dataset.mixed==='1'){
    const name=(($('#bunName')||{}).value||'').trim()||mixedName(ms);
    const cost=ms.reduce((s,m)=>s+(num(m.cost)||0),0);const allStock=ms.every(m=>m.st==='stock'||m.st==='listed');
    const target=newItem({name,work:'',setk:'セット',range:'',have:'',st:allStock?'stock':'cand',cost:allStock?cost:'',genre:ms[0].genre||'',pub:ms[0].pub||'',autoBundle:1,mixed:1,memo:'一覧で束ね（まとめ売り）：'+ms.map(m=>m.name).join('、')});
    S.items.unshift(target);ms.forEach(m=>m.inSet=target.id);
    UI.listSel={};save();closeSheet();setTab('list');toast('まとめ売りとして束ねました');return}
  const lo=num($('#bunLo').value),hi=num($('#bunHi').value);
  if(!(lo>0)||!(hi>=lo)){toast('巻の範囲を入力してください');return}
  const key=itemKey(ms[0]);
  const have=new Set();for(const m of ms){const r=itemRangeOf(m);if(r)for(let v=r[0];v<=r[1];v++)have.add(v)}
  const cost=ms.reduce((s,m)=>s+(num(m.cost)||0),0);
  const allStock=ms.every(m=>m.st==='stock'||m.st==='listed');
  let target=findSetItem(key,lo,hi);
  if(target&&ms.includes(target))target=null;
  if(target){if(target.st==='sold'){toast('対応するセット商品は売却済のため束ねられません');return}
    ms.forEach(m=>m.inSet=target.id);
    const hv=new Set([...parseVols(target.have||''),...have]);target.have=[...hv].sort((a,b2)=>a-b2).join(',');
    if(target.st==='cand'&&allStock){target.st='stock';target.cost=cost;target.date=today()}
  }else{
    const base=((ms[0].work)||ms[0].name||'').replace(/第?\s*\d+\s*巻.*$/,'').trim();
    target=newItem({name:`${base} ${lo}〜${hi}巻 セット`,work:ms[0].work||'',setk:'セット',range:`${lo}-${hi}`,have:[...have].sort((a,b2)=>a-b2).join(','),st:allStock?'stock':'cand',cost:allStock?cost:'',genre:ms[0].genre||'',pub:ms[0].pub||'',autoBundle:1,memo:'一覧で束ね：'+ms.map(m=>m.name).join('、')});
    S.items.unshift(target);ms.forEach(m=>m.inSet=target.id);
  }
  UI.listSel={};save();closeSheet();setTab('list');toast('セットとして束ねました');
}

function thumb(it){return ''}
function soldParts(it){
  const sp=num(it.soldPrice??it.sp);if(!(sp>0))return null;let c=chKey(it.soldCh);if(c==='o')c=S.settings.main;const cs=S.settings.ch[c];
  const fee=isFinite(num(it.soldFee))?num(it.soldFee):Math.round(sp*num(cs.fee)/100);
  const ship=fnum(it,'soldShip',fnum(it,'ship',num(cs.ship)||0)),pack=fnum(it,'soldPack',fnum(it,'pack',num(S.settings.pack)||0)),other=fnum(it,'soldOther',fnum(it,'other',num(S.settings.other)||0));
  const cost=num(it.cost)||0;return{sp,fee,ship,pack,other,cost,total:cost+ship+fee+pack+other,profit:sp-fee-ship-pack-other-cost}}
function soldProfit(it){
  const sp=num(it.soldPrice??it.sp);if(!(sp>0))return NaN;let c=chKey(it.soldCh);if(c==='o')c=S.settings.main;const cs=S.settings.ch[c];
  const fee=isFinite(num(it.soldFee))?num(it.soldFee):Math.round(sp*num(cs.fee)/100);
  const ship=fnum(it,'soldShip',fnum(it,'ship',num(cs.ship)||0)),pack=fnum(it,'soldPack',fnum(it,'pack',num(S.settings.pack)||0)),other=fnum(it,'soldOther',fnum(it,'other',num(S.settings.other)||0));
  return sp-fee-ship-pack-other-(num(it.cost)||0);
}
function expectProfit(it){const a=analyze({itemId:it.id});if(!a.best)return{a,p:NaN};const c=num(it.cost);return{a,p:isFinite(c)?a.best.net-c:NaN}}
function recheckList(){
  const seen=new Set(),out=[];
  for(const it of S.items){if(it.st==='sold')continue;const k=itemKey(it);if(!k||seen.has(k))continue;seen.add(k);
    const a=analyze({itemId:it.id});if(a.flags.stale)out.push({it,a})}
  return out;
}

function inPer(d,per){const dt=pd(d);if(!dt)return per==='all';const n=new Date();

  if(per==='month')return dt.getFullYear()===n.getFullYear()&&dt.getMonth()===n.getMonth();
  if(per==='last'){const l=new Date(n.getFullYear(),n.getMonth()-1,1);return dt.getFullYear()===l.getFullYear()&&dt.getMonth()===l.getMonth()}
  if(per==='year')return dt.getFullYear()===n.getFullYear();return true}

const curYM=()=>today().slice(0,7);
function ymAdd(ym,d){let [y,m]=ym.split('-').map(Number);m+=d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+String(m).padStart(2,'0')}

  for(const it of sold){const x=soldParts(it);if(!x)continue;n++;sales+=x.sp;cost+=x.total;for(const k in c)c[k]+=x[k];
    const k=catOf(it);byCat[k]=byCat[k]||{n:0,s:0,p:0};byCat[k].n++;byCat[k].s+=x.sp;byCat[k].p+=x.profit}
  const ex=S.expenses.filter(e=>String(e.date||'').slice(0,7)===ym);const exT=ex.reduce((a,e)=>a+(num(e.amount)||0),0);const exBy={};
  for(const e of ex){const k=e.cat||'その他';exBy[k]=(exBy[k]||0)+(num(e.amount)||0)}
  return{ym,n,sales,cost,c,exT,exBy,ex,byCat,net:sales-cost-exT}}

  const sc=v=>top+(mx-v)/(mx-mn)*(H-top-bot);const z=sc(0);const cw=(W-l)/12;const bw=cw*0.34;

    g+=`<rect x="${x+bw+1}" y="${Math.min(yn,z)}" width="${bw}" height="${Math.max(Math.abs(z-yn),m.net?1:0)}" fill="${m.net<0?'var(--x)':'var(--ss)'}" rx="2"><title>${m.ym} 純利益 ${yenT(m.net)}</title></rect>`;

  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="直近12ヶ月の売上と純利益">${g}</svg>

function workFromTitle(t){let s=String(t||'').trim();const orig=s;
  s=s.replace(/【[^】]*】/g,' ').trim();
  s=s.replace(/\s+\d{1,3}\s*[-–—]\s*\d{1,3}\s*(巻|全巻セット|途中セット|完結セット|セット)?\s*$/,'');
  s=s.replace(/\s+\d{1,3}\s*[〜~\-ー]\s*\d{1,3}\s*巻\s*(全巻セット|途中セット|完結セット|セット|単巻)?\s*$/,'');
  s=s.replace(/\s+第?\d{1,3}\s*巻\s*(全巻セット|途中セット|セット)?\s*$/,'');
  s=s.replace(/\s+(全巻セット|途中セット|完結セット|セット)\s*$/,'');
  s=s.replace(/\s+/g,' ').trim();return s||orig}
const isSetKind=g=>g.kind==='set'||g.kind==='partial'||g.kind==='bara';
function volsCsv(s){return [...parseVols(s)].sort((a,b)=>a-b).join(',')}
function volsLabel(csv){const a=[...parseVols(csv)].sort((x,y)=>x-y);if(!a.length)return '';const out=[];let i=0;
  while(i<a.length){let j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;if(j-i+1>=4)out.push(`${a[i]}〜${a[j]}`);else for(let k=i;k<=j;k++)out.push(String(a[k]));i=j+1}
  return out.join(',')+'巻'}
const stripVols=w=>String(w||'').replace(/\s+[\d,，〜~\-]+巻\s*$/,'').trim();
function workWithVols(g){const b=stripVols(g.work);return (isSetKind(g)&&g.vols&&b)?`${b} ${volsLabel(g.vols)}`:(isSetKind(g)?b:String(g.work||'').trim())}
function syncWork(g){if(!g.work)return;g.work=workWithVols(g)}
function rangeLabel(g){const f=String(g.from||'').trim(),t=String(g.to||'').trim();
  if(g.kind==='single')return f?`${f}巻`:'';if(!f&&!t)return '';if(f&&t&&f!==t)return `${f}〜${t}巻`;return `${f||t}巻`}
function kindWord(g){return g.kind==='set'?'全巻セット':g.kind==='partial'?'途中セット':g.kind==='bara'?'バラセット':''}
function genTitle(g){
  let sum='';if(g.shohan==='all'&&g.obi==='all')sum='【初版・帯付き】';else if(g.shohan==='all'&&g.obi!=='unknown')sum='【初版】';else if(g.obi==='all'&&(g.shohan==='none'||!g.shohan))sum='【帯付き】';
  const sv=isSetKind(g)&&g.vols;
  const parts=[sv?workWithVols(g):g.work,sv?'':rangeLabel(g),kindWord(g),g.tokuten?'特典付き':'',g.author].map(x=>String(x||'').trim()).filter(Boolean);
  return sum+parts.join(' ')}
function line1(g){const s=g.shohan,o=g.obi,sv=volsText(g.shohanVols),ov=volsText(g.obiVols);
  if(s==='unknown'||o==='unknown')return '初版・帯の有無は未確認です。写真でご確認ください。';
  if(s==='all'&&o==='all')return '初版・帯付きです。';
  if(s==='all'&&o==='none')return '初版です。帯はありません。';
  if(s==='all'&&o==='part')return `初版です。帯は${ov}巻のみ付いています。`;
  if(s==='all')return '初版です。';
  if(s==='none'&&o==='all')return '帯付きです。初版ではありません。';
  if(s==='part'){let t=`初版は${sv}巻のみです。`;if(o==='all')t+='帯は全巻に付いています。';else if(o==='part')t+=`帯は${ov}巻のみ付いています。`;else if(o==='none')t+='帯はありません。';return t}
  if(s==='none'&&o==='part')return `初版ではありません。帯は${ov}巻のみ付いています。`;
  if(s==='none'&&o==='none')return '';
  if(o==='all')return '帯付きです。';
  if(o==='part')return `帯は${ov}巻のみ付いています。`;
  if(s==='none')return '初版ではありません。';
  if(o==='none')return '帯はありません。';
  return ''}
function line2(g){const p=(g.points||[]);if(!p.length)return '';if(p.includes('特になし（きれい）'))return '汚れ・破れ・折れ・曲がりなどはなく、通読に支障はありません。';return `${p.join('・')}がありますが、通読に支障はありません。`}

function genBody(g){
  const L=['ご覧いただきありがとうございます。',''];
  if(String(g.outline||'').trim())L.push(String(g.outline).trim(),'');
  const sv=isSetKind(g)&&g.vols;
  L.push(`* タイトル：${[sv?workWithVols(g):g.work,sv?'':rangeLabel(g),kindWord(g)].map(x=>String(x||'').trim()).filter(Boolean).join(' ')}`);
  if(String(g.author||'').trim())L.push(`* 著者：${g.author.trim()}`);
  if(String(g.publisher||'').trim())L.push(`* 出版社：${g.publisher.trim()}`);
  L.push('','【商品状態】');
  const st=[line1(g),line2(g),g.tokuten?`特典：${g.tokuten} が付属します。`:''].filter(Boolean);
  const mk='①②③④⑤';st.forEach((x,i)=>L.push(`${mk[i]} ${x}`));
  L.push('','※商品の状態は写真をご確認ください。','','その他、ご不明な点やご質問等がありましたら、お気軽にコメントください。','','よろしくお願いいたします。','');
  const tags=[];const w=stripVols(g.work).replace(/\s+/g,'');if(w)tags.push(w);tags.push('本','コミック');
  for(const t of tagList(g.tags))if(!tags.includes(t))tags.push(t);
  L.push(...tags.map(t=>'#'+t));
  return L.join('\n')}
function tagCands(g){const c=[];const a=String(g.author||'').replace(/\s+/g,'');if(a)c.push(a);if(String(g.publisher||'').trim())c.push(g.publisher.trim().replace(/\s+/g,''));

function memberVolsCsv(e){const mem=S.items.filter(m=>m.inSet===e.id);if(!mem.length)return '';const set=new Set();for(const m of mem)for(const v of itemVols(m))set.add(v);return [...set].sort((a,b)=>a-b).join(',')}
function genDefault(e){const g={work:'',author:String(e.author||''),publisher:String(e.pub||''),outline:'',tags:'',isbn:String(e.code||''),kind:'',from:'',to:'',vols:'',shohan:'',shohanVols:'',obi:'',obiVols:'',tokuten:'',points:[],tagCands:[]};
  const sk=String(e.setk||'').trim();const mv=memberVolsCsv(e);
  if(sk==='単巻')g.kind='single';else if(sk==='全巻セット')g.kind='set';else if(sk==='途中セット'||sk==='セット')g.kind='partial';else if(mv)g.kind='partial';else if(!sk&&volOf(e.name)!=null&&!/セット/.test(String(e.name||'')))g.kind='single';
  const rg=itemRangeOf(e);if(rg){g.from=String(rg[0]);g.to=String(rg[1])}if(g.kind==='single'){const v=volOf(e.name);if(v!=null){g.from=String(v);g.to=''}}

  const tg=Array.isArray(e.tags)?e.tags:String(e.tags||'').split(/[,、\s]+/);g.tagCands=tg.map(x=>String(x).trim()).filter(Boolean);

function postaParse(txt){let o=JSON.parse(txt);if(o&&o.data&&!Array.isArray(o.listings)&&Array.isArray(o.data.listings))o=o.data;

  const L=(Array.isArray(o.listings)?o.listings:[]).filter(l=>l&&typeof l==='object');const T=(Array.isArray(o.templates)?o.templates:[]).filter(t=>t&&typeof t==='object');

function postaImportApply(d){let merged=0,added=0,tpl=0;const nz=v=>v!==undefined&&v!==null&&String(v).trim()!=='';
  for(const l of d.L){let it=(l.sssId&&getItem(l.sssId))||S.items.find(x=>x.postaId&&x.postaId===l.id);const price=num(l.price);
    const gen=l.gen&&typeof l.gen==='object'?JSON.parse(JSON.stringify(l.gen)):null;
    if(it){if(nz(l.title))it.listTitle=String(l.title);if(nz(l.desc))it.listDesc=String(l.desc);if(price>0)it.listPrice=price;if(gen)it.gen=gen;it.postaId=String(l.id||'');it.updated=new Date().toISOString();merged++}
    else{const d0=l.createdAt?ymd(new Date(l.createdAt)):today();

function komaParams(e){const g=isBook(e)?ensureGen(e):(e.gen||{});const acc=e.acc||{};
  const tri=v=>v==='all'||v==='part'?v:'none';
  let shoban=tri(g.shohan),obi=tri(g.obi);if(!g.obi&&acc.obi==='yes')obi='all';
  const sk=g.kind?({set:'全巻セット',partial:'途中セット',single:'単品',bara:'バラ'})[g.kind]:String(e.setk||'');
  const bonus=!!(g.tokuten||g._tok||acc.booklet==='yes'||acc.poster==='yes');
  const bad=/傷や汚れあり|状態が悪い/.test(String(e.cond||''))||(g.points||[]).some(p=>p!=='特になし（きれい）');
  const work=stripVols(g.work||'')||String(e.work||'')||workFromTitle(e.name||'');
  return [['src','sss'],['sssId',e.id],['title',e.listTitle||e.name||''],['work',work],['setk',sk],['shoban',shoban],['obi',obi],['bonus',bonus?'1':''],['cond',bad?'bad':'']]
    .filter(([k,v])=>v!==undefined&&v!==null&&String(v)!=='').map(([k,v])=>k+'='+encodeURIComponent(String(v))).join('&')}
function komaItem(){const base=String(S.settings.komaUrl||'').trim();if(!base){toast('設定でKOMAのURLを入力してください');return}

/* ---------- バックアップ ---------- */
function backupJSON(){return JSON.stringify({app:'SSS',key:KEY,ver:APP_VER,exportedAt:new Date().toISOString(),data:S})}
function stamp(){const d=new Date();return ymd(d).replace(/-/g,'')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')}
function doBackup(){
  S.meta.lastBackup=new Date().toISOString();const txt=backupJSON();save();
  const blob=new Blob([txt],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`sss_backup_${stamp()}.json`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  toast('バックアップを書き出しました（「ファイル」アプリに保存されます）');render();
}
async function copyBackup(){try{S.meta.lastBackup=new Date().toISOString();await navigator.clipboard.writeText(backupJSON());save();toast('クリップボードにコピーしました。メモ等に貼り付けて保管してください');render()}catch(e){toast('コピーできませんでした')}}
function fileOrTextHTML(id,accept,ph){return `<div class="fld"><label>ファイルを選ぶ</label><input type="file" id="${id}F" accept="${accept}"></div><div class="fld"><label>または中身を貼り付け</label><textarea id="${id}T" placeholder="${esc(ph)}" class="ta-mono"></textarea></div>`}
async function readFT(id){const f=$('#'+id+'F');if(f&&f.files&&f.files[0])return await f.files[0].text();return ($('#'+id+'T')||{}).value||''}
function restoreOpen(){
  openSheet('バックアップから復元',`<div class="banner mb3">⚠️ 復元すると、いまのSSSのデータはすべて置き換わります（全置換）。先に今のデータを書き出しておくと安心です。</div>
  ${fileOrTextHTML('rs','.json,application/json,text/plain','SSSのバックアップJSON')}<button class="btn pri" data-act="restoreRun">復元する</button>`);
}
async function restoreRun(){
  let o;try{o=JSON.parse(await readFT('rs'))}catch(e){toast('JSONを読み込めません');return}
  const data=o&&o.app==='SSS'&&o.data?o.data:o;
  if(!data||!Array.isArray(data.items)){toast('SSSのバックアップではありません');return}
  if(data.set&&!data.settings&&!confirm('これはSedoScope形式のようです。「SedoScopeのデータを取り込む」を使うのがおすすめです。このまま復元しますか？'))return;
  if(!confirm(`現在のデータ（商品${S.items.length}件）をすべて置き換えて、バックアップ（商品${data.items.length}件）に戻します。よろしいですか？`))return;
  S=fixState(JSON.parse(JSON.stringify(data)));save();closeSheet();CUR=null;toast(`復元しました（商品${S.items.length}件）`);render();
}
function wipe(){
  const t=prompt(`すべてのデータ（商品${S.items.length}件）を消去します。元に戻せません。\n消去する場合は「削除」と入力してください。`);
  if(t!=='削除'){toast('初期化を中止しました');return}
  localStorage.removeItem(KEY);S=defState();save();CUR=null;toast('初期化しました');render();
}

/* ---------- SedoScope取り込み ---------- */
const SEDO_KNOWN=['id','name','code','genre','pub','author','setk','vols','cond','cost','ship','pack','other','store','date','st','pm','py','pr','pa','lo','hi','quotes','memo','tags'];
// SedoScope実データの項目 → SSSの項目（元の項目もそのまま残す）
const SEDO_MAP={lc:'listCh',lp:'listPrice',ldate:'listDate',ac:'soldCh',ap:'soldPrice',adate:'soldDate',afee:'soldFee',aship:'soldShip',apack:'soldPack',aother:'soldOther'};
const SEDO_KEEP={codeSrc:'コードの入力元',created:'作成日時',updated:'更新日時',src:'登録方法',inSet:'所属セット',members:'セットの構成巻',ed:'版',shipm:'発送方法',pmlo:'メルカリ想定（下）',pmhi:'メルカリ想定（上）',fromId:'コピー元'};
function applySedoSet(set){
  if(!set||typeof set!=='object')return [];const S2=S.settings,done=[];
  const n=v=>num(v);
  if(isFinite(n(set.trate))){S2.target=n(set.trate);done.push(`目標利益率 ${S2.target}%`)}
  for(const [k,c] of [['rm','m'],['ry','y'],['rr','r'],['ra','a']])if(isFinite(n(set[k]))){S2.ch[c].fee=n(set[k]);done.push(`${S2.ch[c].name}手数料 ${n(set[k])}%`)}
  if(isFinite(n(set.ship))){for(const c of CH)S2.ch[c].ship=n(set.ship);done.push(`送料 ${n(set.ship)}円（全販路）`)}
  if(isFinite(n(set.pack))){S2.pack=n(set.pack);done.push(`梱包費 ${S2.pack}円`)}
  if(isFinite(n(set.other))){S2.other=n(set.other);done.push(`その他費用 ${S2.other}円`)}
  if(isFinite(n(set.stale))){S2.fresh=n(set.stale);done.push(`鮮度 ${S2.fresh}日`)}
  if(set.mainCh&&CH.includes(set.mainCh)){S2.main=set.mainCh;done.push(`主販路 ${S2.ch[set.mainCh].name}`)}
  return done;
}
function sedoOpen(){
  openSheet('SedoScopeのデータを取り込む',`<div class="note mb2">SedoScopeで書き出したバックアップJSON（items／set／meta を含むもの）を読み込み、SSSの形式に変換して取り込みます。SedoScope本体のデータは変更しません。</div>
  ${fileOrTextHTML('sd','.json,application/json,text/plain','SedoScopeのバックアップJSON')}
  <div class="fld"><label>取り込み方法</label><select id="sdMode"><option value="merge">追加（マージ）：今のデータは消さない（おすすめ）</option><option value="replace">全置換：今のSSSのデータを消して入れ替える</option></select></div>
  <label class="row lbl14 mb3"><input type="checkbox" id="sdSet" checked> SedoScopeの設定（目標利益率・手数料・送料・梱包費）も引き継ぐ</label>
  <button class="btn pri" data-act="sedoRun">取り込む</button><div id="sdSum" class="mt3"></div>`);
}
function parseSedo(txt){
  let o=JSON.parse(txt);
  if(o&&o.sedoscope_v1)o=typeof o.sedoscope_v1==='string'?JSON.parse(o.sedoscope_v1):o.sedoscope_v1;
  if(o&&o.data&&!Array.isArray(o.items)){o=typeof o.data==='string'?JSON.parse(o.data):o.data}
  if(Array.isArray(o))o={items:o};
  if(!o||!Array.isArray(o.items))throw new Error('items が見つかりません');
  return o;
}
function importSedo(src,mode,opt){
  const fieldCount={},unknown={},stMap={};const conv=[];let qTotal=0,qBad=0;
  for(const o of src.items){if(!o||typeof o!=='object')continue;const it=JSON.parse(JSON.stringify(o));
    for(const k of Object.keys(o)){if(SEDO_KNOWN.includes(k)){if(o[k]!==''&&o[k]!=null)fieldCount[k]=(fieldCount[k]||0)+1}else unknown[k]=(unknown[k]||0)+1}
    if(it.id===undefined||it.id===null||it.id==='')it.id=uid();
    const ns=normSt(o.st);if(String(o.st)!==ns){it.st_orig=o.st;stMap[String(o.st)]=ns}it.st=ns;
    const qs=Array.isArray(o.quotes)?o.quotes:[];it.quotes=[];
    for(const q of qs){const n=normQuote(q);if(!n){qBad++;continue}qTotal++;if(!(n.price>0)||!n.status)qBad++;it.quotes.push(n)}
    for(const [a,b] of Object.entries(SEDO_MAP))if(o[a]!==undefined&&o[a]!==''&&(it[b]===undefined||it[b]===''))it[b]=o[a];
    it._from='sedoscope';it._imported=today();conv.push(it)}
  // セット：巻範囲と手元の巻を構成巻から作る
  const byId=new Map(conv.map(i=>[String(i.id),i]));let setN=0;
  for(const it of conv){if(!/セット/.test(String(it.setk||''))&&!Array.isArray(it.members))continue;
    if(!it.range&&it.vols){const r=String(it.vols).normalize('NFKC').replace(/[〜～~]/g,'-').replace(/巻/g,'').trim();if(/^\d+(-\d+)?$/.test(r))it.range=r}
    if(!it.have&&Array.isArray(it.members)){const v=it.members.map(id=>byId.get(String(id))||getItem(id)).filter(Boolean).map(m=>num(m.vols)).filter(x=>x>0);if(v.length)it.have=v.join(',')}
    if(it.range)setN++}
  let added=0,skipped=0;
  if(mode==='replace'){S.items=conv;added=conv.length}
  else{const ids=new Set(S.items.map(i=>String(i.id)));for(const it of conv){if(ids.has(String(it.id))){skipped++;continue}S.items.push(it);ids.add(String(it.id));added++}}
  if(src.set!==undefined)S.meta.legacySet=src.set;if(src.meta!==undefined)S.meta.legacyMeta=src.meta;
  const setApplied=opt&&opt.applySet?applySedoSet(src.set):[];
  const sum={setApplied,setN,at:new Date().toISOString(),kind:'sedoscope',mode,src:src.items.length,conv:conv.length,added,skipped,qTotal,qBad,fieldCount,unknown,stMap};
  S.meta.imports=(S.meta.imports||[]).concat([{at:sum.at,kind:'sedoscope',mode,src:sum.src,added,skipped}]).slice(-30);
  save();return sum;
}
function sedoSumHTML(s){
  const fc=SEDO_KNOWN.map(k=>`<tr><td>${k}</td><td class="num">${s.fieldCount[k]||0}</td></tr>`).join('');
  const uk=Object.keys(s.unknown).filter(k=>!SEDO_MAP[k]&&!SEDO_KEEP[k]);
  const mp=Object.keys(s.unknown).filter(k=>SEDO_MAP[k]),kp=Object.keys(s.unknown).filter(k=>SEDO_KEEP[k]);
  return `<div class="card sum"><b class="ff">取り込み結果</b><br>
  元データの商品 <b>${s.src}</b> 件 → 変換 <b>${s.conv}</b> 件／追加 <b>${s.added}</b> 件${s.mode==='merge'?`／同じIDが既にあるためスキップ <b>${s.skipped}</b> 件`:'（全置換）'}<br>
  相場（quotes） <b>${s.qTotal}</b> 件を移行${s.qBad?`（うち価格または販売状況を読み取れないもの <b>${s.qBad}</b> 件：保持はしますが判定には使いません）`:''}<br>
  ${Object.keys(s.stMap).length?`ステータス変換：${Object.entries(s.stMap).map(([a,b])=>`${esc(a)}→${ST[b]}`).join('、')}（元の値は st_orig に保持）<br>`:''}
  移行できなかったフィールド：<b>なし</b>（全項目をそのまま保持）<br>
  ${mp.length?`出品・売却の項目をSSSの項目へ対応付け：${mp.map(k=>`${esc(k)}→${SEDO_MAP[k]}`).join('、')}<br>`:''}
  ${kp.length?`記録として保持（判定には使わない）：${kp.map(k=>esc(SEDO_KEEP[k])).join('、')}<br>`:''}
  ${uk.length?`SSSが知らない項目（保持のみ）：${uk.map(k=>`${esc(k)}(${s.unknown[k]})`).join(', ')}<br>`:''}
  ${s.setN?`セット ${s.setN}件：巻数と構成巻から「巻範囲」「手元の巻」を設定（欠巻チェック用）<br>`:''}
  設定：${s.setApplied.length?`SedoScopeから引き継ぎ（${esc(s.setApplied.join('、'))}）`:'引き継いでいません'}。元の設定内容は変更せず保存
  <div class="sec">主要フィールドの件数（値が入っている商品数）</div><table>${fc}</table></div>`;
}

/* ---------- 相場CSV ---------- */
function parseCSV(text){
  text=String(text).replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function importCSV(text,targetId,newName,src){
  const rows=parseCSV(text);if(!rows.length)throw new Error('CSVが空です');
  const h=rows[0].map(x=>String(x).trim());let ix={n:h.indexOf('商品名'),p:h.indexOf('価格'),s:h.indexOf('販売状況'),c:h.indexOf('商品の状態')};let body=rows.slice(1);
  if(ix.p<0){ix={n:0,p:1,s:2,c:3};body=rows}
  let it=targetId?getItem(targetId):null;let created=false;
  if(!it){const nm=(newName||'').trim()||String((body[0]||[])[ix.n]||'取り込み').slice(0,60);it=newItem({name:nm,st:'cand'});S.items.unshift(it);created=true}
  it.quotes=it.quotes||[];const seen=new Set(it.quotes.map(qKey));let add=0,dup=0,bad=0;const d=today();
  for(const r of body){const q=normQuote({title:ix.n>=0?r[ix.n]:'',price:r[ix.p],status:ix.s>=0?r[ix.s]:'',cond:ix.c>=0?r[ix.c]:'',src,date:d});q.imp='csv';
    if(!(q.price>0)||!q.status){bad++;continue}const k=qKey(q);if(seen.has(k)){dup++;continue}seen.add(k);it.quotes.push(q);add++}
  S.meta.imports=(S.meta.imports||[]).concat([{at:new Date().toISOString(),kind:'csv',item:it.id,src,add,dup,bad}]).slice(-30);
  save();return{total:body.length,add,dup,bad,it,created};
}

   バーコード読み取り（BarcodeDetector があれば使い、なければ内蔵のEAN-13解読）
   ============================================================ */
const LP=[[3,2,1,1],[2,2,2,1],[2,1,2,2],[1,4,1,1],[1,1,3,2],[1,2,3,1],[1,1,1,4],[1,3,1,2],[1,2,1,3],[3,1,1,2]];
const GP=LP.map(p=>p.slice().reverse());
const PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function matchDigit(R,o,left){
  const w=[R[o],R[o+1],R[o+2],R[o+3]],sum=w[0]+w[1]+w[2]+w[3];const v=w.map(x=>x*7/sum);let best=null,be=99;
  const test=(p,d,g)=>{let e=0;for(let k=0;k<4;k++)e+=Math.abs(v[k]-p[k]);if(e<be){be=e;best={d,g}}};
  LP.forEach((p,d)=>test(p,d,false));if(left)GP.forEach((p,d)=>test(p,d,true));
  return be<1.5?best:null;
}
function tryEAN(R,s){
  let W=0;for(let i=0;i<59;i++)W+=R[s+i];const m=W/95;
  for(const i of [0,1,2,27,28,29,30,31,56,57,58]){const g=R[s+i]/m;if(g<0.35||g>2.2)return null}
  if(s>0&&R[s-1]<m*2.5)return null;
  const dg=[];let par='';
  for(let d=0;d<6;d++){const r=matchDigit(R,s+3+d*4,true);if(!r)return null;dg.push(r.d);par+=r.g?'G':'L'}
  for(let d=0;d<6;d++){const r=matchDigit(R,s+32+d*4,false);if(!r)return null;dg.push(r.d)}
  const f=PAR.indexOf(par);if(f<0)return null;const code=f+dg.join('');return ean13ok(code)?code:null;
}
function decodeRow(L){
  const n=L.length,W=Math.max(10,n>>4);const pre=new Float64Array(n+1);for(let i=0;i<n;i++)pre[i+1]=pre[i]+L[i];
  let mn=255,mx=0;for(let i=0;i<n;i++){if(L[i]<mn)mn=L[i];if(L[i]>mx)mx=L[i]}if(mx-mn<40)return null;
  const gmid=(mn+mx)/2;
  const thr=[i=>gmid,
    i=>{const a=Math.max(0,i-W),b=Math.min(n,i+W);let lo=255,hi=0;for(let j=a;j<b;j+=2){if(L[j]<lo)lo=L[j];if(L[j]>hi)hi=L[j]}return hi-lo<(mx-mn)*0.3?gmid:(lo+hi)/2},
    i=>{const a=Math.max(0,i-W),b=Math.min(n,i+W);return Math.min((pre[b]-pre[a])/(b-a),gmid+(mx-mn)*0.25)}];
  for(const T of thr){
    const bits=new Uint8Array(n);for(let i=0;i<n;i++)bits[i]=L[i]<T(i)?1:0;
    const R=[],C=[];let c=bits[0],len=0;for(let i=0;i<n;i++){if(bits[i]===c)len++;else{R.push(len);C.push(c);c=bits[i];len=1}}R.push(len);C.push(c);
    for(let s=0;s+59<=R.length;s++){if(C[s]!==1)continue;const r=tryEAN(R,s);if(r)return r}
  }
  return null;
}
const cv=document.createElement('canvas');let cx=null;
function decodeImageData(img,W,H){
  for(let k=1;k<16;k++){const y=Math.round(H*k/16);const L=new Float32Array(W);
    for(let x=0;x<W;x++){let s=0;for(const dy of [-1,0,1]){const yy=Math.min(H-1,Math.max(0,y+dy));const i=(yy*W+x)*4;s+=img[i]*.299+img[i+1]*.587+img[i+2]*.114}L[x]=s/3}
    let r=decodeRow(L);if(!r)r=decodeRow(L.slice().reverse());if(r&&okScanCode(r))return r}
  return null;
}
function decodeFrame(v){
  const vw=v.videoWidth,vh=v.videoHeight;if(!vw)return null;const W=Math.min(1000,vw),sc=W/vw,H=Math.round(vh*0.5*sc);
  cv.width=W;cv.height=H;cx=cx||cv.getContext('2d',{willReadFrequently:true});cx.drawImage(v,0,vh*0.25,vw,vh*0.5,0,0,W,H);
  return decodeImageData(cx.getImageData(0,0,W,H).data,W,H);
}
const Scan={on:false,stream:null,det:null,last:'',lastT:0,cand:'',candN:0,timer:null,ac:null,wrapSel:'#camWrap',handler:null};
function beep(){try{Scan.ac=Scan.ac||new (window.AudioContext||window.webkitAudioContext)();const o=Scan.ac.createOscillator(),g=Scan.ac.createGain();o.frequency.value=1800;g.gain.value=.08;o.connect(g);g.connect(Scan.ac.destination);o.start();o.stop(Scan.ac.currentTime+.08)}catch(e){}}
async function startScan(wrapSel,handler){
  if(Scan.on)return;Scan.wrapSel=wrapSel||'#camWrap';Scan.handler=handler||null;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('この環境ではカメラを使えません。ISBNを入力してください');return}
  try{Scan.ac=Scan.ac||new (window.AudioContext||window.webkitAudioContext)();Scan.ac.resume&&Scan.ac.resume()}catch(e){}
  const w=$(Scan.wrapSel);if(!w)return;w.innerHTML=`<div id="cam"><video playsinline muted autoplay></video><div class="guide"></div><div class="hint">バーコードを赤線に合わせて横向きに（連続読み取り中）</div></div>`;
  const video=w.querySelector('video');
  try{Scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){w.innerHTML='';toast('カメラを起動できません（'+e.name+'）。設定でカメラを許可するか、ISBNを入力してください');return}
  video.srcObject=Scan.stream;try{await video.play()}catch(e){}
  Scan.det=null;
  if('BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes('ean_13'))Scan.det=new BarcodeDetector({formats:['ean_13']})}catch(e){}}
  Scan.on=true;if(Scan.wrapSel==='#camWrap')renderPad();loop(video);
}
function stopScan(){Scan.on=false;clearTimeout(Scan.timer);if(Scan.stream){Scan.stream.getTracks().forEach(t=>t.stop());Scan.stream=null}const w=$(Scan.wrapSel||'#camWrap');if(w)w.innerHTML='';const rb=$('#regScanBtn');if(rb)rb.textContent='📷 読み取り開始';if(UI.tab==='look'&&$('#pad').innerHTML)renderPad()}
async function loop(video){
  if(!Scan.on)return;let code=null;
  try{if(Scan.det){const r=await Scan.det.detect(video);for(const b of r){if(okScanCode(b.rawValue)){code=b.rawValue;break}}}else code=decodeFrame(video)}catch(e){}
  if(code)onCode(code);Scan.timer=setTimeout(()=>loop(video),Scan.det?150:80);
}
function onCode(code){
  if(!Scan.det){if(code===Scan.cand)Scan.candN++;else{Scan.cand=code;Scan.candN=1}if(Scan.candN<2)return}
  const t=Date.now();if(code===Scan.last&&t-Scan.lastT<3000)return;Scan.last=code;Scan.lastT=t;
  beep();const c=$('#cam');if(c){c.classList.add('hit');setTimeout(()=>c.classList.remove('hit'),350)}
  if(Scan.handler)Scan.handler(code);else lookupCode(code,{auto:true});
}

  const it=newItem({name:CUR.title||CUR.code,code:CUR.code,author:CUR.author||'',pub:CUR.pub||'',cover:CUR.cover||'',st,cost:p,store:st==='stock'?(S.settings.store||''):'',

  async csvRun(){const txt=await readFT('cv');if(!txt.trim()){toast('CSVを選ぶか貼り付けてください');return}
    let r;try{r=importCSV(txt,$('#cvTgt').value,$('#cvN').value,$('#cvS').value)}catch(e){toast(e.message);return}
    $('#cvSum').innerHTML=`<div class="card sum">取り込み先：<b class="ff">${esc(r.it.name)}</b>${r.created?'（新規作成）':''}<br>読み込んだ行 <b>${r.total}</b>／追加 <b>${r.add}</b>／重複除外 <b>${r.dup}</b>／読めない行 <b>${r.bad}</b></div>`;
    if(CUR&&!CUR.itemId&&r.created&&workKey(r.it.name)===workKey(CUR.title))CUR.itemId=null;
    toast(`${r.add}件を取り込みました`)}
};
// v1.7.2：検索入力中は入力欄を作り直さず、結果部分だけ差し替える（日本語変換が壊れないように）
function partial(html,ids){const t=document.createElement('div');t.innerHTML=html;for(const id of ids){const cur=document.getElementById(id),nw=t.querySelector('#'+id);if(cur&&nw)cur.innerHTML=nw.innerHTML}}
function drawEditorKeep(){const y=$('#shB').scrollTop;drawEditor();$('#shB').scrollTop=y}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){setTab(t.dataset.tab);return}
  if(e.target.dataset&&e.target.dataset.lsel2!==undefined)return;
  const b=e.target.closest('[data-act]');if(!b)return;if(b.tagName==='INPUT')return;const f=ACT[b.dataset.act];if(f)f(b,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='q'){e.preventDefault();doSearch()}
  if(e.key==='Enter'&&e.target.id==='manTitle'){e.preventDefault();ACT.setManTitle()}
});
document.addEventListener('input',e=>{
  if(EDIT&&e.target.dataset.g&&e.target.type!=='radio'){const el=e.target,g=EDIT.gen,k=el.dataset.g;g[k]=el.value;if(k==='work')g._workAuto=0;
    if(isSetKind(g)&&(k==='vols'||k==='from'||k==='to')){if(k==='vols')g._volsManual=el.value.trim()?1:0;
      else if(!g._volsManual){const f=num(g.from),t=num(g.to)||f;g.vols=f?volsCsv(`${f}-${Math.max(f,t)}`):'';const vi=document.querySelector('[data-g="vols"]');if(vi)vi.value=g.vols}
      syncWork(g);const wi=document.querySelector('[data-g="work"]');if(wi&&document.activeElement!==wi)wi.value=g.work}
    updGen();return}
  if(EDIT&&e.target.dataset.f==='listTitle'){updLtCount();return}
  if(EDIT&&['cost','ship','pack','other','listPrice'].includes(e.target.dataset.f)){if(e.target.dataset.f==='listPrice')document.querySelectorAll('#shB [data-f="listPrice"]').forEach(x=>{if(x!==e.target)x.value=e.target.value});readEditor();const lb=$('#limBox');if(lb)lb.innerHTML=limitHTML(EDIT);return}
  if(e.target.dataset.calc){const rows=calcRows();rows[+e.target.dataset.i][e.target.dataset.calc]=e.target.value;renderCalc();const el=document.querySelector('[data-calc="'+e.target.dataset.calc+'"][data-i="'+e.target.dataset.i+'"]');if(el){el.focus();const p=el.value.length;try{el.setSelectionRange(p,p)}catch(_){}}return}
  if(e.target.id==='hq'){UI.hq=e.target.value;if(UI.tab==='look')partial(huntPage(),['huntRes','hCnt']);return}
  if(e.target.id==='lq'){UI.listQ=e.target.value;UI.listN=150;if(UI.tab==='list')partial(listHTML(),['listRes']);return}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(EDIT&&el.dataset&&el.dataset.f!==undefined&&el.value==='__custom'){const k=el.dataset.f;const prev=EDIT[k];readEditor();EDIT[k]=prev;EDIT['_cust_'+k]=1;drawEditorKeep();return}
  if(el.dataset.set){const path=el.dataset.set.split('.');let o=S.settings;for(let i=0;i<path.length-1;i++)o=o[path[i]];
    const k=path[path.length-1];let v=el.type==='checkbox'?el.checked:el.value;
    if(el.type!=='checkbox'&&el.inputMode&&/numeric|decimal/.test(el.inputMode)&&k!=='budget'){const n=num(v);v=isFinite(n)?n:o[k]}
    o[k]=v;save();if(UI.tab!=='look')render();else renderResult();return}
  if(el.id==='postaF'&&el.files&&el.files[0]){const f=el.files[0];el.value='';f.text().then(t=>{try{postaImportAsk(t)}catch(err){toast(err.message||'読み込めませんでした')}});return}
  if(EDIT&&el.dataset.g&&el.type==='radio'){readEditor();const g=EDIT.gen;const k=el.dataset.g;if(k==='tokutenOn'){if(el.value==='0'){g.tokuten='';g._tok=0}else g._tok=1}else{g[k]=el.value;if(k==='kind'){if(isSetKind(g)&&!g.vols){const mv=memberVolsCsv(EDIT);if(mv)g.vols=mv;else if(num(g.from)){const f=num(g.from),t=num(g.to)||f;g.vols=volsCsv(`${f}-${Math.max(f,t)}`)}}syncWork(g)}}drawEditorKeep();return}
  if(EDIT&&el.dataset.gp!==undefined){readEditor();const g=EDIT.gen;const p=el.dataset.gp;let a=(g.points||[]).filter(x=>x!==p);if(el.checked){if(p==='特になし（きれい）')a=[p];else a=a.filter(x=>x!=='特になし（きれい）').concat(p)}g.points=POINTS.filter(x=>a.includes(x));drawEditorKeep();return}
  if(EDIT&&el.dataset.f==='cat'&&el.value!=='__custom'){readEditor();drawEditorKeep();return}
  if(el.id==='huntF'&&el.files&&el.files[0]){const f=el.files[0];el.value='';f.text().then(t=>{try{const r=huntImport(t);toast(`探し物リスト：追加${r.add}件・更新${r.upd}件（全${r.total}件）${r.bad?`・読めない行${r.bad}件`:''}`);render()}catch(err){toast(err.message||'読み込めません')}});return}
  if(el.dataset.lsel2!==undefined){UI.listSel[el.dataset.lsel2]=el.checked;render();return}
  if(el.dataset.lsel!==undefined){const v=el.value;const mp={cat:'listCat',genre:'listG',pub:'listP',cond:'listC',store:'listStore',setk:'listK',month:'listM'};const uk=mp[el.dataset.lsel];if(uk){UI[uk]=v;UI.listN=150;render()}return}
  if(el.dataset.qsel!==undefined){UI.cartSel[el.dataset.qsel]=el.checked;render();return}
  if(el.dataset.qprice){const q=S.queue.find(x=>x.id===el.dataset.qprice);if(q){const n=num(el.value);q.price=isFinite(n)?n:'';save();render()}return}
  if(el.dataset.link!==undefined){const l=S.links[+el.dataset.link];if(l){l[el.dataset.k]=el.value;save()}return}
});
window.addEventListener('pagehide',()=>stopScan());
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopScan()});
/* ---------- POSTAからの売却登録（URL連携・確認してから反映） ---------- */
let POSTA_PENDING=null;
function postaSoldFromURL(){
  let q;try{q=new URLSearchParams(location.search)}catch(e){return}
  if(q.get('src')!=='posta'||q.get('act')!=='sold')return;
  const clear=()=>{try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}};
  const later=m=>setTimeout(()=>toast(m),300);
  const it=getItem(q.get('sssId')||'');
  if(!it){clear();later('対象の商品が見つかりませんでした');return}
  if(it.st==='sold'){clear();later('この商品は売却済みです');return}
  const sp=num(q.get('soldPrice'));
  if(!isFinite(sp)){clear();later('売却価格を読み取れなかったため、売却登録を行いませんでした');return}
  let sd=String(q.get('soldDate')||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(sd))sd=today();
  let ch=String(q.get('soldCh')||'');if(!CH.includes(ch))ch='';
  const fr=q.get('soldFee');const fee=(fr!==null&&fr!==''&&isFinite(num(fr)))?num(fr):null;
  POSTA_PENDING={id:it.id,sp,sd,ch,fee};clear();
  openSheet('POSTAからの売却登録',`<div class="note mb2">POSTAの売上記録から渡された内容です。確認して「売却済みとして登録する」を押すと、この商品に反映されます。</div>
  <div class="card"><table><tr><td>商品名</td><td class="wrap">${esc(it.name||'(無題)')}</td></tr><tr><td>現在のステータス</td><td>${esc(ST[it.st]||it.st||'')}</td></tr>
  <tr><td>売却価格</td><td class="num">${yenT(sp)}</td></tr><tr><td>売却日</td><td class="num">${esc(sd)}</td></tr>
  <tr><td>販路</td><td>${ch?esc(S.settings.ch[ch].name):'（不明）'}</td></tr>${fee!==null?`<tr><td>手数料</td><td class="num">${yenT(fee)}</td></tr>`:''}</table></div>
  <div class="btns mt3"><button class="btn pri" data-act="postaSoldOk">売却済みとして登録する</button><button class="btn" data-act="postaSoldCancel">やめる</button></div>`);
}
postaSoldFromURL();
setTab('look');
