<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfbfa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SSS">
<title>SSS</title>
<style>
/* v2.0.0：新・出品作業アプリと同じデザイン言語（モック sss_mock_v1）。ヘッダーに「SSS（台帳）」と緑の帯で、出品アプリと取り違えない目印を付ける */
:root{
  --bg:#f4f4f1;--card:#fff;--card2:#f0f0ec;--line:#e7e7e2;--line2:#dededa;--tx:#141414;--mut:#77776f;--mut2:#9a9a94;--acc:#2451e6;--accbg:#eef1fe;
  --ss:#0b7a55;--ssbg:#e2f5ec;--s:#2451e6;--w:#a86a08;--wbg:#fdf0dc;--x:#b42323;--xbg:#fde8e8;--ledger:#0b7a55;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --tabh:64px;--safe:env(safe-area-inset-bottom,0px);
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;
  --r-lg:18px;--r-md:12px;--r-sm:9px;
  --fs-sec:12px;--fs-body:15px;--fs-sub:11.5px;--fs-sheet:17px;
  --h-btn:44px;--h-input:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
/* 画面の枠を固定し、スクロールは本文(main)の中だけで行う（iOS Safari のツールバー伸縮対策。v1.1.3 から継続） */
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{touch-action:manipulation;cursor:pointer}
a{color:var(--acc)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
small.u{font-size:.65em;color:var(--mut);margin-left:2px}
.mut{color:var(--mut)}
header{position:relative;flex:none;z-index:20;background:#fbfbfa;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;border-bottom:1px solid var(--line);border-top:4px solid var(--ledger)}
header h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.02em}
header .ver{font-size:11px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px}
header .store{margin-left:auto;font-size:11.5px;color:var(--mut);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#banner{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + var(--safe) + var(--sp2));z-index:40}
#banner:empty{display:none}
.banner{margin:0;padding:10px 12px;border-radius:12px;background:var(--wbg);border:1px solid #f0d7a8;color:#6b4306;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(20,20,20,.12)}
.banner.red{background:var(--xbg);border-color:#f3c2c2;color:#7a1414}
.banner button{margin-left:auto;background:#141414;border:0;border-radius:9px;padding:7px 11px;color:#fff;white-space:nowrap;font-weight:700;font-size:12.5px}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:var(--sp3) 16px 70px}
nav#tabs{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding:7px 10px calc(8px + var(--safe))}
nav#tabs button{flex:1;background:none;border:0;color:var(--mut2);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
nav#tabs button svg{width:23px;height:23px}
nav#tabs button.on{color:var(--tx)}
.h-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
h2.pg{font-size:24px;font-weight:800;margin:2px 0 0;letter-spacing:.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 14px;margin-bottom:var(--sp2)}
.row{display:flex;gap:8px;align-items:center}
.srch{display:flex;gap:var(--sp2);margin:var(--sp2) 0}
.srch input{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);height:var(--h-input);padding:0 var(--sp3)}
.btn{background:#fff;border:1px solid var(--line2);border-radius:var(--r-md);height:var(--h-btn);padding:0 14px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--tx)}
.btn.pri{background:#141414;border-color:#141414;color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dng{background:var(--xbg);border-color:#f3c2c2;color:var(--x)}
.btn.sm{height:34px;padding:0 11px;font-size:12.5px;border-radius:var(--r-sm)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:var(--sp2);flex-wrap:wrap}
.scanbtn{width:100%;height:50px;font-size:14.5px;margin-top:var(--sp3)}
.scanbtn svg{width:19px;height:19px}
#cam{position:relative;border-radius:var(--r-lg);overflow:hidden;background:#1b1b1e;margin-bottom:var(--sp2);height:170px}
#cam video{width:100%;height:100%;object-fit:cover;display:block}
#cam .guide{position:absolute;left:8%;right:8%;top:50%;height:2px;background:rgba(255,80,80,.85);box-shadow:0 0 8px rgba(255,80,80,.9)}
#cam .hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:#ddd;text-shadow:0 1px 2px #000}
#cam.hit{outline:4px solid var(--ss);outline-offset:-4px}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp1);margin-top:var(--sp2)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3.5px 8px;border-radius:999px;background:var(--card2);color:#55554f;white-space:nowrap}
.chip.blue{background:#e8eeff;color:var(--acc)}.chip.green{background:var(--ssbg);color:var(--ss)}.chip.amber{background:var(--wbg);color:var(--w)}.chip.red{background:var(--xbg);color:var(--x)}
.chip.warn{background:var(--wbg);color:var(--w)}.chip.bad{background:var(--xbg);color:var(--x)}.chip.info{color:var(--mut)}
.chip.hunt{background:#e8eeff;color:var(--acc)}
.st{display:inline-flex;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;margin-right:4px}
.st.cand{background:var(--card2);color:#55554f}.st.stock{background:var(--wbg);color:var(--w)}.st.listed{background:#e8eeff;color:var(--acc)}.st.deal{background:var(--xbg);color:var(--x)}.st.sold{background:var(--ssbg);color:var(--ss)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px var(--sp1);border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600}
.sec{font-size:var(--fs-sec);font-weight:800;letter-spacing:.05em;color:#55554f;margin:18px 2px 6px}
.list .it{display:flex;gap:var(--sp3);align-items:center;padding:12px 14px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);margin-bottom:var(--sp2);cursor:pointer}
.list .it .m{flex:1;min-width:0}
.list .it .t{font-weight:700;font-size:13.5px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.list .it .s{font-size:var(--fs-sub);color:var(--mut);overflow-wrap:anywhere}
.list .it .r{text-align:right;flex:none}
.list .it .chev{font-size:19px;color:#c6c6c0;font-weight:700;flex:none}
.icard .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.icard .top .st{margin:1px 0 0}
.nums{display:flex;flex-wrap:wrap;gap:4px 13px;margin-top:6px;font-size:11px;color:var(--mut)}
.nums b{color:var(--tx);font-size:12.5px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.nums .pos b{color:var(--ss)}.nums .neg b{color:var(--x)}.nums .old b{color:var(--w)}
.it.pick{border-color:var(--acc)!important;box-shadow:inset 0 0 0 1px var(--acc)}
.fchips{display:flex;gap:7px;overflow-x:auto;margin:var(--sp3) 0 var(--sp2);padding:2px 0}
.fchips button{flex:none;font-size:12px;font-weight:600;padding:0 12px;height:32px;border-radius:999px;background:#fff;border:1px solid #e3e3de;color:#55554f;white-space:nowrap}
.fchips button.on{background:#141414;color:#fff;border-color:#141414}
.sumrow{display:flex;gap:8px;margin-top:12px}
.sumbox{flex:1;min-width:0;background:#fff;color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:11px 12px;text-align:left}
.sumbox.dark{background:#141414;color:#fff;border-color:#141414}
.sumbox .n{font-size:20px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums}
.sumbox .n small{font-size:11px;font-family:inherit;margin-left:1px}
.sumbox .l{font-size:10.5px;opacity:.75;font-weight:600;margin-top:1px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp2)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:var(--sp3)}
.kpi label{font-size:var(--fs-sub);color:var(--mut);display:block;font-weight:600}
.kpi b{font-size:20px}
.fld{margin-bottom:var(--sp3)}
.fld label{display:block;font-size:11px;color:var(--mut2);font-weight:700;letter-spacing:.04em;margin-bottom:var(--sp1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld input,.fld select,.fld textarea{width:100%;min-width:0;max-width:100%;background:#fff;border:1px solid var(--line2);border-radius:var(--r-md);height:var(--h-input);padding:0 var(--sp2);font-size:16px}
.fld textarea{height:auto;min-height:70px;padding:var(--sp2)}
.fld input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;line-height:var(--h-input);text-align:left}
.fld input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0}
.fld select{-webkit-appearance:none;appearance:none;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 var(--sp2);align-items:start}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:0 var(--sp2);align-items:start}
.grid2>*,.grid3>*{min-width:0;max-width:100%}
.tri{display:flex;flex-wrap:wrap;gap:var(--sp2)}
.tri button{border:1px solid var(--line2);background:#fff;border-radius:var(--r-md);height:34px;padding:0 var(--sp3);font-size:13px}
.tri button.yes{border-color:var(--ss);color:var(--ss)}
.tri button.no{border-color:var(--x);color:var(--x)}
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#sheet .sh{display:flex;align-items:center;gap:var(--sp2);padding:calc(env(safe-area-inset-top,0px) + var(--sp3)) 16px var(--sp3);border-bottom:1px solid var(--line);background:#fbfbfa}
#sheet .sh h2{font-size:var(--fs-sheet);margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .sb{flex:1;overflow:auto;padding:var(--sp3) 16px calc(30px + var(--safe))}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 60px);z-index:60;background:#141414;color:#fff;padding:var(--sp3) var(--sp4);border-radius:var(--r-md);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:2px var(--sp2);font-size:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.sum{font-size:13px;line-height:1.75}
.sum b{font-family:var(--mono)}
.inline-in{width:92px;background:#fff;border:1px solid var(--line2);border-radius:var(--r-md);height:38px;padding:0 var(--sp2);font-size:16px;text-align:right;font-family:var(--mono)}
.note{font-size:12px;color:var(--mut)}
.sub{font-size:12px;color:var(--mut)}
.mt0{margin-top:0}.mt1{margin-top:var(--sp1)}.mt2{margin-top:var(--sp2)}.mt3{margin-top:var(--sp3)}.mb2{margin-bottom:var(--sp2)}.mb3{margin-bottom:var(--sp3)}
.my3{margin:var(--sp3) var(--sp1)}
.lbl14{font-size:14px}
.wrap{white-space:normal;overflow-wrap:anywhere}.ff{font-family:inherit}.grow{flex:1;min-width:0}
.ta-mono{min-height:110px;font-family:var(--mono)}
table.fixt{table-layout:fixed}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.edsec{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp3) 14px;margin-bottom:var(--sp3);min-width:0;overflow-x:hidden}
.edsec .fld:last-child{margin-bottom:0}
.edh{font-size:11px;font-weight:800;color:var(--mut2);letter-spacing:.06em;margin-bottom:var(--sp3)}
.edfoot{position:sticky;bottom:0;background:var(--bg);padding:var(--sp2) 0;margin-top:var(--sp3)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 2px;border-bottom:1px solid #efefeb}
.kv:last-child{border-bottom:none}
.kv>span:first-child{color:#55554f;flex:none}
.kv b{font-size:13.5px;text-align:right;overflow-wrap:anywhere}
.kv b.pos{color:var(--ss)}.kv b.neg{color:var(--x)}
.kv.tot{border-top:1px solid var(--line);margin-top:2px}
.kv.tot b{font-size:15px}
.ppanel{background:#141414;color:#fff;border-radius:var(--r-lg);padding:15px 16px;margin-top:var(--sp3)}
.ppanel .r{display:flex;justify-content:space-between;font-size:12.5px;padding:3.5px 0;color:#c9c9c4;gap:8px}
.ppanel .r b{color:#fff;font-size:13.5px;font-family:var(--mono)}
.ppanel .big{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #333;padding-top:9px;margin-top:6px;gap:8px}
.ppanel .big .p{font-size:23px;font-weight:800}
.ppanel .big .pf{color:#4ade80;font-weight:800;font-size:15px}
.ppanel .big .pf.neg{color:#fca5a5}
.ppanel .gb{height:8px;border-radius:99px;background:#333;overflow:hidden;margin-top:9px}.ppanel .gb i{display:block;height:100%;background:#4ade80}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:9px;background:var(--card2)}
.meter{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--ss)}
.meter.warn i{background:#d97706}.meter.bad i{background:var(--x)}
.seg{display:flex;background:#efefeb;border-radius:12px;padding:3px;margin-top:10px;gap:2px}
.seg button{flex:1;min-width:0;text-align:center;font-size:12px;font-weight:700;padding:8px 0;border-radius:9px;color:#77776f;background:none;border:0;white-space:nowrap}
.seg button.on{background:#fff;color:#141414;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tl{position:relative;margin-top:6px;padding-left:24px}
.tl:before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:#dcdcd6}
.tl .ev{position:relative;padding:7px 0}
.tl .ev:before{content:"";position:absolute;left:-21.5px;top:11px;width:10px;height:10px;border-radius:50%;background:#141414;border:2px solid #fff;box-shadow:0 0 0 1px #dcdcd6}
.tl .ev.list:before,.tl .ev.price:before{background:var(--acc)}.tl .ev.sold:before{background:var(--ss)}.tl .ev.deal:before,.tl .ev.edit:before{background:#d97706}.tl .ev.ghost:before{background:#fff}
.tl .d{font-size:10.5px;color:var(--mut2);font-weight:700;display:flex;gap:6px;align-items:center}
.tl .t{font-size:13px;font-weight:600;margin-top:1px;overflow-wrap:anywhere}
.src{font-size:9.5px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--card2);color:#55554f}
.src.import{background:#e8eeff;color:var(--acc)}.src.migrate{background:var(--wbg);color:var(--w)}
.legacy{border:1.5px dashed var(--line2);background:#fafaf8}
.legacy .pre{white-space:pre-wrap;font-size:12.5px;line-height:1.6;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
details.fold>summary{cursor:pointer;list-style:none;font-weight:700;font-size:13px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:before{content:"▸ ";color:var(--mut)}
details.fold[open]>summary:before{content:"▾ "}
.diff{font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.diff:last-child{border-bottom:none}
.diff .k{color:var(--mut)}
.diff del{color:var(--x);text-decoration:line-through}.diff ins{color:var(--ss);text-decoration:none;font-weight:700}
/* 探し物（v1.7.x から継続のクラス） */
.hrow{display:flex;gap:var(--sp2);padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hrow .t{font-weight:700;overflow-wrap:anywhere}.hrow .s{font-size:var(--fs-sub);color:var(--mut)}
.hrow .hd{font-size:10.5px;color:var(--mut2);text-align:right;flex:none;line-height:1.3;font-weight:700}.hrow .hd.old{color:var(--w)}
.hcard{padding-top:0;padding-bottom:0}.hcard .hrow:last-child{border-bottom:none}
.hrow .h1{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px var(--sp2)}.hrow .h1 .t{font-size:14.5px}.hrow .hv{font-size:var(--fs-sub);color:var(--mut)}
.hrow .hp{display:flex;flex-wrap:wrap;gap:4px var(--sp3);margin-top:4px}
.pz{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}.pz small{font-family:-apple-system,sans-serif;font-weight:500;font-size:11px;color:var(--mut);margin-right:4px}
.pz.cap{color:var(--ss)}.pz.med{color:var(--tx)}.pz.rot{color:var(--acc)}.pz.none small{margin:0}
.hrow .hm{font-size:11.5px;color:var(--mut);margin-top:3px;overflow-wrap:anywhere}
.hrow .ho{display:inline-block;font-size:11px;color:var(--acc);background:var(--accbg);border-radius:999px;padding:1px 8px;margin-top:4px;font-weight:600}
.hcats,.hgens,.hpubs{margin:var(--sp2) 0}
.hsub{font-size:var(--fs-sub);color:var(--mut);margin:var(--sp3) var(--sp1) var(--sp1);font-weight:700}
.hsub.pfold{display:flex;align-items:center;gap:var(--sp2);cursor:pointer;user-select:none;-webkit-user-select:none;padding:var(--sp2) var(--sp1);margin-top:var(--sp2);margin-bottom:0;border-bottom:1px solid var(--line)}
.hsub.pfold+.card{margin-top:var(--sp2)}.hsub .gfi{color:var(--acc);font-size:14px;flex:none}
.sec.gfold{display:flex;align-items:center;gap:var(--sp2);cursor:pointer;user-select:none;-webkit-user-select:none;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp2) var(--sp3);margin-left:0;margin-right:0;color:var(--tx);letter-spacing:0;font-size:13px}
.sec.gfold .gfi{color:var(--acc);font-size:14px;flex:none}
.hinfo{display:flex;align-items:center;gap:var(--sp2);font-size:12px;color:var(--mut);margin:0 var(--sp1) var(--sp1);flex-wrap:wrap}
.hx summary{cursor:pointer;color:var(--mut);list-style:none}.hx summary::before{content:"ⓘ "}.hx summary::-webkit-details-marker{display:none}.hx[open]{flex-basis:100%}
.fill .need{color:var(--x);font-weight:700}
label.pick{position:relative;overflow:hidden}label.pick input{position:absolute;inset:0;opacity:0;font-size:0}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + var(--safe) + var(--sp2));z-index:35;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp2) var(--sp3);display:flex;gap:var(--sp2);align-items:center;flex-wrap:wrap;box-shadow:0 6px 18px rgba(20,20,20,.15)}
.selbar .grow{font-size:13px;font-weight:700}
.qchk{width:20px;height:20px;flex:none;accent-color:var(--acc)}

<script>
'use strict';
/* ============================================================
   SSS（台帳）— 本・漫画せどりの記録・相場・集計（単一HTML／バックエンドなし）
   v2.0.0 で「出品作業」の機能（出品メモ・下書き・定型文・試算・値下げ作業・連携ボタン）は新・出品作業アプリへ移した。
   データ: localStorage "sedoscope_s_v1"（キー名は v1 から変更しない）
   外部通信: openBD ISBN照会のみ（ほかに同一オリジンの hunt_update.json）
   ============================================================ */

const APP_VER='2.0.3';
const APP_DATE='2026-11-04';
const CHANGELOG=[
  'v2.0.3（2026-11-04）表示名を「SSS」に統一。タブバー下の帯への対策として、画面の土台（ステータスバー指定・body・タブバーの高さ）を出品アプリと同じ形にした。',
  'v2.0.1（2026-11-03）実機フィードバックの修正。下部タブバーを画面下端に付けた（浮いて下に余白ができていた）。補完中リストの所持判定を厳密にし、別作品（キングダムハーツ→キングダム、BORUTO→NARUTO など）を数えないようにした。「巻ノ19」形式の巻数と「全2巻」形式の全巻数を読めるようにした。同じ作品の重複行は1行にまとめ、全巻セットを売却済みの作品は補完中に出さない。探し物の詳細に「この探し物を削除」を追加（商品の記録は消えない）。保存キー・データ形式は変更なし。',
  'v2.0.0（2026-11-03）台帳化リニューアル。SSS を「記録・相場・集計」の台帳に専念させ、出品作業は新・出品作業アプリへ移した。タブを 在庫／探し物／集計／設定 にし、ヘッダーを「SSS（台帳）」に。出品メモ・下書き（draft_update）・定型文・単品の試算・値下げ作業・POSTA/KOMA 連携ボタンを画面から外した（データは消さず、商品詳細の「旧メモ」と設定の「旧定型文」で読み取り専用で見られる）。在庫画面の先頭に「読み取りで登録（バーコード／ISBN）」。商品詳細に履歴タイムライン（記録元：手入力／取り込み／移行）とステータスの手早い切り替え。集計の先頭に今月の純利益・回転・在庫数と段階目標との差。新アプリとの連携（候補の書き出し：SSSのアイテムIDがキー／結果の取り込み：二重防止・差分プレビュー・競合の保留・必須項目の検証）。保存は localStorage のまま1つの関数に集約し、容量メーター（70%で警告）・バックアップ経過日数（7日超で強調）・navigator.storage.persist() を追加。初回起動時は移行前の全データを別キーに自動で控え、書き出しを促す。データにスキーマ版数 2 を付けた。',
  'v1.7.9（2026-11-02）設定タブに「出品下書きの更新を取り込む」ボタンを追加。',
  'v1.7.8（2026-11-01）値下げボタン、探し物から仕入れ登録、月の純利益の目標。',
  'v1.7.0〜v1.7.7（2026-10-27〜11-01）出品メモ機能の内蔵、探し物リストの取り込み・絞り込み・折りたたみ。',
  'v1.6.0（2026-10-27）収支・経費帳簿、ステータス「取引中」、カテゴリ。',

];
const KEY='sedoscope_s_v1';           // 保存キー（v1 から変更しない）
const PRE_KEY=KEY+'__pre_v2';         // v2.0.0 初回起動時の「移行前の全データ」の控え（一度だけ作る）

const LS_LIMIT=5*1024*1024;           // localStorage の目安上限（iOS Safari 約5MB。UTF-16 換算で数える）

const ST_ORDER={deal:0,listed:1,stock:2,cand:3,sold:4};   // 一覧の初期表示：現役（取引中・出品中・在庫）を先に
const CATS=['本・コミック','トレカ','CD・音楽','古着','ゲーム','その他'];const BOOK='本・コミック';
const EXCATS=['仕入高','荷造運賃','支払手数料','通信費','消耗品費','旅費交通費','広告宣伝費','その他'];
const catOf=x=>String((x&&x.cat)||'').trim()||BOOK;const isBook=x=>catOf(x)===BOOK;
const genreOf=x=>String((x&&x.genre)||'').trim();
const ACC=[['obi','帯'],['cover','カバー'],['booklet','特典冊子'],['poster','ポスター'],['other','その他']];
const EDS=['完全版','文庫版','愛蔵版','新装版','ワイド版','カラー版','デラックス版','復刻版','豪華版','新書版','大判','KCDX','B6判','A5判'];
const DEF_LINKS=[
  {id:'mer',name:'メルカリ（売り切れ）',url:'https://jp.mercari.com/search?keyword={title}&status=sold_out'},
  {id:'ypf',name:'Yahoo!フリマ',url:'https://paypayfleamarket.yahoo.co.jp/search/{title}'},
  {id:'rak',name:'ラクマ',url:'https://fril.jp/s?query={title}'},
  {id:'yac',name:'ヤフオク（終了分）',url:'https://auctions.yahoo.co.jp/closedsearch/closedsearch?p={title}'},

  {id:'obd',name:'openBD書誌',url:'https://api.openbd.jp/v1/get?isbn={isbn}&pretty'}
];
// 旧メモ（v2.0.0 で廃止した出品メモ・下書きのデータ）。消さずに商品詳細で読み取り専用表示する
const LEGACY_KEYS=['listTitle','listDesc','gen','draftKey','postaId'];
function defSettings(){return{
  target:30,mode:'cons',disp:3,fresh:30,dupDays:60,unsoldDays:45,backupWarn:14,
  ch:{m:{name:'メルカリ',fee:10,ship:210,on:true},y:{name:'Yahoo!フリマ',fee:5,ship:210,on:true},
      r:{name:'ラクマ',fee:10,ship:210,on:true},a:{name:'ヤフオク',fee:10,ship:210,on:true}},
  pack:30,other:0,main:'m',pick:'main',
  acc:{obi:10,cover:30,booklet:10,poster:5,other:0},
  store:'',stores:[],budget:'',autoQueue:false,postaUrl:'https://furumusx.github.io/posta/',komaUrl:'https://furumusx.github.io/KOMA/',huntCat:'',huntPub:'',huntGenre:'',huntUpdVer:0,draftUpdVer:0,
  goalYen:20000,goalPhase:'〜2027-02',   // v2.0.0：段階目標（初期値 月2万円・フェーズ表記）
}}
function defSync(){return{applied:{},conflicts:[],exports:[]}}
function defState(){return{schema:SCHEMA,items:[],hunt:[],expenses:[],queue:[],biblio:{},settings:defSettings(),links:DEF_LINKS.map(x=>({...x})),
  meta:{created:new Date().toISOString(),lastBackup:null,imports:[]},sync:defSync()}}

/* ---------- 保存（v2.0.0：localStorage への書き込みはすべて storeWrite に集約。将来の保存先差し替えはここだけ直す） ---------- */
function storeWrite(key,text){
  try{if(text===null)localStorage.removeItem(key);else localStorage.setItem(key,text);return true}
  catch(e){console.warn(e);return false}
}
function storeRead(key){try{return localStorage.getItem(key)}catch(e){return null}}
function storeUsage(){   // localStorage 全体の使用量（UTF-16 換算のバイト数）
  let chars=0;const keys=[];
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);const v=localStorage.getItem(k)||'';chars+=k.length+v.length;keys.push({k,bytes:(k.length+v.length)*2})}}catch(e){}
  return{bytes:chars*2,ratio:chars*2/LS_LIMIT,keys}}
const isObj=o=>!!o&&typeof o==='object'&&!Array.isArray(o);
const BAD_KEYS=new Set(['__proto__','constructor','prototype']);
function safeParse(t){return JSON.parse(t,(k,v)=>BAD_KEYS.has(k)?undefined:v)}   // 外部ファイル（復元・結果・探し物）用：プロトタイプ汚染の鍵を捨てる
function fixState(s){
  const d=defState(); if(!isObj(s)) return d;
  s.items=Array.isArray(s.items)?s.items.filter(x=>x&&typeof x==='object'&&!Array.isArray(x)):[];
  s.queue=Array.isArray(s.queue)?s.queue:[];
  s.biblio=isObj(s.biblio)?s.biblio:{};
  const ds=defSettings(), ss=isObj(s.settings)?s.settings:{};
  const ch={}; for(const c of CH) ch[c]=Object.assign({},ds.ch[c],(ss.ch||{})[c]||{});
  s.settings=Object.assign(ds,ss,{ch,acc:Object.assign({},ds.acc,ss.acc||{})});
  if(typeof s.settings.draftUpdVer!=='number'||!isFinite(s.settings.draftUpdVer))s.settings.draftUpdVer=0;
  s.links=Array.isArray(s.links)?s.links:d.links;
  s.hunt=Array.isArray(s.hunt)?s.hunt:[];
  if(s.templates!==undefined&&!Array.isArray(s.templates))delete s.templates;   // v1.7.3 から：配列以外は無効。配列の旧定型文は残す（v2.0.0 は読み取り専用表示）
  s.expenses=Array.isArray(s.expenses)?s.expenses.filter(x=>x&&typeof x==='object'):[];
  for(const it of s.items)if(!it.cat)it.cat=BOOK;
  s.meta=Object.assign(d.meta,isObj(s.meta)?s.meta:{});
  const sy=isObj(s.sync)?s.sync:{};
  s.sync=Object.assign(sy,{applied:isObj(sy.applied)?sy.applied:{},conflicts:Array.isArray(sy.conflicts)?sy.conflicts:[],exports:Array.isArray(sy.exports)?sy.exports:[]});
  const sv=Number(s.schema);s.schema=isFinite(sv)&&sv>0?sv:1;   // 版数は移行処理（migrate）だけが上げる
  return s;
}
/* ---------- 移行（schema 1 → 2） ----------
   構造の変更は「足すだけ」：各商品に履歴 hist（記録元＝移行）を作り、schema を 2 にする。
   既存の項目（旧メモ・未知の項目を含む）は1つも消さない・書き換えない。2回実行しても結果は同じ（hist が既にあれば作らない）。 */
function chName(c){const k=chKey(c);return k!=='o'&&S&&S.settings&&S.settings.ch[k]?S.settings.ch[k].name:(String(c||'').trim())}
function d10(v){const d=pd(v);return d?ymd(d):''}
function deriveHist(it){const H=[];const ev=(at,kind,text)=>H.push({at:d10(at),kind,text,src:'migrate'});
  const c=num(it.cost),created=d10(it.created);
  if(it.st==='cand'&&!isFinite(c))ev(it.date||created,'reg','候補として登録');
  else ev(it.date||created,'reg',`仕入れ登録${isFinite(c)?`（原価 ${yenT(c)}）`:''}${it.store?`・${it.store}`:''}`);
  const lp=num(it.listPrice);
  if(it.listDate)ev(it.listDate,'list',`出品${it.listCh?'：'+chName(it.listCh):''}${lp>0&&!it.cutDate?` ${yenT(lp)}`:''}`);
  if(it.cutDate)ev(it.cutDate,'price',`価格改定${lp>0?` → ${yenT(lp)}`:''}`);
  if(it.st==='deal')ev(it.updated||'','deal','取引中');
  const sp=num(it.soldPrice);
  if(it.st==='sold'||sp>0)ev(it.soldDate||(it.st==='sold'?it.updated:'')||'','sold',`売却${it.soldCh?'：'+chName(it.soldCh):''}${sp>0?` ${yenT(sp)}`:''}`);
  return H.sort((a,b)=>(a.at||'9999').localeCompare(b.at||'9999'))}
function migrate(s){
  if((Number(s.schema)||1)>=SCHEMA)return false;
  const prev=s;let n=0;
  for(const it of prev.items){if(!Array.isArray(it.hist)){it.hist=deriveHist(it);n++}}
  prev.meta.migrations=(Array.isArray(prev.meta.migrations)?prev.meta.migrations:[]).concat([{at:new Date().toISOString(),from:Number(prev.schema)||1,to:SCHEMA,app:APP_VER,hist:n}]);
  prev.schema=SCHEMA;return true}

let S=null,IDX=null,PERSIST=null;
const BOOT={migrated:false,preSaved:false,preErr:false,parseErr:false,hold:false};
function boot(){
  const raw=storeRead(KEY);let s=null;
  if(raw){try{s=JSON.parse(raw)}catch(e){BOOT.parseErr=true}}
  // 構造を変える前に、移行前の全データ（保存されていた文字列そのまま）を別キーに控える。控えは一度だけ作り、上書きしない
  const needs=raw&&(BOOT.parseErr||!isObj(s)||(Number(s.schema)||1)<SCHEMA);
  if(needs&&storeRead(PRE_KEY)===null){
    const pre=JSON.stringify({app:'SSS',key:KEY,kind:'pre-migration',ver:'1.x',savedAt:new Date().toISOString(),raw});
    if(storeWrite(PRE_KEY,pre))BOOT.preSaved=true;else{BOOT.preErr=true;BOOT.hold=true}
  }
  if(BOOT.parseErr){S=defState();BOOT.hold=true;return}   // 読めない保存データは上書きしない（控え・書き出しを優先）
  S=fixState(s);
  if(migrate(S)){BOOT.migrated=true;S.meta.migrateAck=false;if(!BOOT.hold)save()}
}
function save(){
  IDX=null;
  if(BOOT.hold){toast('移行前のデータを書き出すまで保存を止めています（設定タブ）');return false}
  const ok=storeWrite(KEY,JSON.stringify(S));
  if(!ok)toast('保存できませんでした（端末の保存容量不足の可能性）。バックアップを書き出してください');
  return ok;
}


/* ---------- 小道具（v1.x から継続） ---------- */
/* ---------- 小道具 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function num(v){if(v===null||v===undefined||v==='')return NaN;if(typeof v==='number')return v;
  const t=String(v).normalize('NFKC').replace(/[,¥￥円\s]/g,'');const m=t.match(/-?\d+(\.\d+)?/);return m?Number(m[0]):NaN}
function fnum(it,k,def){if(it&&it[k]!==''&&it[k]!=null&&isFinite(num(it[k])))return num(it[k]);return def}
const yen=(n,cls='')=>isFinite(n)?`<span class="num ${cls}">${Math.round(n).toLocaleString('ja-JP')}</span><small class="u">円</small>`:'<span class="num mut">—</span>';
const yenT=n=>isFinite(n)?Math.round(n).toLocaleString('ja-JP')+'円':'—';
const pct=n=>isFinite(n)?(n*100).toFixed(1)+'%':'—';
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('コピーしました');return true}catch(e){
  const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);
  let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();toast(ok?'コピーしました':'コピーできませんでした');return ok}}
function median(a){if(!a.length)return NaN;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){if(!s)return null;if(s instanceof Date)return s;if(typeof s==='number')return new Date(s);
  const t=String(s).normalize('NFKC').trim();const m=t.match(/(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})/);
  if(m)return new Date(+m[1],m[2]-1,+m[3]);const d=new Date(t);return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function daysAgo(s){const d=pd(s);if(!d)return null;const n=new Date();n.setHours(0,0,0,0);return Math.round((n-d)/864e5)}
function mdShort(s){const d=pd(s);return d?(d.getMonth()+1)+'/'+d.getDate():'—'}
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- コード（ISBN/JAN） ---------- */
function ean13ok(c){if(!/^\d{13}$/.test(c))return false;let s=0;for(let i=0;i<12;i++)s+=(+c[i])*(i%2?3:1);return (10-s%10)%10===+c[12]}
function isbn10to13(t){const b='978'+t.slice(0,9);let s=0;for(let i=0;i<12;i++)s+=(+b[i])*(i%2?3:1);return b+((10-s%10)%10)}
function normCode(v){let t=String(v??'').normalize('NFKC').replace(/[^0-9Xx]/g,'').toUpperCase();
  if(/^\d{9}[\dX]$/.test(t))return isbn10to13(t);
  if(/^\d{13}$/.test(t)||/^\d{8}$/.test(t))return t;return t.replace(/X/g,'')}
function okScanCode(c){return ean13ok(c)&&!/^19[0-9]/.test(c)}   // 書籍の2段目(192…)は無視
const isISBN=c=>/^97[89]\d{10}$/.test(c);

/* ---------- 正規化 ---------- */
function workKey(s){
  if(!s)return '';let t=String(s).normalize('NFKC').toLowerCase();
  t=t.replace(/[【\[(（「『〈<][^】\])）」』〉>]*[】\])）」』〉>―—]/g,' ');
  t=t.replace(/全\s*\d+\s*巻|\d+\s*[-~〜～]\s*\d+\s*巻?|第?\s*\d+\s*巻|vol\.?\s*\d+/g,' ');

function regParams(){const p=num($('#rgP').value);if(!isFinite(p)){toast('先に仕入価格（単価）を入れてください');return null}return{p,d:$('#rgD').value||today(),st:($('#rgS').value||'').trim()}}
function regDup(code,title){const c=normCode(code),k=workKey(title),v=volOf(title);
  return S.items.filter(it=>(it.st==='stock'||it.st==='listed')&&isBook(it)&&((c&&normCode(it.code)===c)||(v&&keyMatch(k,itemKey(it))&&itemVols(it).has(v))))}
function regAdd(o){const P=regParams();if(!P)return false;const it=newItem({name:o.title||o.code,code:o.code||'',author:o.author||'',pub:o.pub||'',cover:o.cover||'',st:'stock',cost:P.p,date:P.d,store:P.st});
  it.hist[0].text+=o.code?`・読み取り（${o.code}）`:'・手入力';S.items.unshift(it);if(!save())return false;REG.log.unshift(it.name);const l=$('#regLog');if(l)l.innerHTML=REG.log.map(n=>`✓ ${esc(n)}`).join('<br>');toast(`登録：${it.name}`);return true}
function regPendShow(){const e=$('#regPend');if(!e)return;const P=REG&&REG.pend;if(!P){e.innerHTML='';return}
  if(P.nobib)e.innerHTML=`<div class="banner mt2" style="flex-wrap:wrap">📕 書誌が見つかりませんでした（${esc(P.code)}）。商品名を入れて登録できます。<input id="rgPendName" class="inline-in" style="width:100%;text-align:left" placeholder="商品名"><button data-act="regPendManual">この名前で登録</button><button data-act="regPendSkip">スキップ</button></div>`;
  else e.innerHTML=`<div class="banner mt2" style="flex-wrap:wrap">⚠ 同じ巻がすでに在庫にあります：${esc(P.dups.map(d=>d.name).join('、'))}<br>読み取った本：${esc(P.title)}<button data-act="regPendOk">それでも登録</button><button data-act="regPendSkip">スキップ</button></div>`}
async function regCode(raw){if(!REG||REG.pend)return;if(!regParams())return;const code=normCode(raw);
  let b=S.biblio[code];if(!b||!b.title)b=await fetchBiblio(code);if(!REG)return;
  if(!b||!b.title){REG.pend={code,nobib:true};regPendShow();return}
  const o={code,title:b.title,author:b.author,pub:b.pub,cover:b.cover};const d=regDup(code,b.title);
  if(d.length){REG.pend=Object.assign(o,{dups:d});regPendShow();return}regAdd(o)}

// まとめ売りの商品名：メンバー名の最長共通接頭辞（末尾の空白・記号は除く）＋「まとめ売り」
function mixedName(ms){const ns=ms.map(m=>String(m.name||''));let pre=ns[0]||'';
  for(const n of ns.slice(1)){let i=0;while(i<pre.length&&i<n.length&&pre[i]===n[i])i++;pre=pre.slice(0,i)}
  pre=pre.replace(/[\s・:：\/／\-―—(（　]+$/,'').trim();
  return [...pre].length>=2?`${pre} まとめ売り`:`${ns[0]} 他まとめ売り`}
function listBundleMake(){
  const ids=Object.keys(UI.listSel).filter(k=>UI.listSel[k]);
  const ms=ids.map(id=>getItem(id)).filter(Boolean);
  if(ms.length<2){toast('2冊以上選んでください');return}
  if(ms.some(m=>m.st==='sold')){toast('売却済の商品は束ねられません');return}
  const key=itemKey(ms[0]);

  <button class="btn pri" style="width:100%" data-act="listBundleDo" data-mixed="1" data-ids="${esc(ids.join(','))}">まとめ売りとして束ねる</button>`);return}

  <button class="btn pri" style="width:100%" data-act="listBundleDo" data-ids="${esc(ids.join(','))}">この範囲で束ねる</button>`);
}
function listBundleDoAct(b){
  const ids=b.dataset.ids.split(',').filter(Boolean);
  const ms=ids.map(id=>getItem(id)).filter(Boolean);
  if(b.dataset.mixed==='1'){
    const name=(($('#bunName')||{}).value||'').trim()||mixedName(ms);
    const cost=ms.reduce((s,m)=>s+(num(m.cost)||0),0);const allStock=ms.every(m=>m.st==='stock'||m.st==='listed');
    const target=newItem({name,work:'',setk:'セット',range:'',have:'',st:allStock?'stock':'cand',cost:allStock?cost:'',genre:ms[0].genre||'',pub:ms[0].pub||'',autoBundle:1,mixed:1,memo:'一覧で束ね（まとめ売り）：'+ms.map(m=>m.name).join('、')});
    S.items.unshift(target);ms.forEach(m=>m.inSet=target.id);
    UI.listSel={};save();closeSheet();setTab('stock');toast('まとめ売りとして束ねました');return}
  const lo=num($('#bunLo').value),hi=num($('#bunHi').value);
  if(!(lo>0)||!(hi>=lo)){toast('巻の範囲を入力してください');return}
  const key=itemKey(ms[0]);
  const have=new Set();for(const m of ms){const r=itemRangeOf(m);if(r)for(let v=r[0];v<=r[1];v++)have.add(v)}
  const cost=ms.reduce((s,m)=>s+(num(m.cost)||0),0);
  const allStock=ms.every(m=>m.st==='stock'||m.st==='listed');
  let target=findSetItem(key,lo,hi);
  if(target&&ms.includes(target))target=null;
  if(target){if(target.st==='sold'){toast('対応するセット商品は売却済のため束ねられません');return}
    ms.forEach(m=>m.inSet=target.id);
    const hv=new Set([...parseVols(target.have||''),...have]);target.have=[...hv].sort((a,b2)=>a-b2).join(',');
    if(target.st==='cand'&&allStock){target.st='stock';target.cost=cost;target.date=today()}
  }else{
    const base=((ms[0].work)||ms[0].name||'').replace(/第?\s*\d+\s*巻.*$/,'').trim();
    target=newItem({name:`${base} ${lo}〜${hi}巻 セット`,work:ms[0].work||'',setk:'セット',range:`${lo}-${hi}`,have:[...have].sort((a,b2)=>a-b2).join(','),st:allStock?'stock':'cand',cost:allStock?cost:'',genre:ms[0].genre||'',pub:ms[0].pub||'',autoBundle:1,memo:'一覧で束ね：'+ms.map(m=>m.name).join('、')});
    S.items.unshift(target);ms.forEach(m=>m.inSet=target.id);
  }
  UI.listSel={};save();closeSheet();setTab('stock');toast('セットとして束ねました');
}
function soldParts(it){
  const sp=num(it.soldPrice??it.sp);if(!(sp>0))return null;let c=chKey(it.soldCh);if(c==='o')c=S.settings.main;const cs=S.settings.ch[c];
  const fee=isFinite(num(it.soldFee))?num(it.soldFee):Math.round(sp*num(cs.fee)/100);
  const ship=fnum(it,'soldShip',fnum(it,'ship',num(cs.ship)||0)),pack=fnum(it,'soldPack',fnum(it,'pack',num(S.settings.pack)||0)),other=fnum(it,'soldOther',fnum(it,'other',num(S.settings.other)||0));
  const cost=num(it.cost)||0;return{sp,fee,ship,pack,other,cost,total:cost+ship+fee+pack+other,profit:sp-fee-ship-pack-other-cost}}
function soldProfit(it){
  const sp=num(it.soldPrice??it.sp);if(!(sp>0))return NaN;let c=chKey(it.soldCh);if(c==='o')c=S.settings.main;const cs=S.settings.ch[c];
  const fee=isFinite(num(it.soldFee))?num(it.soldFee):Math.round(sp*num(cs.fee)/100);
  const ship=fnum(it,'soldShip',fnum(it,'ship',num(cs.ship)||0)),pack=fnum(it,'soldPack',fnum(it,'pack',num(S.settings.pack)||0)),other=fnum(it,'soldOther',fnum(it,'other',num(S.settings.other)||0));
  return sp-fee-ship-pack-other-(num(it.cost)||0);
}
function recheckList(){
  const seen=new Set(),out=[];
  for(const it of S.items){if(it.st==='sold')continue;const k=itemKey(it);if(!k||seen.has(k))continue;seen.add(k);
    const a=analyze({itemId:it.id});if(a.flags.stale)out.push({it,a})}
  return out;
}
function listFilterSheet(){
  const vs=k=>[...new Set(S.items.map(i=>String(i[k]||'')).filter(Boolean))].sort();
  const months=[...new Set(S.items.map(i=>String(i.date||'').slice(0,7)).filter(x=>/^\d{4}-\d{2}$/.test(x)))].sort().reverse();
  const sel=(k,lb,vals,v)=>vals.length?`<div class="fld"><label>${lb}</label><select data-lsel="${k}"><option value="">すべて</option>${vals.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')}</select></div>`:'';

  return (body||'<div class="note">絞り込める項目がまだありません（ジャンルや店舗などの値が入ると、ここに出ます）</div>')+`<div class="btns mt3"><button class="btn" data-act="listFilterClearAll">すべてクリア</button><button class="btn pri" data-act="closeSheet">閉じる</button></div>`}
function selOpts(k,cur){let base=[];
  if(k==='cat'){const all=[...new Set([...CATS,...S.items.map(catOf)])];if(cur&&!all.includes(String(cur)))all.push(String(cur));return all}
  if(k==='setk')base=['単巻','全巻セット','途中セット','セット','画集・設定資料集','小説','文庫','その他'];
  else if(k==='genre')base=['漫画','少年漫画','少女漫画','青年漫画','小説','ライトノベル','画集・設定資料集','雑誌','実用書','その他'];
  else if(k==='cond')base=['目立った傷や汚れなし','やや傷や汚れあり','傷や汚れあり','状態が悪い','新品・未使用'];
  else if(k==='pub')base=['集英社','講談社','小学館','KADOKAWA','白泉社','秋田書店','双葉社','芳文社','スクウェア・エニックス','少年画報社','徳間書店','一迅社','竹書房'];
  else if(k==='store')base=[...(S.settings.stores||[])];
  const used=[...new Set(S.items.map(i=>String(i[k]||'')).filter(Boolean))];
  const all=[...new Set([...base,...used])];
  if(cur&&!all.includes(String(cur)))all.push(String(cur));
  return ['',...all]}
function inPer(d,per){const dt=pd(d);if(!dt)return per==='all';const n=new Date();
  if(per==='all')return true;if(per==='30')return daysAgo(dt)<=30;
  if(per==='month')return dt.getFullYear()===n.getFullYear()&&dt.getMonth()===n.getMonth();
  if(per==='last'){const l=new Date(n.getFullYear(),n.getMonth()-1,1);return dt.getFullYear()===l.getFullYear()&&dt.getMonth()===l.getMonth()}
  if(per==='year')return dt.getFullYear()===n.getFullYear();return true}

/* ---------- 収支・経費帳簿（v1.6.0 から継続） ---------- */
const curYM=()=>today().slice(0,7);
function ymAdd(ym,d){let [y,m]=ym.split('-').map(Number);m+=d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+String(m).padStart(2,'0')}
const soldYM=it=>String(it.soldDate||it.date||'').slice(0,7);
// 売上に数えるのは「売却済」だけ（取引中は含めない）
function pnl(ym){
  const sold=S.items.filter(i=>i.st==='sold'&&soldYM(i)===ym);let sales=0,cost=0,n=0;const c={cost:0,ship:0,fee:0,pack:0,other:0};const byCat={};
  for(const it of sold){const x=soldParts(it);if(!x)continue;n++;sales+=x.sp;cost+=x.total;for(const k in c)c[k]+=x[k];
    const k=catOf(it);byCat[k]=byCat[k]||{n:0,s:0,p:0};byCat[k].n++;byCat[k].s+=x.sp;byCat[k].p+=x.profit}
  const ex=S.expenses.filter(e=>String(e.date||'').slice(0,7)===ym);const exT=ex.reduce((a,e)=>a+(num(e.amount)||0),0);const exBy={};
  for(const e of ex){const k=e.cat||'その他';exBy[k]=(exBy[k]||0)+(num(e.amount)||0)}
  return{ym,n,sales,cost,c,exT,exBy,ex,byCat,net:sales-cost-exT}}
function pnlChart(ym){
  const ms=[];for(let i=11;i>=0;i--)ms.push(pnl(ymAdd(ym,-i)));
  const G=goalYen();   // v1.7.8：目標ラインが必ず収まるよう最大値に含める
  const W=360,H=170,top=10,bot=22,l=4;const mx=Math.max(1,G,...ms.map(m=>Math.max(m.sales,m.net))),mn=Math.min(0,...ms.map(m=>m.net));
  const sc=v=>top+(mx-v)/(mx-mn)*(H-top-bot);const z=sc(0);const cw=(W-l)/12;const bw=cw*0.34;
  let g=`<line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="var(--line)"/>`;
  ms.forEach((m,i)=>{const x=l+i*cw+cw*0.12;const ys=sc(m.sales),yn=sc(m.net);
    g+=`<rect x="${x}" y="${Math.min(ys,z)}" width="${bw}" height="${Math.max(Math.abs(z-ys),m.sales?1:0)}" fill="var(--s)" rx="2"><title>${m.ym} 売上 ${yenT(m.sales)}</title></rect>`;
    g+=`<rect x="${x+bw+1}" y="${Math.min(yn,z)}" width="${bw}" height="${Math.max(Math.abs(z-yn),m.net?1:0)}" fill="${m.net<0?'var(--x)':'var(--ss)'}" rx="2"><title>${m.ym} 純利益 ${yenT(m.net)}</title></rect>`;
    g+=`<text x="${l+i*cw+cw/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="${m.ym===ym?'var(--tx)':'var(--mut)'}" font-weight="${m.ym===ym?700:400}">${+m.ym.slice(5)}月</text>`});
  if(G>0){const gy=sc(G);g+=`<line class="goalLine" x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--w)" stroke-width="1.2" stroke-dasharray="5 4"><title>目標 ${yenT(G)}</title></line><text x="${W-2}" y="${gy<top+12?gy+11:gy-3}" text-anchor="end" font-size="9" fill="var(--w)">目標</text>`}
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="直近12ヶ月の売上と純利益">${g}</svg>
  <div class="lg"><span><i style="background:var(--s)"></i>売上</span><span><i style="background:var(--ss)"></i>純利益</span><span>最大 ${yenT(mx)}</span></div></div>`}

  <div class="btns mt2"><button class="btn pri" data-act="exOpen">＋ 経費を追加</button></div>
  <div class="note mt1">商品として登録した本・品物の仕入額は「原価」として売上コストに自動で入ります。経費の「仕入高」には、商品として登録していない仕入だけを入れてください（二重計上を防ぐため）。</div></div>

    if(def&&def[2]==='num'){v=v.trim()===''?'':(isFinite(num(v))?num(v):v)}if(Array.isArray(EDIT[k]))v=v.split(/[,、]/).map(x=>x.trim()).filter(Boolean);EDIT[k]=v});

function saveEditor(){
  readEditor();const e=EDIT;if(!String(e.name||'').trim()&&!String(e.code||'').trim()){toast('商品名かISBNを入力してください');return null}
  if(e.st==='sold'&&!e.soldDate)e.soldDate=today();if(e.st==='listed'&&!e.listDate)e.listDate=today();

      if(ch.length){if(!Array.isArray(e.hist))e.hist=deriveHist(old);const stc=ch.includes('st');
        e.hist.push({at:today(),kind:stc?(e.st==='listed'?'list':e.st==='sold'?'sold':e.st==='deal'?'deal':'edit'):'edit',text:'記録を修正：'+ch.map(k=>`${FL[k]||k} ${fmtV(k,old[k])} → ${fmtV(k,e[k])}`).join('、'),src:'manual'})}}

function huntRot(e){const t=num(e&&(e.turnover??e.rot));if(t>0)return t;const m=String((e&&e.memo)||'').normalize('NFKC').match(/(\d+(?:\.\d+)?)\s*回\s*\/\s*月/);return m?+m[1]:null}
function huntTotal(e){const t=String(e.vols??'').normalize('NFKC').trim();let m=t.match(/(\d+)\s*[〜~\-]\s*(\d+)/);if(m)return +m[2];m=t.match(/全\s*(\d+)\s*巻/);if(m)return +m[1];m=t.match(/^(\d+)\s*巻?$/);return m?+m[1]:null}
function fillRows(){const out=[];(S.hunt||[]).forEach((e,i)=>{if(!isBook(e))return;const N=huntTotal(e);if(!(N>=2))return;
    const hk=hkey(e);if(S.items.some(it=>it.st==='sold'&&isBook(it)&&huntMatch(hk,itemKey(it))&&(()=>{const r=itemRangeOf(it);return r&&r[0]<=1&&r[1]>=N})()))return;   // v2.0.1：全巻セットを完売済みの作品は補完中に出さない
    const own=[...ownedVols(e)].filter(v=>v>=1&&v<=N);if(!own.length)return;const os=new Set(own);const miss=[];for(let v=1;v<=N;v++)if(!os.has(v))miss.push(v);if(!miss.length)return;
    const got=huntInv(e).reduce((s,it)=>s+(num(it.cost)||0),0);let rem=null,per=null;
    if(e.setCap>0){rem=e.setCap-got;per=Math.floor(rem/miss.length)}else if(e.perVolCap>0){per=e.perVolCap;rem=per*miss.length}
    out.push({e,i,N,miss,got,rem,per})});
  const seen=new Map();for(const r of out){const dk=hkey(r.e)+'|'+r.N;const prev=seen.get(dk);   // v2.0.1：同じ作品の重複行（全巻セット版／通常版）は1行にまとめる
    if(!prev||((r.e.setCap>0||r.e.perVolCap>0)&&!(prev.e.setCap>0||prev.e.perVolCap>0)))seen.set(dk,r)}
  return [...seen.values()].sort((a,b)=>a.miss.length-b.miss.length)}

function resPlan(r,seen){
  const P={rid:'',sssId:'',name:'',status:'',reason:'',changes:[],conflicts:[],want:{},stTo:null};
  const bad=m=>{P.status='invalid';P.reason=m;return P};
  if(!isObj(r))return bad('結果の形式が違います');
  P.rid=String(r.resultId??'').trim();P.sssId=String(r.sssId??'').trim();
  if(!RID_RE.test(P.rid))return bad('resultId（結果ごとの一意ID）が無いか形式が違います');
  if(!P.sssId)return bad('sssId（SSSのアイテムID）がありません');
  const it=getItem(P.sssId);if(!it)return bad('このIDのアイテムが台帳にありません');P.name=String(it.name||'');
  const ap=S.sync.applied[P.rid];
  if(Object.prototype.hasOwnProperty.call(S.sync.applied,P.rid)){P.status='dup';P.reason=ap&&ap.res==='pending'?'競合として保留中です':'取り込み済みです';return P}
  if(seen.has(P.rid)){P.status='dup';P.reason='同じファイルの中で resultId が重複しています';return P}
  seen.add(P.rid);
  const L=isObj(r.listing)?r.listing:null,D=isObj(r.sold)?r.sold:null,W=P.want;const has=v=>v!==undefined&&v!==null&&v!=='';
  if(!L&&!D)return bad('出品情報（listing）も売却情報（sold）もありません');
  if(L){
    if(has(L.ch)){const c=resCh(L.ch);if(c==='o')return bad('出品の販路を判別できません');W.listCh=c}
    if(has(L.price)){const p=vYen(L.price);if(p==null)return bad('出品価格が不正です');W.listPrice=p}
    if(has(L.date)){const d=vDate(L.date);if(!d)return bad('出品日が不正です（YYYY-MM-DD）');W.listDate=d}
    if(has(L.url)){const u=vUrl(L.url);if(!u)return bad('出品URLが不正です（http/https のみ）');W.listUrl=u}
    if(has(L.id)){const t=String(L.id).trim();if(!t||t.length>100)return bad('出品IDが不正です');W.listId=t}
    if(has(L.cond)){const t=String(L.cond).trim();if(!t||t.length>60)return bad('状態が不正です');W.cond=t}
  }
  if(D){const miss=[];const c=has(D.ch)?resCh(D.ch):'o';if(c==='o')miss.push('販路');const p=vYen(D.price);if(p==null)miss.push('価格');const d=vDate(D.date);if(!d)miss.push('日付');
    if(miss.length)return bad(`売却情報の必須項目（${miss.join('・')}）が欠けているか不正です`);
    W.soldCh=c;W.soldPrice=p;W.soldDate=d;
    if(has(D.fee)){const f=vYen(D.fee,true);if(f==null)return bad('手数料が不正です');W.soldFee=f}
    if(has(D.ship)){const f=vYen(D.ship,true);if(f==null)return bad('送料が不正です');W.soldShip=f}}
  P.stTo=D?'sold':(r.status==='deal'?'deal':'listed');
  const isSold=it.st==='sold';
  for(const k of Object.keys(W)){const v=W[k],cur=it[k];const empty=cur===undefined||cur===null||String(cur).trim()==='';
    const same=!empty&&(k==='listCh'||k==='soldCh'?chKey(cur)===v:YEN_K.has(k)?num(cur)===v:String(cur).trim()===String(v));
    if(same)continue;
    if(empty)P.changes.push({k,from:cur,to:v});
    else if(k==='listPrice'&&!isSold)P.changes.push({k,from:cur,to:v,rev:1});   // 出品中の価格改定は「事実の更新」として反映（旧価格は履歴へ）
    else P.conflicts.push({k,from:cur,to:v})}
  if(P.stTo&&it.st!==P.stTo){const f=FR[it.st]??0;if(FR[P.stTo]>f)P.changes.push({k:'st',from:it.st,to:P.stTo});else P.conflicts.push({k:'st',from:it.st,to:P.stTo})}
  P.status=P.conflicts.length?'conflict':P.changes.length?'apply':'noop';return P}
function resApplyOne(sssId,rid,changes,how){const it=getItem(sssId);if(!it)return false;
  for(const c of changes)it[c.k]=c.to;
  const W=Object.fromEntries(changes.map(c=>[c.k,c.to]));const rev=changes.find(c=>c.k==='listPrice'&&c.rev);
  let kind='edit',at=today();
  if(W.soldPrice!=null||W.st==='sold'){kind='sold';at=it.soldDate||at}else if(W.st==='listed'||W.listDate){kind='list';at=W.listDate||it.listDate||at}else if(rev)kind='price';
  const txt=changes.map(c=>`${FL[c.k]||c.k} ${c.rev?fmtV(c.k,c.from)+' → ':''}${fmtV(c.k,c.to)}`).join('、');
  addHist(it,{at:d10(at)||today(),kind,text:`新アプリの結果${how?`（${how}）`:''}：${txt}`,src:'import',rid});
  it.updated=new Date().toISOString();return true}
function diffHTML(list,cls){return list.map(c=>`<div class="diff"><span class="k">${esc(FL[c.k]||c.k)}</span>：${cls==='conf'?`<del>${esc(fmtV(c.k,c.from))}</del> ／ 取り込み値 <ins>${esc(fmtV(c.k,c.to))}</ins>`:`${c.from===undefined||c.from===null||c.from===''?'':`<del>${esc(fmtV(c.k,c.from))}</del> → `}<ins>${esc(fmtV(c.k,c.to))}</ins>`}</div>`).join('')}
function resPreviewOpen(txt){let arr;try{arr=resParse(txt)}catch(e){toast(e.message&&/JSON/.test(e.name+e.message)&&!/形式|format|多すぎ/.test(e.message)?'JSONを読み込めません':e.message);return}
  const seen=new Set();const plans=arr.map(r=>resPlan(r,seen));RES_PLAN=plans;
  const by=k=>plans.filter(p=>p.status===k);const A=by('apply'),C=by('conflict'),I=by('invalid'),Dp=by('dup'),N=by('noop');
  const card=(p,body)=>`<div class="card"><div style="font-weight:700;overflow-wrap:anywhere">${esc(p.name||p.sssId||'(不明)')}</div><div class="note">結果ID ${esc(p.rid||'—')}・アイテムID ${esc(p.sssId||'—')}</div>${body}</div>`;
  openSheet('結果の取り込み（差分の確認）',`<div class="card" id="resSum"><div class="kv"><span>反映する</span><b id="rsA">${A.length}件</b></div><div class="kv"><span>競合（上書きせず保留）</span><b id="rsC" style="${C.length?'color:var(--x)':''}">${C.length}件</b></div>
  <div class="kv"><span>取り込まない（必須項目の欠け・不正）</span><b id="rsI">${I.length}件</b></div><div class="kv"><span>取り込み済み（二重）</span><b id="rsD">${Dp.length}件</b></div><div class="kv"><span>変更なし</span><b id="rsN">${N.length}件</b></div></div>
  <div class="note">適用の直前に、今の全データを控え（別キー）に自動で保存します。念のためバックアップも書き出せます。</div>
  <div class="btns mt2"><button class="btn" data-act="doBackupKeep">先にバックアップを書き出す</button><button class="btn acc" data-act="resApply" ${A.length+C.length+N.length?'':'disabled'}>適用する</button></div>
  ${A.length?`<div class="sec">反映する変更</div>${A.map(p=>card(p,diffHTML(p.changes))).join('')}`:''}
  ${C.length?`<div class="sec">競合（今の記録と食い違うため保留。設定タブの「競合を確認する」で判断します）</div>${C.map(p=>card(p,diffHTML(p.conflicts,'conf')+(p.changes.length?`<div class="note mt1">ほかの変更（保留中は反映しません）</div>${diffHTML(p.changes)}`:''))).join('')}`:''}
  ${I.length?`<div class="sec">取り込まないもの</div>${I.map(p=>card(p,`<div class="note" style="color:var(--x)">${esc(p.reason)}</div>`)).join('')}`:''}
  ${Dp.length?`<div class="sec">二重（取り込まない）</div>${Dp.map(p=>card(p,`<div class="note">${esc(p.reason)}</div>`)).join('')}`:''}`)}
function resApplyAll(){const plans=RES_PLAN;if(!plans)return;
  if(!snapshot('結果の取り込みの直前')&&!confirm('取り込み前の控えを端末に保存できませんでした（容量不足の可能性）。先にバックアップを書き出すことをおすすめします。控えなしで続けますか？'))return;
  const at=new Date().toISOString();let a=0,c=0,n=0;
  for(const p of plans){
    if(p.status==='apply'){if(resApplyOne(p.sssId,p.rid,p.changes,'')){S.sync.applied[p.rid]={at,sssId:p.sssId,res:'applied'};a++}}
    else if(p.status==='conflict'){S.sync.conflicts.push({rid:p.rid,sssId:p.sssId,at,name:p.name,want:p.want,stTo:p.stTo,changes:p.changes,conflicts:p.conflicts});S.sync.applied[p.rid]={at,sssId:p.sssId,res:'pending'};c++}
    else if(p.status==='noop'){S.sync.applied[p.rid]={at,sssId:p.sssId,res:'noop'};n++}}
  S.meta.imports=(S.meta.imports||[]).concat([{at,kind:'results',add:a,conflict:c,noop:n,total:plans.length}]).slice(-30);
  RES_PLAN=null;if(!save())return;closeSheet();render();toast(`結果を取り込みました：反映${a}件・競合の保留${c}件・変更なし${n}件`);if(c)cfOpen()}
function cfOpen(){const L=S.sync.conflicts;
  openSheet('保留中の競合',L.length?`<div class="note mb2">新アプリの結果が、今の記録と食い違っています。どちらを残すか選んでください（上書きしても、元の値は履歴に残ります）。</div>${L.map((x,i)=>{const it=getItem(x.sssId);
    return `<div class="card" id="cf_${i}"><div style="font-weight:700;overflow-wrap:anywhere">${esc(it?it.name:x.name||x.sssId)}</div><div class="note">結果ID ${esc(x.rid)}・${esc(String(x.at||'').slice(0,10))}</div>${diffHTML(x.conflicts||[],'conf')}${(x.changes||[]).length?`<div class="note mt1">ほかの変更</div>${diffHTML(x.changes)}`:''}
    <div class="btns mt2"><button class="btn sm acc" data-act="cfTake" data-i="${i}">取り込み値で上書き</button><button class="btn sm" data-act="cfKeep" data-i="${i}">今の記録を残す</button></div></div>`}).join('')}`:'<div class="empty">保留中の競合はありません。</div>')}
function cfResolve(i,take){const x=S.sync.conflicts[i];if(!x)return;const it=getItem(x.sssId);
  if(take){if(!it){toast('アイテムが見つかりません');return}if(!confirm('取り込み値で今の記録を上書きします。よろしいですか？'))return;snapshot('競合の上書きの直前');
    const all=(x.changes||[]).concat(x.conflicts||[]).filter(c=>c&&FL[c.k]);resApplyOne(x.sssId,x.rid,all,'競合を取り込み値で解決')}
  else if(it)addHist(it,{kind:'edit',text:`新アプリの結果（${x.rid}）は採用せず、今の記録を残した：${(x.conflicts||[]).map(c=>`${FL[c.k]||c.k} ${fmtV(c.k,c.to)}`).join('、')}`,src:'manual'});
  S.sync.applied[x.rid]={at:new Date().toISOString(),sssId:x.sssId,res:take?'taken':'kept'};S.sync.conflicts.splice(i,1);
  if(!save())return;render();cfOpen();toast(take?'取り込み値で上書きしました':'今の記録を残しました')}

const SEDO_KNOWN=['id','name','code','genre','pub','author','setk','vols','cond','cost','ship','pack','other','store','date','st','pm','py','pr','pa','lo','hi','quotes','memo','tags'];
// SedoScope実データの項目 → SSSの項目（元の項目もそのまま残す）
const SEDO_MAP={lc:'listCh',lp:'listPrice',ldate:'listDate',ac:'soldCh',ap:'soldPrice',adate:'soldDate',afee:'soldFee',aship:'soldShip',apack:'soldPack',aother:'soldOther'};
const SEDO_KEEP={codeSrc:'コードの入力元',created:'作成日時',updated:'更新日時',src:'登録方法',inSet:'所属セット',members:'セットの構成巻',ed:'版',shipm:'発送方法',pmlo:'メルカリ想定（下）',pmhi:'メルカリ想定（上）',fromId:'コピー元'};
function applySedoSet(set){
  if(!set||typeof set!=='object')return [];const S2=S.settings,done=[];
  const n=v=>num(v);
  if(isFinite(n(set.trate))){S2.target=n(set.trate);done.push(`目標利益率 ${S2.target}%`)}
  for(const [k,c] of [['rm','m'],['ry','y'],['rr','r'],['ra','a']])if(isFinite(n(set[k]))){S2.ch[c].fee=n(set[k]);done.push(`${S2.ch[c].name}手数料 ${n(set[k])}%`)}
  if(isFinite(n(set.ship))){for(const c of CH)S2.ch[c].ship=n(set.ship);done.push(`送料 ${n(set.ship)}円（全販路）`)}
  if(isFinite(n(set.pack))){S2.pack=n(set.pack);done.push(`梱包費 ${S2.pack}円`)}
  if(isFinite(n(set.other))){S2.other=n(set.other);done.push(`その他費用 ${S2.other}円`)}
  if(isFinite(n(set.stale))){S2.fresh=n(set.stale);done.push(`鮮度 ${S2.fresh}日`)}
  if(set.mainCh&&CH.includes(set.mainCh)){S2.main=set.mainCh;done.push(`主販路 ${S2.ch[set.mainCh].name}`)}
  return done;
}

function parseSedo(txt){
  let o=safeParse(txt);
  if(o&&o.sedoscope_v1)o=typeof o.sedoscope_v1==='string'?safeParse(o.sedoscope_v1):o.sedoscope_v1;
  if(o&&o.data&&!Array.isArray(o.items)){o=typeof o.data==='string'?safeParse(o.data):o.data}
  if(Array.isArray(o))o={items:o};
  if(!o||!Array.isArray(o.items))throw new Error('items が見つかりません');
  return o;
}
function importSedo(src,mode,opt){
  const fieldCount={},unknown={},stMap={};const conv=[];let qTotal=0,qBad=0;
  for(const o of src.items){if(!o||typeof o!=='object')continue;const it=JSON.parse(JSON.stringify(o));
    for(const k of Object.keys(o)){if(SEDO_KNOWN.includes(k)){if(o[k]!==''&&o[k]!=null)fieldCount[k]=(fieldCount[k]||0)+1}else unknown[k]=(unknown[k]||0)+1}
    if(it.id===undefined||it.id===null||it.id==='')it.id=uid();
    const ns=normSt(o.st);if(String(o.st)!==ns){it.st_orig=o.st;stMap[String(o.st)]=ns}it.st=ns;
    const qs=Array.isArray(o.quotes)?o.quotes:[];it.quotes=[];
    for(const q of qs){const n=normQuote(q);if(!n){qBad++;continue}qTotal++;if(!(n.price>0)||!n.status)qBad++;it.quotes.push(n)}
    for(const [a,b] of Object.entries(SEDO_MAP))if(o[a]!==undefined&&o[a]!==''&&(it[b]===undefined||it[b]===''))it[b]=o[a];
    it._from='sedoscope';it._imported=today();conv.push(it)}
  // セット：巻範囲と手元の巻を構成巻から作る
  const byId=new Map(conv.map(i=>[String(i.id),i]));let setN=0;
  for(const it of conv){if(!/セット/.test(String(it.setk||''))&&!Array.isArray(it.members))continue;
    if(!it.range&&it.vols){const r=String(it.vols).normalize('NFKC').replace(/[〜～~]/g,'-').replace(/巻/g,'').trim();if(/^\d+(-\d+)?$/.test(r))it.range=r}
    if(!it.have&&Array.isArray(it.members)){const v=it.members.map(id=>byId.get(String(id))||getItem(id)).filter(Boolean).map(m=>num(m.vols)).filter(x=>x>0);if(v.length)it.have=v.join(',')}
    if(it.range)setN++}
  let added=0,skipped=0;
  if(mode==='replace'){S.items=conv;added=conv.length}
  else{const ids=new Set(S.items.map(i=>String(i.id)));for(const it of conv){if(ids.has(String(it.id))){skipped++;continue}S.items.push(it);ids.add(String(it.id));added++}}
  if(src.set!==undefined)S.meta.legacySet=src.set;if(src.meta!==undefined)S.meta.legacyMeta=src.meta;
  const setApplied=opt&&opt.applySet?applySedoSet(src.set):[];
  const sum={setApplied,setN,at:new Date().toISOString(),kind:'sedoscope',mode,src:src.items.length,conv:conv.length,added,skipped,qTotal,qBad,fieldCount,unknown,stMap};
  S.meta.imports=(S.meta.imports||[]).concat([{at:sum.at,kind:'sedoscope',mode,src:sum.src,added,skipped}]).slice(-30);
  save();return sum;
}

  設定：${s.setApplied.length?`SedoScopeから引き継ぎ（${esc(s.setApplied.join('、'))}）`:'引き継いでいません'}。元の設定内容は変更せず保存

function parseCSV(text){
  text=String(text).replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function importCSV(text,targetId,newName,src){
  const rows=parseCSV(text);if(!rows.length)throw new Error('CSVが空です');
  const h=rows[0].map(x=>String(x).trim());let ix={n:h.indexOf('商品名'),p:h.indexOf('価格'),s:h.indexOf('販売状況'),c:h.indexOf('商品の状態')};let body=rows.slice(1);
  if(ix.p<0){ix={n:0,p:1,s:2,c:3};body=rows}
  let it=targetId?getItem(targetId):null;let created=false;
  if(!it){const nm=(newName||'').trim()||String((body[0]||[])[ix.n]||'取り込み').slice(0,60);it=newItem({name:nm,st:'cand'});S.items.unshift(it);created=true}
  it.quotes=it.quotes||[];const seen=new Set(it.quotes.map(qKey));let add=0,dup=0,bad=0;const d=today();
  for(const r of body){const q=normQuote({title:ix.n>=0?r[ix.n]:'',price:r[ix.p],status:ix.s>=0?r[ix.s]:'',cond:ix.c>=0?r[ix.c]:'',src,date:d});q.imp='csv';
    if(!(q.price>0)||!q.status){bad++;continue}const k=qKey(q);if(seen.has(k)){dup++;continue}seen.add(k);it.quotes.push(q);add++}
  S.meta.imports=(S.meta.imports||[]).concat([{at:new Date().toISOString(),kind:'csv',item:it.id,src,add,dup,bad}]).slice(-30);
  save();return{total:body.length,add,dup,bad,it,created};
}

/* ============================================================
   バーコード読み取り（BarcodeDetector があれば使い、なければ内蔵のEAN-13解読）
   ============================================================ */
const LP=[[3,2,1,1],[2,2,2,1],[2,1,2,2],[1,4,1,1],[1,1,3,2],[1,2,3,1],[1,1,1,4],[1,3,1,2],[1,2,1,3],[3,1,1,2]];
const GP=LP.map(p=>p.slice().reverse());
const PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function matchDigit(R,o,left){
  const w=[R[o],R[o+1],R[o+2],R[o+3]],sum=w[0]+w[1]+w[2]+w[3];const v=w.map(x=>x*7/sum);let best=null,be=99;
  const test=(p,d,g)=>{let e=0;for(let k=0;k<4;k++)e+=Math.abs(v[k]-p[k]);if(e<be){be=e;best={d,g}}};
  LP.forEach((p,d)=>test(p,d,false));if(left)GP.forEach((p,d)=>test(p,d,true));
  return be<1.5?best:null;
}
function tryEAN(R,s){
  let W=0;for(let i=0;i<59;i++)W+=R[s+i];const m=W/95;
  for(const i of [0,1,2,27,28,29,30,31,56,57,58]){const g=R[s+i]/m;if(g<0.35||g>2.2)return null}
  if(s>0&&R[s-1]<m*2.5)return null;
  const dg=[];let par='';
  for(let d=0;d<6;d++){const r=matchDigit(R,s+3+d*4,true);if(!r)return null;dg.push(r.d);par+=r.g?'G':'L'}
  for(let d=0;d<6;d++){const r=matchDigit(R,s+32+d*4,false);if(!r)return null;dg.push(r.d)}
  const f=PAR.indexOf(par);if(f<0)return null;const code=f+dg.join('');return ean13ok(code)?code:null;
}
function decodeRow(L){
  const n=L.length,W=Math.max(10,n>>4);const pre=new Float64Array(n+1);for(let i=0;i<n;i++)pre[i+1]=pre[i]+L[i];
  let mn=255,mx=0;for(let i=0;i<n;i++){if(L[i]<mn)mn=L[i];if(L[i]>mx)mx=L[i]}if(mx-mn<40)return null;
  const gmid=(mn+mx)/2;
  const thr=[i=>gmid,
    i=>{const a=Math.max(0,i-W),b=Math.min(n,i+W);let lo=255,hi=0;for(let j=a;j<b;j+=2){if(L[j]<lo)lo=L[j];if(L[j]>hi)hi=L[j]}return hi-lo<(mx-mn)*0.3?gmid:(lo+hi)/2},
    i=>{const a=Math.max(0,i-W),b=Math.min(n,i+W);return Math.min((pre[b]-pre[a])/(b-a),gmid+(mx-mn)*0.25)}];
  for(const T of thr){
    const bits=new Uint8Array(n);for(let i=0;i<n;i++)bits[i]=L[i]<T(i)?1:0;
    const R=[],C=[];let c=bits[0],len=0;for(let i=0;i<n;i++){if(bits[i]===c)len++;else{R.push(len);C.push(c);c=bits[i];len=1}}R.push(len);C.push(c);
    for(let s=0;s+59<=R.length;s++){if(C[s]!==1)continue;const r=tryEAN(R,s);if(r)return r}
  }
  return null;
}
const cv=document.createElement('canvas');let cx=null;
function decodeImageData(img,W,H){
  for(let k=1;k<16;k++){const y=Math.round(H*k/16);const L=new Float32Array(W);
    for(let x=0;x<W;x++){let s=0;for(const dy of [-1,0,1]){const yy=Math.min(H-1,Math.max(0,y+dy));const i=(yy*W+x)*4;s+=img[i]*.299+img[i+1]*.587+img[i+2]*.114}L[x]=s/3}
    let r=decodeRow(L);if(!r)r=decodeRow(L.slice().reverse());if(r&&okScanCode(r))return r}
  return null;
}
function decodeFrame(v){
  const vw=v.videoWidth,vh=v.videoHeight;if(!vw)return null;const W=Math.min(1000,vw),sc=W/vw,H=Math.round(vh*0.5*sc);
  cv.width=W;cv.height=H;cx=cx||cv.getContext('2d',{willReadFrequently:true});cx.drawImage(v,0,vh*0.25,vw,vh*0.5,0,0,W,H);
  return decodeImageData(cx.getImageData(0,0,W,H).data,W,H);
}
const Scan={on:false,stream:null,det:null,last:'',lastT:0,cand:'',candN:0,timer:null,ac:null,wrapSel:'#camWrap',handler:null};
function beep(){try{Scan.ac=Scan.ac||new (window.AudioContext||window.webkitAudioContext)();const o=Scan.ac.createOscillator(),g=Scan.ac.createGain();o.frequency.value=1800;g.gain.value=.08;o.connect(g);g.connect(Scan.ac.destination);o.start();o.stop(Scan.ac.currentTime+.08)}catch(e){}}
async function startScan(wrapSel,handler){
  if(Scan.on)return;Scan.wrapSel=wrapSel||'#camWrap';Scan.handler=handler||null;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('この環境ではカメラを使えません。ISBNを入力してください');return}
  try{Scan.ac=Scan.ac||new (window.AudioContext||window.webkitAudioContext)();Scan.ac.resume&&Scan.ac.resume()}catch(e){}
  const w=$(Scan.wrapSel);if(!w)return;w.innerHTML=`<div id="cam"><video playsinline muted autoplay></video><div class="guide"></div><div class="hint">バーコードを赤線に合わせて横向きに（連続読み取り中）</div></div>`;
  const video=w.querySelector('video');
  try{Scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){w.innerHTML='';toast('カメラを起動できません（'+e.name+'）。設定でカメラを許可するか、ISBNを入力してください');return}

function stopScan(){Scan.on=false;clearTimeout(Scan.timer);if(Scan.stream){Scan.stream.getTracks().forEach(t=>t.stop());Scan.stream=null}const w=$(Scan.wrapSel||'#camWrap');if(w)w.innerHTML='';const rb=$('#regScanBtn');if(rb)rb.textContent='📷 読み取り開始';}
async function loop(video){
  if(!Scan.on)return;let code=null;
  try{if(Scan.det){const r=await Scan.det.detect(video);for(const b of r){if(okScanCode(b.rawValue)){code=b.rawValue;break}}}else code=decodeFrame(video)}catch(e){}
  if(code)onCode(code);Scan.timer=setTimeout(()=>loop(video),Scan.det?150:80);

function onCode(code){
  if(!Scan.det){if(code===Scan.cand)Scan.candN++;else{Scan.cand=code;Scan.candN=1}if(Scan.candN<2)return}
  const t=Date.now();if(code===Scan.last&&t-Scan.lastT<3000)return;Scan.last=code;Scan.lastT=t;
  beep();const c=$('#cam');if(c){c.classList.add('hit');setTimeout(()=>c.classList.remove('hit'),350)}
  if(Scan.handler)Scan.handler(code);
}

  if(it.st==='sold'){clear();later('この商品は売却済みです');return}
  const sp=num(q.get('soldPrice'));
  if(!isFinite(sp)){clear();later('売却価格を読み取れなかったため、売却登録を行いませんでした');return}
  let sd=String(q.get('soldDate')||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(sd))sd=today();
  let ch=String(q.get('soldCh')||'');if(!CH.includes(ch))ch='';
  const fr=q.get('soldFee');const fee=(fr!==null&&fr!==''&&isFinite(num(fr)))?num(fr):null;
  POSTA_PENDING={id:it.id,sp,sd,ch,fee};clear();
  openSheet('POSTAからの売却登録',`<div class="note mb2">POSTAの売上記録から渡された内容です。確認して「売却済みとして登録する」を押すと、この商品に反映されます。</div>
  <div class="card"><table><tr><td>商品名</td><td class="wrap">${esc(it.name||'(無題)')}</td></tr><tr><td>現在のステータス</td><td>${esc(ST[it.st]||it.st||'')}</td></tr>
  <tr><td>売却価格</td><td class="num">${yenT(sp)}</td></tr><tr><td>売却日</td><td class="num">${esc(sd)}</td></tr>
  <tr><td>販路</td><td>${ch?esc(S.settings.ch[ch].name):'（不明）'}</td></tr>${fee!==null?`<tr><td>手数料</td><td class="num">${yenT(fee)}</td></tr>`:''}</table></div>
  <div class="btns mt3"><button class="btn pri" data-act="postaSoldOk">売却済みとして登録する</button><button class="btn" data-act="postaSoldCancel">やめる</button></div>`);
}

/* ---------- 起動 ---------- */
function askPersist(){   // §6：起動時に navigator.storage.persist() を1回呼ぶ
  try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().then(r=>{PERSIST=!!r;if(UI.tab==='set'){const el=$('#persistTxt');if(el)el.textContent=PERSIST?'保護されています（自動で消されにくい状態）':'許可されませんでした（ホーム画面に追加すると通りやすくなります）'}}).catch(()=>{PERSIST='na'})}else PERSIST='na'}
  catch(e){PERSIST='na'}}
function bootSheet(){
  if(BOOT.parseErr){openSheet('保存データを読み込めませんでした',`<div class="banner red mb3">⚠️ この端末に保存されている SSS のデータを読み込めませんでした。データを上書きしないよう、保存を止めています。</div>
  <div class="note mb3">保存されていた中身は、そのまま控え（別キー）にも残しました。下のボタンで書き出して、国ちゃんに相談してください。バックアップファイルがあれば「設定 → 復元」で戻せます。</div>
  <div class="btns"><button class="btn pri" data-act="preExport">保存されていた中身を書き出す</button><button class="btn" data-act="restoreOpen">バックアップから復元</button></div>`);return}
  migrateSheet()}
boot();
askPersist();
setTab('stock');
if(BOOT.migrated||BOOT.hold)bootSheet();else postaSoldFromURL();
</script>
